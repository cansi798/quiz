<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Multiple-Choice-Trainer mit 200 Fragen und Prüfungssimulation für Lernfeld 1 der Ausbildung Kaufmann/Kauffrau im E-Commerce.">
<meta name="theme-color" content="#0E6E8C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LF1 Trainer">
<title>Lernfeld 1 Trainer · Kaufmann/Kauffrau im E-Commerce</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --surface-2:#F3F6F9;
  --ink:#0F1B2D;
  --muted:#52627A;
  --line:#DCE3EB;
  --primary:#0E6E8C;
  --primary-ink:#FFFFFF;
  --primary-soft:#E1F1F6;
  --accent:#F2A93B;
  --accent-ink:#7A4D00;
  --ok:#12704B;
  --ok-soft:#E3F6EC;
  --no:#AE2B3C;
  --no-soft:#FCE8EB;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.08);
  --radius:18px;
  --radius-s:12px;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --dock-h:76px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0E141C;
  --surface:#172130;
  --surface-2:#1E2A3B;
  --ink:#EAF0F6;
  --muted:#A3B2C3;
  --line:#2A3748;
  --primary:#4DBCDD;
  --primary-ink:#06202B;
  --primary-soft:#173A47;
  --accent:#F6B860;
  --accent-ink:#FFE1B0;
  --ok:#4AD39A;
  --ok-soft:#153A2C;
  --no:#FF7A8A;
  --no-soft:#46212A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  min-height:100dvh;
}
button{font-family:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--primary);color:var(--primary-ink);padding:10px 16px;border-radius:999px;font-weight:800;text-decoration:none}
.skip:focus{top:12px}

/* Kopf */
header.top{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.brand .mark{
  flex:none;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;
}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.tbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  height:40px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.tbtn:hover{border-color:var(--primary);color:var(--primary)}
.tbtn.icon{width:40px;padding:0;justify-content:center;font-size:18px}

/* Ansichten */
main{padding:18px 0 40px}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;margin-bottom:16px;
}
h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px;line-height:1.15}
h2{font-size:19px;font-weight:800;letter-spacing:-.2px;margin:0 0 4px}
h3{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}
p.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:var(--primary-ink);border:1px solid var(--primary);
  border-radius:999px;height:50px;padding:0 24px;font-size:16px;font-weight:800;cursor:pointer;
  transition:transform .12s ease,filter .12s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--primary);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn.danger{background:var(--surface);color:var(--no);border-color:var(--line)}
.btn.sm{height:42px;padding:0 18px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;padding:6px 2px;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Fortsetzen */
.resume{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--primary-soft),var(--surface));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
}
.resume .t{flex:1;min-width:180px}
.resume .t b{display:block;font-size:16px;font-weight:800}
.resume .t span{color:var(--muted);font-size:14px}

/* Schnellstart */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{
  border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-s);
  padding:14px 12px;cursor:pointer;text-align:left;min-height:84px;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  transition:transform .12s ease,border-color .12s ease;
}
.tile:hover{border-color:var(--primary)}
.tile:active{transform:scale(.97)}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1;color:var(--primary)}
.tile span{font-size:13px;color:var(--muted);font-weight:600}

/* Auswahl */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.opt{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-radius:var(--radius-s);
  padding:12px 14px;cursor:pointer;background:var(--surface);min-height:56px;
  transition:border-color .12s ease,background .12s ease;
}
label.opt:hover{border-color:var(--primary)}
label.opt input{margin-top:2px;accent-color:var(--primary);flex:none;width:20px;height:20px}
label.opt .t{font-size:14px;line-height:1.35;min-width:0}
label.opt .t b{display:block;font-weight:800}
label.opt .t span{color:var(--muted);font-size:13px}
label.opt:has(input:checked){background:var(--primary-soft);border-color:var(--primary)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;max-width:100%}
.seg button{
  border:0;background:transparent;border-radius:999px;height:40px;padding:0 16px;
  font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:700;background:none;border:0;padding:6px 0}
.switch i{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s ease;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s ease}
.switch[aria-pressed="true"] i{background:var(--primary)}
.switch[aria-pressed="true"] i::after{transform:translateX(18px)}
.modehint{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.startrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted);font-weight:700}

/* Fehlerkartei und Statistik auf der Startseite */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card.box{border-color:color-mix(in srgb,var(--no) 40%,var(--line))}
.bignum{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1;margin:6px 0 2px}
.bignum small{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:0;margin-left:4px}
.card .foot{margin-top:14px}

/* Fortschritt */
.progress{display:flex;gap:3px;height:8px;margin-bottom:10px}
.progress i{flex:1;border-radius:3px;background:var(--line);transition:background .25s ease}
.progress i.ok{background:var(--ok)}
.progress i.no{background:var(--no)}
.progress i.cur{background:var(--accent)}
.progress i.done{background:var(--primary)}
.progress.bar{gap:0}
.progress.bar i{border-radius:0}
.progress.bar i:first-child{border-radius:3px 0 0 3px}
.progress.bar i:last-child{border-radius:0 3px 3px 0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:800;font-size:15px}

/* Frage */
.qtext{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.2px;margin:0 0 18px}
.qtext:focus{outline:none}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{
  display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-s);
  padding:13px 14px;font-size:16px;font-weight:600;line-height:1.4;cursor:pointer;
  min-height:56px;transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.ans:hover:not(:disabled){border-color:var(--primary)}
.ans:active:not(:disabled){transform:scale(.985)}
.ans .k{
  flex:none;width:32px;height:32px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--muted);
}
.ans.right{background:var(--ok-soft);border-color:var(--ok);animation:pulse .45s ease}
.ans.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.wrong{background:var(--no-soft);border-color:var(--no);animation:shake .4s ease}
.ans.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.ans.picked{background:var(--primary-soft);border-color:var(--primary)}
.ans.picked .k{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.ans:disabled{cursor:default}
.ans.dim{opacity:.55}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.note{
  margin-top:16px;border-radius:var(--radius-s);padding:14px 16px;font-size:15px;line-height:1.5;
  background:var(--surface-2);border:1px solid var(--line);
  animation:rise .3s ease both;
}
.note b{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-weight:800}
.note.good{background:var(--ok-soft);border-color:var(--ok)}
.note.bad{background:var(--no-soft);border-color:var(--no)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.src{font-size:13px;color:var(--muted);margin-top:14px}
.revealrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.note:focus{outline:none}

/* Prüfung */
.card.exam{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface))}
.card.exam h2{margin-top:2px}
.card.exam .btn{margin-top:4px}
.pill{display:inline-flex;align-self:flex-start;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.timer.warn{color:var(--no);border-color:var(--no);background:var(--no-soft);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{opacity:.55}}
.ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:12px 0 16px}
.cell{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;cursor:pointer;color:var(--muted)}
.cell.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;margin:6px 0 4px;letter-spacing:.3px}
.badge.pass{background:var(--ok-soft);color:var(--ok)}
.badge.fail{background:var(--no-soft);color:var(--no)}

/* Aktionsleiste */
.dock{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.dock .mid{flex:1;text-align:center}
.dock .btn{min-width:120px}

/* Ergebnis */
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .val{stroke:var(--primary);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:44px;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring .num small{font-size:14px;color:var(--muted);font-weight:700;margin-left:2px}
.hero .t{flex:1;min-width:200px}
.hero .t .big{font-size:24px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px}
.hero .t p{margin:0;color:var(--muted);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
table.res{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
table.res th,table.res td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.res th{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
table.res td.num,table.res th.num{text-align:right;white-space:nowrap;font-weight:700}
table.res td small{display:block;color:var(--muted);font-weight:500}
.review{margin-top:6px}
.review .item{padding:16px 0;border-bottom:1px solid var(--line)}
.review .item:last-child{border-bottom:0}
.review .q{font-size:16px;font-weight:700;margin:0 0 8px;line-height:1.4}
.review .a{font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:flex-start}
.review .a .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.review .a.x .dot{background:var(--no)}
.review .a.k .dot{background:var(--ok)}
.review .a.e{color:var(--muted);margin-top:6px;display:block}
.review .a.src{color:var(--muted);font-size:12.5px;display:block}
.boxnote{margin-top:16px;padding:12px 14px;border-radius:var(--radius-s);background:var(--surface-2);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.boxnote b{color:var(--ink)}

/* Statistik */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.kpi b.up{color:var(--ok)}
.kpi b.down{color:var(--no)}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.barrow .lbl b{font-weight:800}
.barrow .lbl small{display:block;color:var(--muted);font-size:12.5px}
.barrow .pct{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.barrow .pct small{color:var(--muted);font-weight:600;font-size:12px;display:block}
.barrow .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.barrow .fill{display:block;height:100%;border-radius:4px;background:var(--primary);transition:width .6s ease}
.barrow.weak .fill{background:var(--no)}
.barrow.strong .fill{background:var(--ok)}
.hist{list-style:none;margin:6px 0 0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--muted);font-size:12.5px;display:block}
.hist .q{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .badge{margin:0 8px 0 0;padding:2px 9px;font-size:11.5px}
.empty{color:var(--muted);font-size:14px;margin:8px 0 0}

/* Hinweis unten */
.toast{
  position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  display:flex;gap:12px;align-items:center;max-width:calc(100% - 28px);
  background:var(--ink);color:var(--bg);padding:12px 14px 12px 18px;border-radius:999px;box-shadow:var(--shadow);font-size:14px;font-weight:600;
}
.toast .btn{height:36px;padding:0 14px;font-size:13px;background:var(--bg);color:var(--ink);border-color:transparent}
body.quiz .toast{bottom:calc(var(--dock-h) + 20px + env(safe-area-inset-bottom))}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 20px 30px}

/* Mobil */
@media(max-width:720px){
  .wrap{padding:0 14px}
  .bar{height:56px}
  main{padding:14px 0 calc(var(--dock-h) + env(safe-area-inset-bottom) + 12px)}
  .card{padding:18px 16px;border-radius:16px}
  h1{font-size:23px}
  .quick{grid-template-columns:repeat(3,1fr);gap:8px}

  body.quiz .dock{

}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{header.top,.dock,.btn,.tbtn,.toast{display:none}}
</style>

<body>
<a class="skip" href="#app">Zum Inhalt springen</a>
<header class="top">
  <div class="wrap bar">
    <button class="brand" id="home" aria-label="Zur Startseite">
      <span class="mark" aria-hidden="true">LF1</span>
      <span><b>Lernfeld 1 Trainer</b><span>Kaufmann/Kauffrau im E-Commerce</span></span>
    </button>
    <div class="tools">
      <button class="tbtn" id="toSel" hidden>Auswahl</button>
      <button class="tbtn icon" id="themeBtn" aria-label="Hell oder dunkel umschalten" title="Hell oder dunkel">☾</button>
    </div>
  </div>
</header>

<main><div class="wrap" id="app" tabindex="-1"></div></main>
<div class="vh" id="live" aria-live="polite" aria-atomic="true"></div>
<footer class="wrap">200 Multiple-Choice-Fragen aus den Tagesquiz der Seminartage 1 bis 5. Antworten werden bei jedem Durchlauf neu gemischt.</footer>

<script>
/*__DATA__*/

/* ---------- Speicher ---------- */
const KEY={settings:"lf1.settings",run:"lf1.run",theme:"lf1.theme",box:"lf1.box",history:"lf1.history"};
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function drop(k){try{localStorage.removeItem(k);}catch(e){}}

/* ---------- Zustand ---------- */
const S={
  view:"start",
  picked:new Set(),
  mode:"ueben",
  shuffle:true,
  items:[],
  answers:[],
  idx:0,
  label:"",
  exam:null,      /* {deadline, limitMs, startedAt, endedAt} nur im Prüfungssimulator */
  overview:false,
  logged:false,   /* Durchlauf schon in Statistik und Fehlerkartei übernommen */
  newBox:0,       /* im Durchlauf neu in die Fehlerkartei gekommen */
  focus:null      /* Fokusziel nach dem Rendern */
};
const EXAM={count:30,minutes:60,perPart:2,pass:50};
const BOX_STREAK=2;   /* so oft hintereinander richtig, dann raus aus der Fehlerkartei */
const HISTORY_MAX=200;
const allKeys=[];
DATA.forEach(d=>d.parts.forEach((p,i)=>allKeys.push(d.day+"-"+i)));
(function initSettings(){
  const st=load(KEY.settings);
  if(st&&Array.isArray(st.picked)){st.picked.forEach(k=>S.picked.add(k));}
  else allKeys.forEach(k=>S.picked.add(k));
  if(st&&st.mode)S.mode=st.mode;
  if(st&&typeof st.shuffle==="boolean")S.shuffle=st.shuffle;
})();
function saveSettings(){save(KEY.settings,{picked:[...S.picked],mode:S.mode,shuffle:S.shuffle});}
function saveRun(){
  if(S.view==="quiz"||S.view==="result")save(KEY.run,{items:S.items,answers:S.answers,idx:S.idx,mode:S.mode,label:S.label,exam:S.exam,logged:S.logged,newBox:S.newBox,finished:S.view==="result"});
}

const app=document.getElementById("app");
const live=document.getElementById("live");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET=["A","B","C","D"];
function say(t){live.textContent="";setTimeout(()=>{live.textContent=t;},50);}
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function mixAnswers(q){const order=shuffled(q.o.map((_,i)=>i));return {o:order.map(i=>q.o[i]),c:order.indexOf(q.c)};}
function remix(it){const m=mixAnswers(it);return {...it,o:m.o,c:m.c};}
function fmtDate(iso){return new Date(iso).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});}

/* Fragenliste aus Auswahl bauen; id ist stabil über Sitzungen */
function collect(keys){
  const list=[];
  DATA.forEach(d=>d.parts.forEach((p,i)=>{
    const key=d.day+"-"+i;
    if(!keys.has(key))return;
    p.mc.forEach((q,n)=>{
      const m=mixAnswers(q);
      list.push({id:key+"-"+(n+1),key:key,day:d.day,part:p.name,topic:p.topic,ref:p.src,no:n+1,q:q.q,o:m.o,c:m.c,e:q.e});
    });
  }));
  return list;
}
function startRun(list,label,exam){
  if(!list.length)return;
  S.items=list;S.answers=list.map(()=>null);S.idx=0;S.label=label;S.exam=exam||null;
  S.overview=false;S.logged=false;S.newBox=0;S.focus="q";
  S.view="quiz";saveRun();render();window.scrollTo(0,0);
}

/* ---------- Fehlerkartei ---------- */
function boxAll(){return load(KEY.box)||{};}
function inBox(e){return !!e&&e.w>0&&e.s<BOX_STREAK;}
function boxIds(){const b=boxAll();return Object.keys(b).filter(id=>inBox(b[id]));}
/* Merkt sich das Ergebnis einer Frage; gibt true zurück, wenn sie neu in die Kartei kam */
function boxRecord(id,ok,box){
  const e=box[id]||{w:0,s:0,t:0};
  const before=inBox(e);
  if(ok)e.s++;else{e.w++;e.s=0;}
  e.t=Date.now();
  box[id]=e;
  return !before&&inBox(e);
}
function boxQuestions(){
  const ids=new Set(boxIds());
  return shuffled(collect(new Set(allKeys)).filter(q=>ids.has(q.id)));
}

/* ---------- Statistik ---------- */
function history(){return load(KEY.history)||[];}
function logRun(){
  if(S.logged)return;
  S.logged=true;
  const box=boxAll();
  let answered=0,right=0;
  const parts={};
  S.items.forEach((it,i)=>{
    const a=S.answers[i];
    parts[it.key]=parts[it.key]||[0,0];
    parts[it.key][1]++;
    if(a===null)return;
    answered++;
    if(a.ok){right++;parts[it.key][0]++;}
    /* Im Übungsmodus wurde schon bei der Antwort gezählt */
    if(S.mode!=="ueben"&&boxRecord(it.id,a.ok,box))S.newBox++;
  });
  if(S.mode!=="ueben")save(KEY.box,box);
  if(!answered)return;
  const h=history();
  const pct=Math.round(right/S.items.length*100);
  h.push({d:new Date().toISOString(),label:S.label,exam:!!S.exam,passed:S.exam?pct>=EXAM.pass:null,r:right,n:S.items.length,pct:pct,parts:parts});
  save(KEY.history,h.slice(-HISTORY_MAX));
}
function partStats(h){
  const agg={};
  h.forEach(run=>Object.keys(run.parts||{}).forEach(k=>{agg[k]=agg[k]||[0,0];agg[k][0]+=run.parts[k][0];agg[k][1]+=run.parts[k][1];}));
  const out=[];
  DATA.forEach(d=>d.parts.forEach((p,i)=>{
    const k=d.day+"-"+i,a=agg[k];
    out.push({key:k,day:d.day,part:p.name,topic:p.topic,r:a?a[0]:0,n:a?a[1]:0,pct:a&&a[1]?Math.round(a[0]/a[1]*100):null});
  }));
  return out;
}
function avg(list){return list.length?Math.round(list.reduce((s,x)=>s+x.pct,0)/list.length):null;}

/* ---------- Prüfungssimulator ---------- */
function examList(){
  const byPart=[];
  DATA.forEach(d=>d.parts.forEach((p,i)=>byPart.push(shuffled(collect(new Set([d.day+"-"+i]))))));
  let list=[],rest=[];
  byPart.forEach(qs=>{list=list.concat(qs.slice(0,EXAM.perPart));rest=rest.concat(qs.slice(EXAM.perPart));});
  list=list.concat(shuffled(rest).slice(0,Math.max(0,EXAM.count-list.length)));
  return shuffled(list).slice(0,EXAM.count);
}
function startExam(){
  const now=Date.now(),limitMs=EXAM.minutes*60000;
  if(!S.exam)S.prevMode=S.mode;
  S.mode="pruefen";
  startRun(examList(),"Prüfungssimulation",{startedAt:now,deadline:now+limitMs,limitMs:limitMs,endedAt:null});
}
function fmtTime(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
let timerId=null,warned=false;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function tickTimer(){
  if(S.view!=="quiz"||!S.exam){stopTimer();return;}
  const left=S.exam.deadline-Date.now();
  const el=document.getElementById("timer");
  if(el){el.textContent=fmtTime(left);el.classList.toggle("warn",left<=5*60000);}
  if(left<=5*60000&&left>0&&!warned){warned=true;say("Noch fünf Minuten.");}
  if(left<=0){finish();}
}
function startTimer(){stopTimer();tickTimer();timerId=setInterval(tickTimer,1000);}

/* ---------- Theme ---------- */
(function initTheme(){
  const stored=load(KEY.theme);
  const dark=stored?stored==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(dark?"dark":"light");
})();
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const b=document.getElementById("themeBtn");
  b.textContent=t==="dark"?"☀":"☾";
  b.setAttribute("aria-label",t==="dark"?"Zum hellen Design wechseln":"Zum dunklen Design wechseln");
}
document.getElementById("themeBtn").addEventListener("click",()=>{
  const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  applyTheme(t);save(KEY.theme,t);
});

/* ---------- Kopfbuttons ---------- */
document.getElementById("home").addEventListener("click",goStart);
document.getElementById("toSel").addEventListener("click",goStart);
function goStart(){saveRun();S.view="start";S.focus="top";render();window.scrollTo(0,0);}

/* ---------- Startseite ---------- */
function viewStart(){
  const run=load(KEY.run);
  const st=load(KEY.settings);S.mode=(st&&st.mode)||S.prevMode||"ueben";
  let resume="";
  if(run&&run.items&&run.items.length&&!run.finished){
    const done=run.answers.filter(x=>x!==null).length;
    const left=run.exam?(run.exam.deadline-Date.now()):null;
    const info=run.exam?(left>0?"noch "+fmtTime(left)+" Minuten":"Zeit abgelaufen"):(run.mode==="ueben"?"Üben":"Prüfen");
    resume='<div class="resume"><div class="t"><b>'+(run.exam?"Prüfung fortsetzen":"Durchlauf fortsetzen")+'</b><span>'+esc(run.label)+' · '+done+' von '+run.items.length+' beantwortet · '+info+'</span></div>'+
      '<div class="row"><button class="btn sm" id="resume">Fortsetzen</button><button class="btn sm ghost" id="discard">Verwerfen</button></div></div>';
  }

  const boxN=boxIds().length;
  const h=history();
  const last5=avg(h.slice(-5));
  const boxCard='<div class="card box"><div class="eyebrow">Fehlerkartei</div>'+
    '<div class="bignum">'+boxN+'<small>'+(boxN===1?"Frage":"Fragen")+'</small></div>'+
    (boxN?'<p class="lead" style="margin-bottom:0">Falsch beantwortet und noch nicht '+BOX_STREAK+'-mal in Folge richtig.</p><div class="foot"><button class="btn wide" id="box">Schwachstellen üben</button></div>'
         :'<p class="lead" style="margin-bottom:0">Leer. Falsch beantwortete Fragen landen hier und verschwinden, sobald du sie '+BOX_STREAK+'-mal in Folge richtig hast.</p>')+
    '</div>';
  const statCard='<div class="card"><div class="eyebrow">Statistik</div>'+
    '<div class="bignum">'+(h.length?h.length:"0")+'<small>'+(h.length===1?"Durchlauf":"Durchläufe")+'</small></div>'+
    '<p class="lead" style="margin-bottom:0">'+(h.length?"Zuletzt im Schnitt "+last5+" Prozent richtig.":"Noch keine abgeschlossenen Durchläufe.")+'</p>'+
    '<div class="foot"><button class="btn wide ghost" id="stats"'+(h.length?"":" disabled")+'>Statistik anzeigen</button></div></div>';

  let picks="";
  DATA.forEach(d=>{
    picks+='<h3>'+esc(d.title)+'</h3><div class="pick">';
    d.parts.forEach((p,i)=>{
      const key=d.day+"-"+i;
      picks+='<label class="opt"><input type="checkbox" data-key="'+key+'"'+(S.picked.has(key)?" checked":"")+
      '><span class="t"><b>'+esc(p.name)+'</b><span>'+esc(p.topic)+'</span></span></label>';
    });
    picks+='</div>';
  });

  app.innerHTML='<div class="view">'+resume+
    '<div class="card">'+
      '<h1 id="h1" tabindex="-1">Was möchtest du üben?</h1>'+
      '<p class="lead">Schnell starten oder unten die Quizteile selbst zusammenstellen.</p>'+
      '<h3 style="margin-top:0">Schnellstart</h3>'+
      '<div class="quick">'+
        '<button class="tile" data-n="20"><b>20</b><span>zufällige Fragen</span></button>'+
        '<button class="tile" data-n="50"><b>50</b><span>zufällige Fragen</span></button>'+
        '<button class="tile" data-n="200"><b>200</b><span>alle Fragen</span></button>'+
      '</div>'+
      '<h3>Modus</h3>'+
      '<div class="between">'+
        '<div class="seg" id="modes" role="group" aria-label="Modus">'+
          '<button data-m="ueben" aria-pressed="'+(S.mode==="ueben")+'">Üben</button>'+
          '<button data-m="pruefen" aria-pressed="'+(S.mode==="pruefen")+'">Prüfen</button>'+
        '</div>'+
        '<button class="switch" id="shf" aria-pressed="'+S.shuffle+'"><i aria-hidden="true"></i>Fragen mischen</button>'+
      '</div>'+
      '<p class="modehint" id="modehint"></p>'+
    '</div>'+
    '<div class="card exam">'+
      '<div class="between"><div><div class="eyebrow">Prüfungssimulation</div><h2>'+EXAM.count+' Fragen in '+EXAM.minutes+' Minuten</h2></div><span class="pill">Bestanden ab '+EXAM.pass+' %</span></div>'+
      '<p class="lead">Zufällige Fragen aus allen Quizteilen, keine Auflösung während der Prüfung. Fragen lassen sich überspringen und später ändern. Nach Ablauf der Zeit wird automatisch ausgewertet.</p>'+
      '<button class="btn wide" id="exam">Prüfung starten</button>'+
    '</div>'+
    '<div class="duo">'+boxCard+statCard+'</div>'+
    '<div class="card">'+
      '<div class="between"><h2>Eigene Auswahl</h2><span class="row"><button class="link" id="all">Alle</button><button class="link" id="none">Keine</button></span></div>'+
      picks+
      '<div class="startrow"><span class="count" id="cnt" aria-live="polite"></span><button class="btn" id="go">Auswahl starten</button></div>'+
    '</div>'+
  '</div>';

  const r=document.getElementById("resume");
  if(r){
    r.addEventListener("click",()=>{
      S.items=run.items;S.answers=run.answers;S.idx=Math.min(run.idx,run.items.length-1);S.mode=run.mode;S.label=run.label;S.exam=run.exam||null;
      S.overview=false;S.logged=!!run.logged;S.newBox=run.newBox||0;S.focus="q";
      if(S.exam&&Date.now()>=S.exam.deadline){finish();return;}
      S.view="quiz";render();window.scrollTo(0,0);
    });
    document.getElementById("discard").addEventListener("click",()=>{drop(KEY.run);render();});
  }
  document.getElementById("exam").addEventListener("click",startExam);
  const bx=document.getElementById("box");
  if(bx)bx.addEventListener("click",()=>{S.mode="ueben";startRun(boxQuestions(),"Fehlerkartei");});
  document.getElementById("stats").addEventListener("click",()=>{S.view="stats";S.focus="top";render();window.scrollTo(0,0);});
  app.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{
    const n=+b.dataset.n;
    const all=collect(new Set(allKeys));
    const list=n>=all.length?(S.shuffle?shuffled(all):all):shuffled(all).slice(0,n);
    startRun(list,n>=all.length?"Alle 200 Fragen":n+" zufällige Fragen");
  }));
  const boxes=app.querySelectorAll('input[data-key]');
  boxes.forEach(el=>el.addEventListener("change",()=>{
    el.checked?S.picked.add(el.dataset.key):S.picked.delete(el.dataset.key);
    saveSettings();count();
  }));
  document.getElementById("all").addEventListener("click",()=>{boxes.forEach(el=>{el.checked=true;S.picked.add(el.dataset.key);});saveSettings();count();});
  document.getElementById("none").addEventListener("click",()=>{boxes.forEach(el=>{el.checked=false;});S.picked.clear();saveSettings();count();});
  const hint=()=>{document.getElementById("modehint").textContent=S.mode==="ueben"?"Nach jeder Antwort siehst du sofort Lösung und Erklärung.":"Erst am Ende siehst du die Auswertung mit allen Lösungen.";};
  hint();
  app.querySelectorAll('#modes button').forEach(b=>b.addEventListener("click",()=>{
    S.mode=b.dataset.m;saveSettings();hint();
    app.querySelectorAll('#modes button').forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===S.mode));
  }));
  document.getElementById("shf").addEventListener("click",e=>{
    S.shuffle=!S.shuffle;saveSettings();e.currentTarget.setAttribute("aria-pressed",S.shuffle);
  });
  document.getElementById("go").addEventListener("click",()=>{
    let list=collect(S.picked);
    if(S.shuffle)list=shuffled(list);
    const parts=S.picked.size;
    startRun(list,parts===allKeys.length?"Alle Quizteile":parts+" Quizteil"+(parts===1?"":"e"));
  });
  count();
  function count(){
    let n=0;
    DATA.forEach(d=>d.parts.forEach((p,i)=>{if(S.picked.has(d.day+"-"+i))n+=p.mc.length;}));
    document.getElementById("cnt").textContent=n?n+" Fragen ausgewählt":"Kein Quizteil ausgewählt";
    document.getElementById("go").disabled=n===0;
  }
}

/* ---------- Frageansicht ---------- */
function viewQuiz(){
  const it=S.items[S.idx], a=S.answers[S.idx];
  const n=S.items.length;
  const done=S.answers.filter(x=>x!==null).length;
  /* Auflösung: im Übungsmodus automatisch, im Prüfmodus auf Wunsch per Button (nicht in der Prüfungssimulation) */
  const show=a!==null&&(S.mode==="ueben"||!!a.rev);
  const canReveal=S.mode==="pruefen"&&!S.exam&&a!==null&&!a.rev;

  let prog='<div class="progress'+(n>60?" bar":"")+'" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+done+'" aria-valuetext="'+done+' von '+n+' beantwortet">';
  if(n>60){
    const pct=Math.round(done/n*100);
    prog+='<i class="done" style="flex:'+Math.max(pct,0)+'"></i><i style="flex:'+(100-pct)+'"></i>';
  }else{
    S.items.forEach((_,i)=>{
      const x=S.answers[i];let cls="";
      if(x!==null)cls=(S.mode==="ueben"||x.rev)?(x.ok?"ok":"no"):"done";
      if(i===S.idx)cls+=" cur";
      prog+='<i class="'+cls.trim()+'"></i>';
    });
  }
  prog+='</div>';

  const locked=show;
  let body='<div class="answers" role="group" aria-label="Antworten">'+it.o.map((o,i)=>{
    let cls="ans";
    if(show){ if(i===it.c)cls+=" right"; else if(a.pick===i)cls+=" wrong"; else cls+=" dim"; }
    else if(a!==null&&a.pick===i)cls+=" picked";
    const pressed=S.mode==="pruefen"?' aria-pressed="'+(a!==null&&a.pick===i)+'"':'';
    return '<button class="'+cls+'" data-pick="'+i+'"'+(locked?" disabled":"")+pressed+'><span class="k" aria-hidden="true">'+LET[i]+'</span><span>'+esc(o)+'</span></button>';
  }).join("")+'</div>';
  if(show)body+='<div class="note '+(a.ok?"good":"bad")+'" role="status"><b>'+(a.ok?"✓ Richtig":"✕ Leider falsch, richtig ist "+LET[it.c])+'</b>'+esc(it.e)+'</div>';
  if(canReveal)body+='<div class="revealrow"><button class="btn sm ghost" id="reveal">Auflösung zeigen</button><span class="count">Danach ist die Antwort festgelegt.</span></div>';

  let overview="";
  if(S.mode==="pruefen"&&S.overview){
    const open=S.answers.filter(x=>x===null).length;
    overview='<div class="card ov"><div class="between"><h2>Übersicht</h2><span class="count">'+(open?open+" offen":"alle beantwortet")+'</span></div>'+
      '<div class="grid">'+S.items.map((_,i)=>'<button class="cell'+(S.answers[i]!==null?" done":"")+(i===S.idx?" cur":"")+'" data-jump="'+i+'" aria-label="Frage '+(i+1)+(S.answers[i]!==null?", beantwortet":", offen")+'">'+(i+1)+'</button>').join("")+'</div>'+
      '<button class="btn wide" id="submit">'+(S.exam?"Prüfung abgeben":"Jetzt auswerten")+(open?" ("+open+" offen)":"")+'</button></div>';
  }
  const timer=S.exam?'<span class="timer" id="timer" role="timer" aria-label="Restzeit">'+fmtTime(S.exam.deadline-Date.now())+'</span>':'';

  app.innerHTML='<div class="view"><div class="card">'+
    prog+
    '<div class="meta"><span>Frage <b>'+(S.idx+1)+'</b> von '+n+'</span>'+(S.exam?timer:'<span>Tag '+it.day+' · '+esc(it.part)+' · '+esc(it.topic)+'</span>')+'</div>'+
    '<h2 class="qtext" id="qtext" tabindex="-1">'+esc(it.q)+'</h2>'+
    body+
    (S.exam?'':'<p class="src">Fundstelle: '+esc(it.ref)+'</p>')+
  '</div>'+overview+'</div>'+
  '<div class="dock">'+
    '<button class="btn ghost" id="prev"'+(S.idx===0?" disabled":"")+'>Zurück</button>'+
    '<span class="mid">'+(S.mode==="pruefen"?'<button class="link" id="ov" aria-expanded="'+S.overview+'">'+(S.overview?"Schließen":"Übersicht")+'</button>':'<button class="link" id="stop">Auswertung</button>')+'</span>'+
    '<button class="btn" id="next">'+(S.idx===n-1?(S.exam?"Abgeben":"Auswerten"):"Weiter")+'</button>'+
  '</div>';

  app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.pick)));
  document.getElementById("prev").addEventListener("click",()=>go(-1));
  document.getElementById("next").addEventListener("click",()=>go(1));
  const stop=document.getElementById("stop");if(stop)stop.addEventListener("click",finish);
  const rv=document.getElementById("reveal");if(rv)rv.addEventListener("click",()=>{S.answers[S.idx].rev=true;S.focus="note";saveRun();render();});
  const ov=document.getElementById("ov");if(ov)ov.addEventListener("click",()=>{S.overview=!S.overview;S.focus=S.overview?"ov":null;render();if(S.overview){const c=app.querySelector(".ov");if(c)c.scrollIntoView({behavior:"smooth",block:"start"});}});
  app.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener("click",()=>{S.idx=+b.dataset.jump;S.overview=false;S.focus="q";saveRun();render();window.scrollTo(0,0);}));
  const sub=document.getElementById("submit");if(sub)sub.addEventListener("click",finish);
  if(S.exam)startTimer();else stopTimer();
}
function answer(i){
  const it=S.items[S.idx];
  const first=S.answers[S.idx]===null;
  const ok=i===it.c;
  S.answers[S.idx]={pick:i,ok:ok};
  if(S.mode==="ueben"&&first){
    const box=boxAll();
    if(boxRecord(it.id,ok,box))S.newBox++;
    save(KEY.box,box);
  }
  saveRun();
  if(S.mode==="pruefen"){
    if(first&&S.idx<S.items.length-1)go(1);else{S.focus="pick:"+i;render();}
  }else{S.focus="note";render();}
}
function go(step){
  const n=S.idx+step;
  if(n<0)return;
  if(n>=S.items.length){finish();return;}
  S.idx=n;S.focus="q";saveRun();render();window.scrollTo(0,0);
}
function finish(){
  stopTimer();warned=false;
  if(S.exam&&!S.exam.endedAt)S.exam.endedAt=Math.min(Date.now(),S.exam.deadline);
  S.overview=false;S.view="result";S.focus="top";
  logRun();
  saveRun();render();window.scrollTo(0,0);
}

/* ---------- Auswertung ---------- */
function viewResult(){
  const total=S.items.length;
  let right=0,answered=0;
  const perPart={};
  S.items.forEach((it,i)=>{
    const a=S.answers[i];
    const key=it.day+"|"+it.part;
    perPart[key]=perPart[key]||{day:it.day,part:it.part,topic:it.topic,r:0,n:0};
    perPart[key].n++;
    if(a===null)return;
    answered++;
    if(a.ok){right++;perPart[key].r++;}
  });
  const pct=total?Math.round(right/total*100):0;
  const color=pct>=81?"var(--ok)":pct>=50?"var(--accent)":"var(--no)";
  const R=56,C=2*Math.PI*R;

  let rows="";
  Object.values(perPart).sort((a,b)=>a.day-b.day||a.part.localeCompare(b.part,"de",{numeric:true})).forEach(p=>{
    rows+='<tr><td>Tag '+p.day+' · '+esc(p.part)+'<small>'+esc(p.topic)+'</small></td><td class="num">'+p.r+' / '+p.n+'</td><td class="num">'+Math.round(p.r/p.n*100)+' %</td></tr>';
  });

  const wrong=[];
  S.items.forEach((it,i)=>{const a=S.answers[i];if(a===null||!a.ok)wrong.push(i);});
  let list="";
  wrong.forEach(i=>{
    const it=S.items[i],a=S.answers[i];
    const mine=a===null?"nicht beantwortet":LET[a.pick]+") "+it.o[a.pick];
    list+='<div class="item"><p class="q">'+esc(it.q)+'</p>'+
      '<p class="a x"><span class="dot" aria-hidden="true"></span><span>Deine Antwort: '+esc(mine)+'</span></p>'+
      '<p class="a k"><span class="dot" aria-hidden="true"></span><span>Richtig: '+LET[it.c]+') '+esc(it.o[it.c])+'</span></p>'+
      '<p class="a e">'+esc(it.e)+'</p>'+
      '<p class="a src">Tag '+it.day+' · '+esc(it.part)+' · '+esc(it.ref)+'</p></div>';
  });
  const boxN=boxIds().length;
  const boxnote=(S.newBox||wrong.length)?'<div class="boxnote">'+(S.newBox?'<b>'+S.newBox+(S.newBox===1?' Frage':' Fragen')+' neu in der Fehlerkartei.</b> ':'')+'Dort liegen jetzt '+boxN+(boxN===1?' Frage':' Fragen')+'. Über die Startseite kannst du sie gezielt üben.</div>':'';

  app.innerHTML='<div class="view"><div class="card">'+
    '<h1 class="vh" id="h1" tabindex="-1">Auswertung</h1>'+
    '<div class="hero">'+
      '<div class="ring" aria-hidden="true"><svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="'+R+'"/><circle class="val" cx="66" cy="66" r="'+R+'" style="stroke:'+color+';stroke-dasharray:'+C+';stroke-dashoffset:'+C+'"/></svg><div class="num"><span id="pctNum">0</span><small>%</small></div></div>'+
      '<div class="t"><div class="eyebrow">'+esc(S.label)+'</div>'+
        (S.exam?'<span class="badge '+(pct>=EXAM.pass?"pass":"fail")+'">'+(pct>=EXAM.pass?"Bestanden":"Nicht bestanden")+'</span>':'')+
        '<p class="big">'+right+' von '+total+' richtig, '+pct+' Prozent</p>'+
        '<p>'+bewertung(pct)+(answered<total?' '+(total-answered)+' Fragen blieben offen.':'')+
        (S.exam?' Benötigte Zeit '+fmtTime(S.exam.endedAt-S.exam.startedAt)+' von '+EXAM.minutes+':00 Minuten'+(S.exam.endedAt>=S.exam.deadline?', die Zeit war abgelaufen':'')+'.':'')+'</p></div>'+
    '</div>'+
    boxnote+
    '<div class="actions">'+
      (S.exam?'<button class="btn" id="newexam">Neue Prüfung</button>':'')+
      '<button class="btn'+(S.exam?" soft":"")+'" id="restart">Gleiche Fragen erneut</button>'+
      (wrong.length?'<button class="btn soft" id="repeat">Nur die '+wrong.length+' falschen üben</button>':'')+
      '<button class="btn ghost" id="again">Neue Auswahl</button>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h2>Nach Quizteil</h2><table class="res"><tr><th scope="col">Quizteil</th><th scope="col" class="num">Richtig</th><th scope="col" class="num">Quote</th></tr>'+rows+'</table></div>'+
  (wrong.length?'<div class="card"><h2>Zum Nacharbeiten</h2><p class="lead">Falsch oder offen, jeweils mit Lösung und Erklärung.</p><div class="review">'+list+'</div></div>':'<div class="card"><h2>Alles richtig</h2><p class="lead">Keine offenen Fragen in diesem Durchlauf.</p></div>')+
  '</div>';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const v=app.querySelector(".ring .val");
    if(v)v.style.strokeDashoffset=C*(1-pct/100);
    const num=document.getElementById("pctNum");
    const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){num.textContent=pct;return;}
    const t0=performance.now();
    (function tick(t){const k=Math.min(1,(t-t0)/900);num.textContent=Math.round(pct*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);})(t0);
  }));

  document.getElementById("again").addEventListener("click",()=>{drop(KEY.run);S.view="start";S.focus="top";render();window.scrollTo(0,0);});
  const ne=document.getElementById("newexam");if(ne)ne.addEventListener("click",startExam);
  document.getElementById("restart").addEventListener("click",()=>{S.mode=S.exam?"ueben":S.mode;startRun(S.items.map(remix),S.exam?"Prüfungsfragen üben":S.label);});
  const rep=document.getElementById("repeat");
  if(rep)rep.addEventListener("click",()=>{if(S.exam)S.mode="ueben";startRun(wrong.map(i=>remix(S.items[i])),wrong.length+" falsche Fragen");});
}
function bewertung(p){
  if(p>=92)return "Sehr gut, das Niveau trägt durch die Prüfung.";
  if(p>=81)return "Gut, einzelne Lücken gezielt nacharbeiten.";
  if(p>=67)return "Befriedigend, die markierten Themen noch einmal durchgehen.";
  if(p>=50)return "Ausreichend, die Kapitel zu den falschen Fragen wiederholen.";
  return "Noch zu wenig, arbeite die Kapitel mit dem Handout noch einmal durch.";
}

/* ---------- Statistik ---------- */
function viewStats(){
  const h=history();
  const recent=h.slice(-5),before=h.slice(-10,-5);
  const a1=avg(recent),a0=avg(before);
  const trend=(a1!==null&&a0!==null)?a1-a0:null;
  const exams=h.filter(x=>x.exam);
  const passed=exams.filter(x=>x.passed).length;
  const parts=partStats(h).filter(p=>p.n>0).sort((a,b)=>a.pct-b.pct);
  const withData=parts.length;

  let bars="";
  parts.forEach((p,i)=>{
    const cls=withData>=4?(i<3?" weak":(i>=withData-3?" strong":"")):"";
    bars+='<div class="barrow'+cls+'"><span class="lbl"><b>Tag '+p.day+' · '+esc(p.part)+'</b><small>'+esc(p.topic)+'</small></span><span class="pct">'+p.pct+' %<small>'+p.r+' / '+p.n+'</small></span><span class="track" aria-hidden="true"><span class="fill" style="width:'+p.pct+'%"></span></span></div>';
  });
  let rows="";
  h.slice().reverse().slice(0,15).forEach(x=>{
    rows+='<li><span>'+(x.exam?'<span class="badge '+(x.passed?"pass":"fail")+'">'+(x.passed?"Bestanden":"Nicht best.")+'</span>':'')+esc(x.label)+'<span class="when">'+fmtDate(x.d)+' · '+x.r+' von '+x.n+'</span></span><span class="q">'+x.pct+' %</span></li>';
  });

  app.innerHTML='<div class="view">'+
    '<div class="card"><h1 id="h1" tabindex="-1">Statistik</h1><p class="lead">Alle abgeschlossenen Durchläufe auf diesem Gerät.</p>'+
      '<div class="kpis">'+
        '<div class="kpi"><span>Durchläufe</span><b>'+h.length+'</b></div>'+
        '<div class="kpi"><span>Letzte 5</span><b>'+(a1!==null?a1+' %':'–')+'</b></div>'+
        '<div class="kpi"><span>Trend</span><b class="'+(trend===null?"":trend>0?"up":trend<0?"down":"")+'">'+(trend===null?'–':(trend>0?'+':'')+trend+' %')+'</b></div>'+
      '</div>'+
      (exams.length?'<p class="empty">'+exams.length+(exams.length===1?' Prüfung':' Prüfungen')+', davon '+passed+' bestanden.</p>':'')+
    '</div>'+
    '<div class="card"><h2>Nach Quizteil</h2><p class="lead">Von schwach nach stark, über alle Durchläufe.</p>'+(bars?'<div class="bars">'+bars+'</div>':'<p class="empty">Noch keine Daten.</p>')+'</div>'+
    '<div class="card"><h2>Verlauf</h2><p class="lead">Die letzten '+Math.min(15,h.length)+' Durchläufe.</p>'+(rows?'<ul class="hist">'+rows+'</ul>':'<p class="empty">Noch keine Durchläufe.</p>')+'</div>'+
    '<div class="card"><h2>Daten</h2><p class="lead">Statistik und Fehlerkartei liegen nur in diesem Browser.</p>'+
      '<div class="row"><button class="btn sm danger" id="clearHist">Statistik löschen</button><button class="btn sm danger" id="clearBox">Fehlerkartei leeren ('+boxIds().length+')</button><button class="btn sm ghost" id="back">Zur Startseite</button></div></div>'+
  '</div>';
  document.getElementById("clearHist").addEventListener("click",()=>{if(confirm("Statistik wirklich löschen?")){drop(KEY.history);S.focus="top";render();}});
  document.getElementById("clearBox").addEventListener("click",()=>{if(confirm("Fehlerkartei wirklich leeren?")){drop(KEY.box);S.focus="top";render();}});
  document.getElementById("back").addEventListener("click",goStart);
}

/* ---------- Steuerung ---------- */
function render(){
  if(S.view!=="quiz")stopTimer();
  document.body.classList.toggle("quiz",S.view==="quiz");
  document.getElementById("toSel").hidden=S.view==="start";
  if(S.view==="start")viewStart();
  else if(S.view==="quiz")viewQuiz();
  else if(S.view==="stats")viewStats();
  else viewResult();
  applyFocus();
}
function applyFocus(){
  const f=S.focus;S.focus=null;
  if(!f)return;
  let el=null;
  if(f==="q")el=document.getElementById("qtext");
  else if(f==="top")el=document.getElementById("h1");
  else if(f==="ov")el=app.querySelector(".ov .cell.cur")||app.querySelector(".ov .cell");
  else if(f==="note"){el=app.querySelector(".note");if(el)el.setAttribute("tabindex","-1");}
  else if(f.startsWith("pick:"))el=app.querySelector('[data-pick="'+f.slice(5)+'"]');
  if(el)el.focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight"){go(1);e.preventDefault();return;}
  if(e.key==="ArrowLeft"){go(-1);e.preventDefault();return;}
  const cur=S.answers[S.idx];
  if(cur!==null&&(S.mode==="ueben"||cur.rev))return;
  if(["1","2","3","4"].includes(e.key))answer(+e.key-1);
});
/* Wischen auf dem Handy */
let tx=0,ty=0,tt=0;
app.addEventListener("touchstart",e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
app.addEventListener("touchend",e=>{
  if(S.view!=="quiz")return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Date.now()-tt>600||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6)return;
  if(dx<0)go(1);else go(-1);
},{passive:true});
render();

/* ---------- Offline und Installation ---------- */
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{
        const w=reg.installing;
        if(!w)return;
        w.addEventListener("statechange",()=>{
          if(w.state==="installed"&&navigator.serviceWorker.controller)toast("Neue Version verfügbar.","Neu laden",()=>location.reload());
        });
      });
    }).catch(()=>{});
  });
}
function toast(text,label,fn){
  const old=document.querySelector(".toast");if(old)old.remove();
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML='<span>'+esc(text)+'</span><button class="btn sm" type="button">'+esc(label)+'</button>';
  t.querySelector("button").addEventListener("click",()=>{t.remove();fn();});
  document.body.appendChild(t);
}
</script>
