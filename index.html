hältnis","Auf die Erstattung der Kosten für die Ausbildungsmittel","Auf ein schriftliches Zeugnis über die Berufsausbildung"],"c":3,"e":"Ausbildende müssen bei Beendigung des Ausbildungsverhältnisses ein schriftliches Zeugnis ausstellen, das Art, Dauer und Ziel der Ausbildung sowie die erworbenen Fertigkeiten enthält. Einen Anspruch auf Übernahme oder Abfindung gibt es nach dem BBiG nicht."},{"q":"Für welchen Personenkreis gilt das Jugendarbeitsschutzgesetz (JArbSchG)?","o":["Für alle Auszubildenden unabhängig von ihrem Alter","Für alle Beschäftigten bis zur Vollendung des 21. Lebensjahres","Für Beschäftigte, die noch nicht 18 Jahre alt sind","Für Kinder bis zur Vollendung des 15. Lebensjahres"],"c":2,"e":"Das JArbSchG schützt Kinder und Jugendliche, also Beschäftigte unter 18 Jahren. Volljährige Auszubildende fallen unter das allgemeine Arbeitszeitgesetz, auch wenn sie noch in der Ausbildung sind."},{"q":"Wie lange dürfen Jugendliche nach § 8 JArbSchG grundsätzlich höchstens täglich beschäftigt werden?","o":["Höchstens 7 Stunden täglich","Höchstens 8 Stunden täglich","Höchstens 9 Stunden täglich","Höchstens 10 Stunden täglich"],"c":1,"e":"Jugendliche dürfen nicht mehr als acht Stunden täglich und nicht mehr als 40 Stunden wöchentlich beschäftigt werden. Die Grenze von zehn Stunden aus dem Arbeitszeitgesetz gilt nur für Erwachsene."},{"q":"Welche Ruhepause steht Jugendlichen nach § 11 JArbSchG bei einer Arbeitszeit von mehr als sechs Stunden mindestens zu?","o":["Mindestens 15 Minuten","Mindestens 30 Minuten","Mindestens 45 Minuten","Mindestens 60 Minuten"],"c":3,"e":"Bei mehr als sechs Stunden Arbeitszeit müssen Jugendliche mindestens 60 Minuten Ruhepause erhalten; bei viereinhalb bis sechs Stunden sind es 30 Minuten. Die 45 Minuten gelten nach dem Arbeitszeitgesetz für Erwachsene bei mehr als neun Stunden."},{"q":"In welchem Zeitraum dürfen Jugendliche nach § 14 JArbSchG grundsätzlich beschäftigt werden?","o":["Nur in der Zeit von 6 bis 20 Uhr","Nur in der Zeit von 7 bis 22 Uhr","Nur in der Zeit von 8 bis 18 Uhr","Nur in der Zeit von 5 bis 21 Uhr"],"c":0,"e":"Jugendliche dürfen grundsätzlich nur zwischen 6 und 20 Uhr beschäftigt werden; alles außerhalb gilt als Nachtruhe. Ausnahmen gibt es nur für bestimmte Branchen wie Gaststätten oder Bäckereien."},{"q":"An wie vielen Tagen pro Woche dürfen Jugendliche nach § 15 JArbSchG höchstens beschäftigt werden?","o":["An höchstens vier Tagen in der Woche","An höchstens fünf Tagen in der Woche","An höchstens sechs Tagen in der Woche","An sieben Tagen mit Ausgleich in der Folgewoche"],"c":1,"e":"Jugendliche dürfen nur an fünf Tagen in der Woche beschäftigt werden; die beiden freien Tage sollen möglichst aufeinander folgen. Die Sechs-Tage-Woche des Arbeitszeitgesetzes gilt nur für Erwachsene."},{"q":"Welche Untersuchung muss nach § 32 JArbSchG vor Beginn der Beschäftigung eines Jugendlichen vorliegen?","o":["Eine arbeitsmedizinische Eignungsuntersuchung durch den Betriebsarzt","Eine amtsärztliche Gesundheitsbescheinigung des Gesundheitsamts","Eine ärztliche Erstuntersuchung, die nicht älter als 14 Monate ist","Eine schulärztliche Abschlussuntersuchung der allgemeinbildenden Schule"],"c":2,"e":"Jugendliche dürfen nur beschäftigt werden, wenn sie innerhalb der letzten 14 Monate ärztlich untersucht wurden und dem Arbeitgeber die Bescheinigung über die Erstuntersuchung vorliegt. Die Untersuchung kann jeder Arzt durchführen, nicht nur Betriebs- oder Amtsarzt."},{"q":"Bis wann muss nach § 33 JArbSchG die Bescheinigung über die erste Nachuntersuchung eines Jugendlichen vorgelegt werden?","o":["Vor Ablauf des ersten Jahres nach Beschäftigungsbeginn","Vor Ablauf der Probezeit von höchstens vier Monaten","Vor der Anmeldung zur Zwischenprüfung bei der IHK","Vor Ablauf des zweiten Jahres nach Beschäftigungsbeginn"],"c":0,"e":"Ein Jahr nach Aufnahme der ersten Beschäftigung muss sich der Jugendliche nachuntersuchen lassen; die Bescheinigung ist vor Ablauf des ersten Beschäftigungsjahres vorzulegen. Probezeit oder Zwischenprüfung sind dafür ohne Bedeutung."},{"q":"Ab welchem Alter gilt eine Person nach § 2 JArbSchG als Jugendlicher?","o":["Ab dem vollendeten 13. Lebensjahr","Ab dem vollendeten 14. Lebensjahr","Ab dem vollendeten 16. Lebensjahr","Ab dem vollendeten 15. Lebensjahr"],"c":3,"e":"Jugendlicher ist, wer 15, aber noch nicht 18 Jahre alt ist; wer noch keine 15 Jahre alt ist, gilt als Kind. Die Grenze von 14 Jahren stammt aus dem Strafrecht und ist eine typische Verwechslung."},{"q":"Wie viele Werktage Mindesturlaub stehen Jugendlichen nach § 19 JArbSchG zu, die zu Beginn des Kalenderjahres noch nicht 16 Jahre alt sind?","o":["Mindestens 27 Werktage","Mindestens 30 Werktage","Mindestens 25 Werktage","Mindestens 24 Werktage"],"c":1,"e":"Der Mindesturlaub ist nach Alter gestaffelt: 30 Werktage unter 16 Jahren, 27 Werktage unter 17 Jahren und 25 Werktage unter 18 Jahren. Die 24 Werktage gelten nach dem Bundesurlaubsgesetz für Erwachsene."},{"q":"Welche Arbeiten sind für Jugendliche nach §§ 22 und 23 JArbSchG grundsätzlich verboten?","o":["Arbeiten mit Kundenkontakt im Einzelhandel","Arbeiten im Warenlager der Exclusiva GmbH","Gefährliche Arbeiten und Akkordarbeit","Arbeiten an Bildschirmarbeitsplätzen"],"c":2,"e":"Jugendliche dürfen keine gefährlichen Arbeiten ausführen, etwa mit Unfallgefahren oder Gefahrstoffen, und nicht im Akkord oder unter tempoabhängiger Entlohnung arbeiten. Kaufmännische Tätigkeiten am Bildschirm, im Lager oder mit Kunden sind erlaubt."}]}]},{"day":4,"title":"Seminartag 4","parts":[{"name":"Quiz 7","topic":"Tarifverträge und Mitbestimmung","src":"Kapitel 1.13 und 1.14, Buch S. 111 bis 118","mc":[{"q":"Die Exclusiva GmbH ist Mitglied im Handelsverband. Zwischen welchen Parteien wird ein Tarifvertrag nach dem Tarifvertragsgesetz (TVG) abgeschlossen?","o":["Zwischen dem Betriebsrat und der Geschäftsleitung des jeweiligen Betriebs","Zwischen Gewerkschaften und Arbeitgeberverbänden oder einzelnen Arbeitgebern","Zwischen dem Bundesarbeitsministerium und den zuständigen Gewerkschaften","Zwischen der Industrie- und Handelskammer und den Arbeitgeberverbänden"],"c":1,"e":"Tariffähig sind nach § 2 TVG Gewerkschaften, Arbeitgeberverbände und einzelne Arbeitgeber (Firmentarifvertrag). Betriebsrat und Arbeitgeber schließen dagegen Betriebsvereinbarungen, keine Tarifverträge."},{"q":"Was versteht man unter Tarifautonomie?","o":["Der Staat legt Mindestlöhne und Arbeitszeiten für alle Branchen verbindlich fest","Jeder Arbeitnehmer handelt seine Arbeitsbedingungen eigenständig mit dem Arbeitgeber aus","Ein abgeschlossener Tarifvertrag gilt automatisch für alle Beschäftigten einer Branche","Die Tarifpartner regeln Arbeits- und Entgeltbedingungen eigenständig ohne staatlichen Eingriff"],"c":3,"e":"Tarifautonomie ist durch Art. 9 Abs. 3 GG geschützt: Gewerkschaften und Arbeitgeberseite regeln die Arbeitsbedingungen selbstständig, der Staat greift nicht in die Verhandlungen ein. Die automatische Geltung für alle Beschäftigten wäre erst Folge einer Allgemeinverbindlicherklärung."},{"q":"Welchen Regelungsgegenstand hat ein Lohn- bzw. Gehaltstarifvertrag?","o":["Die Höhe der Entgelte in den einzelnen Tarifgruppen","Die Dauer des jährlichen Erholungsurlaubs","Die Kündigungsfristen für Arbeitnehmer und Arbeitgeber","Die Merkmale für die Eingruppierung in Tarifgruppen"],"c":0,"e":"Der Lohn- bzw. Gehaltstarifvertrag legt die konkrete Höhe der Entgelte fest und hat meist eine kurze Laufzeit. Eingruppierungsmerkmale, Urlaub und Kündigungsfristen stehen im Rahmen- bzw. Manteltarifvertrag."},{"q":"Was wird typischerweise in einem Manteltarifvertrag geregelt?","o":["Die Höhe der monatlichen Entgelte je Tarifgruppe","Die Höhe einmaliger Sonderzahlungen wie Weihnachtsgeld","Allgemeine Arbeitsbedingungen wie Arbeitszeit, Urlaub und Kündigungsfristen","Die Zuordnung der Tätigkeiten zu den einzelnen Tarifgruppen"],"c":2,"e":"Der Manteltarifvertrag regelt die allgemeinen Arbeitsbedingungen (Arbeitszeit, Urlaub, Kündigungsfristen, Zuschläge) und läuft meist mehrere Jahre. Die Entgelthöhe ist Gegenstand des Lohn- bzw. Gehaltstarifvertrags."},{"q":"Was bedeutet die Friedenspflicht im Tarifrecht?","o":["Arbeitskämpfe sind in Deutschland grundsätzlich und dauerhaft untersagt","Während der Laufzeit eines Tarifvertrags sind Arbeitskämpfe über dessen Inhalte unzulässig","Arbeitgeber dürfen als Reaktion auf einen Streik keine Aussperrung durchführen","Tarifverhandlungen dürfen erst nach Ablauf einer Schlichtung aufgenommen werden"],"c":1,"e":"Die Friedenspflicht verbietet Streik und Aussperrung über die im laufenden Tarifvertrag geregelten Themen bis zu dessen Ablauf. Nach Ende der Laufzeit und gescheiterten Verhandlungen sind Arbeitskämpfe wieder zulässig."},{"q":"Was besagt das Günstigkeitsprinzip im Verhältnis von Tarifvertrag und Arbeitsvertrag?","o":["Vom Tarifvertrag darf im Arbeitsvertrag nur zugunsten des Arbeitnehmers abgewichen werden","Der Arbeitgeber darf die für ihn wirtschaftlich günstigere Regelung anwenden","Bei mehreren Tarifverträgen gilt stets der zuletzt abgeschlossene Vertrag","Der Arbeitsvertrag hat als individuelle Vereinbarung immer Vorrang vor dem Tarifvertrag"],"c":0,"e":"Nach § 4 Abs. 3 TVG sind abweichende Vereinbarungen nur zulässig, wenn sie für den Arbeitnehmer günstiger sind, z. B. ein höheres Gehalt als im Tarif. Abweichungen zulasten des Arbeitnehmers sind unwirksam."},{"q":"Für wen gilt ein Tarifvertrag unmittelbar und zwingend?","o":["Für alle Beschäftigten der Branche im gesamten Bundesgebiet","Für alle Arbeitnehmer eines Betriebs, sobald dort ein Betriebsrat besteht","Für alle Auszubildenden und Arbeitnehmer unter 25 Jahren","Für die Mitglieder der tarifschließenden Gewerkschaft und des Arbeitgeberverbands"],"c":3,"e":"Nach § 3 TVG sind nur die Tarifgebundenen erfasst: Gewerkschaftsmitglieder und Mitglieder des Arbeitgeberverbands bzw. der Arbeitgeber eines Firmentarifvertrags. Für die gesamte Branche gilt ein Tarifvertrag erst nach einer Allgemeinverbindlicherklärung."},{"q":"Welche Wirkung hat die Allgemeinverbindlicherklärung eines Tarifvertrags?","o":["Der Tarifvertrag verliert seine Gültigkeit und muss neu verhandelt werden","Der Tarifvertrag gilt nur noch für die Mitglieder der Gewerkschaft","Der Tarifvertrag gilt für die gesamte Branche, auch für nicht organisierte Arbeitgeber und Arbeitnehmer","Der Tarifvertrag wird um eine gesetzliche Friedenspflicht von zwei Jahren verlängert"],"c":2,"e":"Nach § 5 TVG kann das Bundesarbeitsministerium einen Tarifvertrag für allgemeinverbindlich erklären; er gilt dann auch für Arbeitgeber und Arbeitnehmer, die nicht Mitglied der Tarifparteien sind."},{"q":"Was ist eine Urabstimmung im Zusammenhang mit einem Arbeitskampf?","o":["Die geheime Wahl der Betriebsratsmitglieder durch die Belegschaft","Die Abstimmung der Gewerkschaftsmitglieder darüber, ob ein Streik durchgeführt wird","Die Abstimmung der Tarifkommission über die Annahme eines Verhandlungsergebnisses","Die Befragung der gesamten Belegschaft durch den Arbeitgeber vor einer Aussperrung"],"c":1,"e":"Vor einem Streik lässt die Gewerkschaft ihre Mitglieder in einer Urabstimmung entscheiden; üblich ist eine Zustimmung von mindestens 75 Prozent. Die Betriebsratswahl hat mit dem Arbeitskampf nichts zu tun."},{"q":"Was versteht man unter einer Aussperrung?","o":["Das Kampfmittel der Arbeitgeber, bei dem Arbeitnehmer vorübergehend von Arbeit und Lohn ausgeschlossen werden","Die kollektive Arbeitsniederlegung der Arbeitnehmer zur Durchsetzung von Tarifforderungen","Die fristlose Kündigung einzelner Arbeitnehmer wegen der Teilnahme an einem Streik","Die vorübergehende Betriebsschließung wegen Auftragsmangels mit Kurzarbeitergeld"],"c":0,"e":"Die Aussperrung ist das Gegenstück zum Streik: Der Arbeitgeber schließt Arbeitnehmer vorübergehend vom Betrieb aus und zahlt keinen Lohn. Die Arbeitsverhältnisse bleiben dabei bestehen, es handelt sich nicht um Kündigungen."},{"q":"Welches Gesetz regelt die betriebliche Mitbestimmung durch den Betriebsrat?","o":["Das Berufsbildungsgesetz (BBiG)","Das Mitbestimmungsgesetz (MitbestG)","Das Tarifvertragsgesetz (TVG)","Das Betriebsverfassungsgesetz (BetrVG)"],"c":3,"e":"Das BetrVG regelt Wahl, Amtszeit und Beteiligungsrechte des Betriebsrats. Das MitbestG betrifft dagegen die Unternehmensmitbestimmung im Aufsichtsrat großer Kapitalgesellschaften mit mehr als 2.000 Beschäftigten."},{"q":"Ab wie vielen ständigen wahlberechtigten Arbeitnehmern kann in einem Betrieb ein Betriebsrat gewählt werden?","o":["Ab 3 wahlberechtigten Arbeitnehmern","Ab 10 wahlberechtigten Arbeitnehmern","Ab 5 wahlberechtigten Arbeitnehmern, von denen 3 wählbar sind","Ab 20 wahlberechtigten Arbeitnehmern, von denen 3 wählbar sind"],"c":2,"e":"Nach § 1 BetrVG kann ein Betriebsrat in Betrieben mit in der Regel mindestens fünf ständigen wahlberechtigten Arbeitnehmern gewählt werden, von denen drei wählbar sind. Die Zahl 20 ist die Schwelle für die Mitwirkungsrechte bei Betriebsänderungen und personellen Einzelmaßnahmen."},{"q":"Wie lange dauert die regelmäßige Amtszeit eines Betriebsrats nach dem BetrVG?","o":["4 Jahre","2 Jahre","3 Jahre","5 Jahre"],"c":0,"e":"Nach § 21 BetrVG beträgt die regelmäßige Amtszeit des Betriebsrats vier Jahre; die Wahlen finden bundesweit einheitlich zwischen dem 1. März und 31. Mai statt. Zwei Jahre ist die Amtszeit der Jugend- und Auszubildendenvertretung."},{"q":"Ab welchem Alter sind Arbeitnehmer bei der Betriebsratswahl wahlberechtigt?","o":["Ab Vollendung des 18. Lebensjahres","Ab Vollendung des 16. Lebensjahres","Ab Vollendung des 15. Lebensjahres","Ab Vollendung des 21. Lebensjahres"],"c":1,"e":"Seit der Reform des BetrVG 2021 sind Arbeitnehmer ab Vollendung des 16. Lebensjahres wahlberechtigt (§ 7 BetrVG). Wählbar ist man dagegen erst ab 18 Jahren und sechs Monaten Betriebszugehörigkeit."},{"q":"Die Exclusiva GmbH kündigt einem Mitarbeiter, ohne den Betriebsrat vorher anzuhören. Welche Rechtsfolge hat das?","o":["Die Kündigung ist wirksam, der Betriebsrat kann lediglich Bedenken nachreichen","Die Kündigung wird automatisch in eine Abmahnung umgedeutet","Die Kündigung wird erst nach einer Wochenfrist zur Nachholung der Anhörung wirksam","Die Kündigung ist unwirksam"],"c":3,"e":"Nach § 102 BetrVG ist der Betriebsrat vor jeder Kündigung anzuhören; eine ohne Anhörung ausgesprochene Kündigung ist unwirksam. Die Anhörung kann nicht nachgeholt werden, sondern die Kündigung müsste neu erklärt werden."},{"q":"In welcher der folgenden Angelegenheiten hat der Betriebsrat ein echtes Mitbestimmungsrecht nach § 87 BetrVG?","o":["Bei der Festlegung der Verkaufspreise im Onlineshop","Bei der Auswahl der Lieferanten für das Sortiment","Bei Beginn und Ende der täglichen Arbeitszeit und der Pausen","Bei der Einstellung einzelner Mitarbeiter und deren Eingruppierung"],"c":2,"e":"Die Lage der täglichen Arbeitszeit und der Pausen ist eine soziale Angelegenheit nach § 87 BetrVG, in der der Betriebsrat gleichberechtigt mitbestimmt. Bei Einstellungen hat er nur ein Zustimmungsverweigerungsrecht (§ 99 BetrVG), wirtschaftliche Entscheidungen wie Preise oder Lieferanten trifft der Arbeitgeber allein."},{"q":"Welche Beschäftigten vertritt die Jugend- und Auszubildendenvertretung (JAV)?","o":["Arbeitnehmer unter 18 Jahren sowie Auszubildende unter 25 Jahren","Alle Arbeitnehmer unter 25 Jahren unabhängig vom Ausbildungsstatus","Ausschließlich Auszubildende, unabhängig von deren Alter","Arbeitnehmer unter 21 Jahren sowie Auszubildende unter 27 Jahren"],"c":0,"e":"Nach § 60 BetrVG vertritt die JAV Arbeitnehmer, die das 18. Lebensjahr noch nicht vollendet haben, sowie Auszubildende, die das 25. Lebensjahr noch nicht vollendet haben. Ein 22-jähriger Mitarbeiter ohne Ausbildungsverhältnis fällt also nicht darunter."},{"q":"Was ist eine Betriebsvereinbarung?","o":["Eine Vereinbarung zwischen Gewerkschaft und Arbeitgeber über Arbeitsbedingungen im Betrieb","Eine schriftliche Regelung im Arbeitsvertrag über die betrieblichen Pflichten des Arbeitnehmers","Eine mündliche Absprache zwischen Vorgesetzten und Mitarbeitern zu Arbeitszeiten","Eine schriftliche Vereinbarung zwischen Arbeitgeber und Betriebsrat mit Wirkung für die Belegschaft"],"c":3,"e":"Betriebsvereinbarungen werden nach § 77 BetrVG zwischen Arbeitgeber und Betriebsrat schriftlich abgeschlossen und gelten unmittelbar für alle Arbeitnehmer des Betriebs. Vereinbarungen mit der Gewerkschaft sind dagegen Tarifverträge."},{"q":"Welche Reihenfolge gibt die Beteiligungsrechte des Betriebsrats von der schwächsten zur stärksten Stufe korrekt wieder?","o":["Anhörung, Information, Mitbestimmung, Beratung","Beratung, Information, Anhörung, Mitbestimmung","Information, Anhörung, Beratung, Mitbestimmung","Information, Mitbestimmung, Anhörung, Beratung"],"c":2,"e":"Die Beteiligungsrechte steigern sich von der reinen Information über das Anhörungsrecht und das Beratungsrecht bis zur echten Mitbestimmung, bei der der Arbeitgeber ohne Zustimmung des Betriebsrats nicht handeln darf."},{"q":"Unter welcher Voraussetzung wird in einem Betrieb eine Jugend- und Auszubildendenvertretung (JAV) gewählt?","o":["Wenn der Betrieb in der Regel mindestens 20 Auszubildende beschäftigt","Wenn ein Betriebsrat besteht und in der Regel mindestens 5 Arbeitnehmer unter 18 Jahren oder Auszubildende unter 25 Jahren beschäftigt sind","Wenn der Arbeitgeber der Wahl zustimmt und der Betrieb mindestens 10 Arbeitnehmer beschäftigt","Wenn in der Regel mindestens 3 Auszubildende beschäftigt sind, auch ohne bestehenden Betriebsrat"],"c":1,"e":"Nach § 60 BetrVG wird eine JAV in Betrieben mit in der Regel mindestens fünf Arbeitnehmern unter 18 Jahren oder Auszubildenden unter 25 Jahren gewählt; Voraussetzung ist zudem ein bestehender Betriebsrat. Eine Zustimmung des Arbeitgebers ist nicht erforderlich."}]},{"name":"Quiz 8","topic":"Entgeltabrechnung, Fort- und Weiterbildung","src":"Kapitel 1.15 und 1.16, Buch S. 119 bis 127","mc":[{"q":"Was versteht man auf der Entgeltabrechnung der Exclusiva GmbH unter dem Bruttoentgelt?","o":["Das Entgelt nach Abzug von Lohnsteuer und Sozialabgaben, also den Auszahlungsbetrag","Das Entgelt einschließlich der Arbeitgeberanteile zur Sozialversicherung","Das vereinbarte Entgelt vor Abzug von Steuern und Sozialversicherungsbeiträgen","Das Entgelt zuzüglich Urlaubs- und Weihnachtsgeld, jedoch ohne Zulagen"],"c":2,"e":"Das Bruttoentgelt ist das arbeitsvertraglich vereinbarte Entgelt vor allen Abzügen. Der Auszahlungsbetrag nach Abzug von Steuern und Sozialabgaben ist dagegen das Nettoentgelt."},{"q":"Welcher der folgenden Abzüge auf der Entgeltabrechnung ist eine gesetzliche Steuer und kein Sozialversicherungsbeitrag?","o":["Die Lohnsteuer","Der Beitrag zur Rentenversicherung","Der Beitrag zur Arbeitslosenversicherung","Der Beitrag zur Pflegeversicherung"],"c":0,"e":"Die Lohnsteuer ist eine Steuer, die der Arbeitgeber einbehält und an das Finanzamt abführt. Renten-, Arbeitslosen- und Pflegeversicherung sind dagegen Zweige der gesetzlichen Sozialversicherung."},{"q":"Welche vier Zweige der Sozialversicherung werden in der Regel je etwa zur Hälfte von Arbeitgeber und Arbeitnehmer finanziert?","o":["Kranken-, Pflege-, Renten- und Unfallversicherung","Kranken-, Renten-, Arbeitslosen- und Unfallversicherung","Pflege-, Renten-, Arbeitslosen- und Berufsunfähigkeitsversicherung","Kranken-, Pflege-, Renten- und Arbeitslosenversicherung"],"c":3,"e":"Kranken-, Pflege-, Renten- und Arbeitslosenversicherung werden paritätisch, also je etwa zur Hälfte, von Arbeitgeber und Arbeitnehmer getragen. Die Unfallversicherung gehört zwar zur Sozialversicherung, wird aber allein vom Arbeitgeber finanziert."},{"q":"Wer trägt die Beiträge zur gesetzlichen Unfallversicherung?","o":["Der Arbeitnehmer allein über den Abzug vom Bruttoentgelt","Der Arbeitgeber allein durch Beiträge an die Berufsgenossenschaft","Arbeitgeber und Arbeitnehmer je zur Hälfte wie bei der Rentenversicherung","Der Arbeitnehmer mit einem Zuschuss aus Steuermitteln des Bundes"],"c":1,"e":"Die Beiträge zur gesetzlichen Unfallversicherung zahlt ausschließlich der Arbeitgeber an die zuständige Berufsgenossenschaft. Anders als bei den übrigen Sozialversicherungszweigen erscheint daher kein Abzug auf der Entgeltabrechnung."},{"q":"Wovon hängt die Höhe der einbehaltenen Lohnsteuer unter anderem ab?","o":["Von der Steuerklasse und der Höhe des steuerpflichtigen Entgelts","Vom Familienstand und der Größe des beschäftigenden Betriebs","Von der Beitragsbemessungsgrenze und dem Zusatzbeitrag der Krankenkasse","Von der Dauer der Betriebszugehörigkeit und der Anzahl der Arbeitstage"],"c":0,"e":"Die Lohnsteuer wird anhand der Steuerklasse und der Höhe des steuerpflichtigen Entgelts ermittelt. Beitragsbemessungsgrenze und Zusatzbeitrag betreffen dagegen die Sozialversicherung, nicht die Lohnsteuer."},{"q":"Welche Steuerklasse gilt regelmäßig für ledige Arbeitnehmer ohne Kinder?","o":["Steuerklasse III","Steuerklasse V","Steuerklasse I","Steuerklasse II"],"c":2,"e":"Ledige, geschiedene oder verwitwete Arbeitnehmer ohne Kinder werden in Steuerklasse I eingestuft. Steuerklasse II gilt für Alleinerziehende mit Entlastungsbetrag, die Klassen III und V für Verheiratete."},{"q":"Welche Steuerklasse wird für ein zweites oder weiteres Beschäftigungsverhältnis angewendet?","o":["Steuerklasse II","Steuerklasse IV","Steuerklasse V","Steuerklasse VI"],"c":3,"e":"Für ein zweites und jedes weitere Dienstverhältnis gilt die Steuerklasse VI, in der keine Freibeträge berücksichtigt werden. Steuerklasse V ist die Klasse eines Ehepartners in Kombination mit Klasse III."},{"q":"Wer behält die Lohnsteuer und die Sozialversicherungsbeiträge ein und führt sie ab?","o":["Der Arbeitnehmer überweist sie nach Erhalt des Bruttoentgelts selbst","Der Arbeitgeber behält sie ein und führt sie an Finanzamt und Einzugsstelle ab","Die Krankenkasse zieht sie direkt vom Girokonto des Arbeitnehmers ein","Das Finanzamt fordert sie nach Abgabe der Steuererklärung vom Arbeitnehmer nach"],"c":1,"e":"Der Arbeitgeber ist gesetzlich verpflichtet, Lohnsteuer und Arbeitnehmeranteile vom Bruttoentgelt einzubehalten und an das Finanzamt bzw. die Krankenkasse als Einzugsstelle abzuführen. Der Arbeitnehmer erhält nur das Nettoentgelt ausgezahlt."},{"q":"Was sind vermögenswirksame Leistungen (VL)?","o":["Ein zinsloses Arbeitgeberdarlehen, das über die Entgeltabrechnung getilgt wird","Eine steuerfreie Sachzuwendung des Arbeitgebers, zum Beispiel ein Jobticket","Ein Zuschuss des Arbeitgebers zur betrieblichen Altersvorsorge per Entgeltumwandlung","Zusätzliche Arbeitgeberleistungen, die in eine Anlageform des Arbeitnehmers fließen"],"c":3,"e":"Vermögenswirksame Leistungen sind Geldleistungen des Arbeitgebers, die direkt in eine vom Arbeitnehmer gewählte Anlageform wie Bausparvertrag oder Fondssparplan eingezahlt werden. Sie sind kein Darlehen und keine betriebliche Altersvorsorge."},{"q":"Wie wird das Nettoentgelt auf der Entgeltabrechnung ermittelt?","o":["Bruttoentgelt minus Lohnsteuer, Zuschlagsteuern und Arbeitnehmeranteile zur Sozialversicherung","Bruttoentgelt minus Arbeitgeberanteile zur Sozialversicherung und Unfallversicherung","Bruttoentgelt minus Lohnsteuer plus Arbeitnehmeranteile zur Sozialversicherung","Bruttoentgelt minus Gesamtsozialversicherungsbeitrag von Arbeitgeber und Arbeitnehmer"],"c":0,"e":"Das Nettoentgelt ergibt sich aus dem Bruttoentgelt abzüglich Lohnsteuer, Solidaritätszuschlag, ggf. Kirchensteuer und der Arbeitnehmeranteile zur Sozialversicherung. Die Arbeitgeberanteile mindern das Netto nicht, da sie zusätzlich vom Arbeitgeber gezahlt werden."},{"q":"Warum sollten Auszubildende der Exclusiva GmbH ihre Entgeltabrechnung regelmäßig prüfen?","o":["Weil die Abrechnung ohne Gegenzeichnung des Arbeitnehmers unwirksam ist","Weil sich durch die Prüfung die Lohnsteuer nachträglich senken lässt","Um Fehler bei Stammdaten, Bruttobezügen und Abzügen frühzeitig zu erkennen","Weil der Arbeitgeber die Abrechnung sonst nicht an das Finanzamt melden darf"],"c":2,"e":"Auch in der Entgeltabrechnung können Fehler auftreten, etwa bei Steuerklasse, Krankenkasse, Stundenzahl oder Abzügen. Nur wer die Abrechnung prüft, kann solche Fehler rechtzeitig beim Arbeitgeber reklamieren."},{"q":"Was ist die Kirchensteuer, die auf der Entgeltabrechnung erscheinen kann?","o":["Ein Sozialversicherungsbeitrag, der an die Kirchengemeinde abgeführt wird","Eine Zuschlagsteuer zur Lohnsteuer, die nur Kirchenmitglieder zahlen","Eine Gemeindegebühr, die unabhängig von der Konfession erhoben wird","Ein freiwilliger Beitrag, den der Arbeitgeber für alle Beschäftigten zahlt"],"c":1,"e":"Die Kirchensteuer wird als Zuschlag zur Lohnsteuer (je nach Bundesland 8 oder 9 Prozent) nur bei Mitgliedern einer steuererhebenden Religionsgemeinschaft einbehalten. Sie ist keine Sozialabgabe und keine Gebühr."},{"q":"Was versteht man unter einer Anpassungsfortbildung?","o":["Den Erwerb eines höheren beruflichen Abschlusses, zum Beispiel als Fachwirt","Die Vorbereitung auf einen Wechsel in einen anderen anerkannten Beruf","Den Erwerb erster beruflicher Kenntnisse in einer dualen Ausbildung","Die Aktualisierung vorhandener Kenntnisse an neue Entwicklungen im Beruf"],"c":3,"e":"Die Anpassungsfortbildung erhält und aktualisiert die vorhandene berufliche Handlungsfähigkeit, etwa bei neuer Software oder geänderten Rechtsvorschriften. Der Erwerb eines höheren Abschlusses ist dagegen die Aufstiegsfortbildung."},{"q":"Was ist das Ziel einer Aufstiegsfortbildung?","o":["Die Qualifikation für höherwertige Aufgaben mit anerkanntem Abschluss","Die Anpassung vorhandener Kenntnisse an neue Software und Technik","Der Einstieg in einen völlig anderen Beruf mit eigenem Abschluss","Die Auffrischung von Ausbildungsinhalten nach längerer Berufspause"],"c":0,"e":"Die Aufstiegsfortbildung führt zu einem anerkannten höheren Abschluss und qualifiziert für Fach- und Führungsaufgaben. Die Anpassung an neue Technik ist die Anpassungsfortbildung, der Berufswechsel die Umschulung."},{"q":"Was ist eine Umschulung?","o":["Eine Fortbildung, die vorhandene Kenntnisse an neue Anforderungen anpasst","Eine Fortbildung, die zu einem höheren Abschluss im erlernten Beruf führt","Eine Bildungsmaßnahme, die zu einem anderen anerkannten Beruf führt","Eine Einarbeitung, die auf eine neue Stelle im selben Beruf vorbereitet"],"c":2,"e":"Eine Umschulung befähigt zu einer anderen beruflichen Tätigkeit und schließt mit einem anerkannten Berufsabschluss ab, etwa wenn der bisherige Beruf nicht mehr ausgeübt werden kann. Anpassungs- und Aufstiegsfortbildung bleiben dagegen im erlernten Beruf."},{"q":"Welcher Abschluss ist eine typische Aufstiegsfortbildung für Kaufleute im E-Commerce?","o":["Kaufmann/Kauffrau im E-Commerce (IHK-Abschlussprüfung)","Fachwirt/Fachwirtin im E-Commerce (IHK-Fortbildungsprüfung)","Zertifikat Online-Marketing (Kurs an der Volkshochschule)","Ausbildereignungsprüfung nach AEVO (IHK-Prüfung)"],"c":1,"e":"Der Fachwirt bzw. die Fachwirtin im E-Commerce ist der anerkannte IHK-Fortbildungsabschluss, der auf der Ausbildung aufbaut und für Führungsaufgaben qualifiziert. Der Kaufmann im E-Commerce ist der Ausbildungsabschluss selbst, kein Aufstieg."},{"q":"Welche staatliche Förderung unterstützt Aufstiegsfortbildungen wie den Fachwirt finanziell?","o":["Berufsausbildungsbeihilfe (BAB)","Kurzarbeitergeld","Wohngeld","Aufstiegs-BAföG (AFBG)"],"c":3,"e":"Das Aufstiegs-BAföG nach dem Aufstiegsfortbildungsförderungsgesetz fördert Lehrgangs- und Prüfungsgebühren sowie den Lebensunterhalt bei Aufstiegsfortbildungen. Die Berufsausbildungsbeihilfe unterstützt dagegen nur die Erstausbildung."},{"q":"Welche Lernform ermöglicht orts- und zeitunabhängiges Lernen?","o":["E-Learning über eine Online-Lernplattform","Präsenzseminar bei einem Bildungsträger","Innerbetriebliche Schulung am Arbeitsplatz","Blockunterricht an der Berufsschule"],"c":0,"e":"Beim E-Learning werden Lerninhalte digital bereitgestellt und können jederzeit von jedem Ort mit Internetzugang bearbeitet werden. Präsenzseminare, Schulungen und Blockunterricht sind an feste Zeiten und Orte gebunden."},{"q":"Warum ist lebenslanges Lernen gerade im E-Commerce besonders wichtig?","o":["Weil eine jährliche Weiterbildung für alle Beschäftigten gesetzlich vorgeschrieben ist","Weil sich Technik, Tools, Kundenverhalten und Markt besonders schnell wandeln","Weil die Zulassung zur Abschlussprüfung Weiterbildungsnachweise voraussetzt","Weil Weiterbildung tariflich zusätzliche Urlaubstage für alle Beschäftigten sichert"],"c":1,"e":"Im E-Commerce ändern sich Shopsysteme, Marketingkanäle, rechtliche Vorgaben und das Kundenverhalten in kurzen Abständen. Eine allgemeine gesetzliche Weiterbildungspflicht gibt es dagegen nicht."},{"q":"Welcher der folgenden Punkte ist KEINE typische Folge beruflicher Weiterbildung?","o":["Bessere Karrierechancen im Unternehmen","Höheres Einkommen durch qualifiziertere Aufgaben","Ein gesetzlicher Anspruch auf Beförderung","Größere Sicherheit des eigenen Arbeitsplatzes"],"c":2,"e":"Weiterbildung verbessert Karrierechancen, Einkommen und Arbeitsplatzsicherheit, begründet aber keinen Rechtsanspruch auf eine Beförderung. Ob eine höhere Position vergeben wird, entscheidet der Arbeitgeber."}]}]},{"day":5,"title":"Seminartag 5","parts":[{"name":"Quiz 9","topic":"Unternehmensziele und wirtschaftliches Gesamtgefüge","src":"Kapitel 1.17 und 1.18, Buch S. 128 bis 141","mc":[{"q":"Die Geschäftsleitung der Exclusiva GmbH legt die Unternehmensziele für das nächste Geschäftsjahr fest. Welches der folgenden Ziele ist ein ökonomisches Unternehmensziel?","o":["Sicherung fairer Arbeitsbedingungen im Lager","Senkung des CO2-Ausstoßes in der Versandlogistik","Steigerung der Umsatzrentabilität auf 8 Prozent","Förderung regionaler Sport- und Kulturprojekte"],"c":2,"e":"Ökonomische Ziele beziehen sich auf den wirtschaftlichen Erfolg des Unternehmens, etwa Gewinn, Umsatz oder Rentabilität. Faire Arbeitsbedingungen und regionale Förderung sind soziale Ziele, die CO2-Senkung ist ein ökologisches Ziel."},{"q":"Welches der folgenden Ziele der Exclusiva GmbH ist ein soziales Unternehmensziel?","o":["Erhöhung des Marktanteils im B2B-Geschäft","Schonung natürlicher Ressourcen beim Verpacken","Senkung der Logistikkosten um 5 Prozent","Sicherung fairer Arbeitsbedingungen im Betrieb"],"c":3,"e":"Soziale Ziele betreffen die Mitarbeitenden und die Gesellschaft, etwa faire Arbeitsbedingungen, sichere Arbeitsplätze oder Weiterbildung. Marktanteil und Kostensenkung sind ökonomische Ziele, Ressourcenschonung ist ein ökologisches Ziel."},{"q":"Welches der folgenden Ziele der Exclusiva GmbH ist ein ökologisches Unternehmensziel?","o":["Umstellung auf recycelbare Versandverpackungen","Erhöhung des Marktanteils im Onlinehandel","Steigerung der Eigenkapitalrentabilität","Ausbau der betrieblichen Weiterbildungsangebote"],"c":0,"e":"Ökologische Ziele zielen auf den Schutz der Umwelt, etwa durch nachhaltige Verpackungen, ressourcenschonende Logistik oder Emissionsreduktion. Weiterbildung ist ein soziales Ziel, Marktanteil und Rentabilität sind ökonomische Ziele."},{"q":"Die Exclusiva GmbH verfolgt die Ziele „Verbesserung des Kundenservice“ und „Erhöhung der Kundenzufriedenheit“. Die Erreichung des einen Ziels fördert die Erreichung des anderen. Wie wird diese Zielbeziehung bezeichnet?","o":["Konkurrierende Zielbeziehung","Komplementäre Zielbeziehung","Indifferente Zielbeziehung","Antinomische Zielbeziehung"],"c":1,"e":"Bei einer komplementären Zielbeziehung (Zielharmonie) unterstützen sich zwei Ziele gegenseitig. Konkurrierende Ziele behindern sich, indifferente Ziele beeinflussen sich nicht, antinomische Ziele schließen sich vollständig aus."},{"q":"Die Exclusiva GmbH möchte gleichzeitig die Einkaufskosten deutlich senken und die höchste Produktqualität im Sortiment anbieten. In welcher Zielbeziehung stehen diese beiden Ziele in der Regel?","o":["Konkurrierende Zielbeziehung","Komplementäre Zielbeziehung","Indifferente Zielbeziehung","Identische Zielbeziehung"],"c":0,"e":"Höchste Qualität verursacht meist höhere Kosten, sodass die Erreichung des einen Ziels die Erreichung des anderen behindert. Das ist ein Zielkonflikt, also eine konkurrierende Zielbeziehung; komplementäre Ziele würden sich dagegen gegenseitig fördern."},{"q":"Die Exclusiva GmbH formuliert das Ziel: „Der Umsatz im Onlineshop soll bis zum 31.12. um 10 Prozent gesteigert werden.“ Welche drei Bestandteile machen eine solche Zielformulierung vollständig?","o":["Zielinhalt, Zielhierarchie, Zielkonflikt","Oberziel, Zwischenziel, Unterziel","Zielart, Zielkontrolle, Zielbeziehung","Zielinhalt, Zielausmaß, Zeitbezug"],"c":3,"e":"Ein vollständig formuliertes Ziel nennt den Inhalt (was: Umsatzsteigerung), das Ausmaß (wie viel: 10 Prozent) und den Zeitbezug (bis wann: 31.12.). Oberziel, Zwischenziel und Unterziel beschreiben dagegen nur die Zielhierarchie."},{"q":"Die Geschäftsleitung der Exclusiva GmbH möchte wissen, wie sich der Gewinn im Verhältnis zum eingesetzten Kapital entwickelt hat. Welche Kennzahl gibt darüber Auskunft?","o":["Die Wirtschaftlichkeit als Verhältnis von Ertrag zu Aufwand","Die Liquidität als Fähigkeit, fällige Zahlungen zu leisten","Die Rentabilität als Verhältnis von Gewinn zu Kapital oder Umsatz","Die Produktivität als Verhältnis von Ausbringung zu Einsatz"],"c":2,"e":"Die Rentabilität setzt den Gewinn ins Verhältnis zum eingesetzten Kapital oder zum Umsatz und zeigt, wie sich das Kapital verzinst. Die Wirtschaftlichkeit vergleicht dagegen Ertrag und Aufwand, ohne das eingesetzte Kapital zu betrachten."},{"q":"Die Exclusiva GmbH muss Ende des Monats Lieferantenrechnungen, Gehälter und Miete pünktlich bezahlen. Welche Aussage beschreibt den Begriff Liquidität zutreffend?","o":["Das Verhältnis des Gewinns zum eingesetzten Kapital","Die Fähigkeit, fällige Zahlungsverpflichtungen jederzeit zu erfüllen","Das Verhältnis des Ertrags zum betrieblichen Aufwand","Das Verhältnis der Ausbringungsmenge zur Einsatzmenge"],"c":1,"e":"Liquidität bedeutet Zahlungsfähigkeit: Das Unternehmen kann seine fälligen Verbindlichkeiten fristgerecht begleichen. Ein hoher Gewinn oder eine gute Rentabilität garantieren das nicht, wenn das Geld etwa im Lagerbestand gebunden ist."},{"q":"Die Wirtschaftlichkeit eines Unternehmens ist definiert als das Verhältnis von ...","o":["Ertrag zu Aufwand.","Gewinn zu eingesetztem Kapital.","Ausbringungsmenge zu Einsatzmenge.","Umsatz zu Gewinn."],"c":0,"e":"Die Wirtschaftlichkeit vergleicht den bewerteten Ertrag mit dem bewerteten Aufwand; ein Wert über 1 bedeutet wirtschaftliches Handeln. Gewinn zu Kapital ist die Rentabilität, Ausbringungsmenge zu Einsatzmenge die Produktivität."},{"q":"Die Exclusiva GmbH möchte nach innen und außen als einheitliches Unternehmen mit klarem Profil wahrgenommen werden. Was versteht man unter der Corporate Identity eines Unternehmens?","o":["Die Gesamtheit aller Werbemaßnahmen zur Absatzförderung","Die Rechtsform und die Eintragung im Handelsregister","Das visuelle Erscheinungsbild aus Logo, Farben und Schriften","Das einheitliche Selbstverständnis und Auftreten nach innen und außen"],"c":3,"e":"Die Corporate Identity ist die Unternehmenspersönlichkeit, also das einheitliche Selbstverständnis, das sich in Verhalten, Kommunikation und Erscheinungsbild zeigt. Das rein visuelle Erscheinungsbild ist nur ein Teilbereich davon, das Corporate Design."},{"q":"Ein Kunde der Exclusiva GmbH stellt fest, dass er im Winter keine warme Jacke besitzt, und möchte diesen Zustand ändern. Was versteht man in der Wirtschaftslehre unter einem Bedürfnis?","o":["Eine konkrete, mit Kaufkraft ausgestattete Kaufabsicht","Den am Markt tatsächlich wirksam werdenden Bedarf","Einen empfundenen Mangel mit dem Wunsch, ihn zu beseitigen","Das Gut, mit dem ein empfundener Mangel beseitigt wird"],"c":2,"e":"Ein Bedürfnis ist ein Mangelgefühl, verbunden mit dem Wunsch, diesen Mangel zu beheben. Kommt Kaufkraft hinzu, spricht man von Bedarf; wird dieser am Markt wirksam, von Nachfrage."},{"q":"Ein Bedürfnis trifft auf ausreichende Kaufkraft, sodass der Wunsch tatsächlich erfüllt werden könnte. Wie wird diese Stufe in der Wirtschaftslehre bezeichnet?","o":["Nachfrage","Bedarf","Angebot","Konsum"],"c":1,"e":"Bedarf ist der Teil der Bedürfnisse, der mit Kaufkraft unterlegt ist. Zur Nachfrage wird der Bedarf erst, wenn er tatsächlich am Markt auftritt, also ein Kaufentschluss vorliegt."},{"q":"Bedürfnisse lassen sich nach ihrer Dringlichkeit einteilen. Welche Bedürfnisse müssen befriedigt werden, um das Überleben eines Menschen zu sichern?","o":["Existenzbedürfnisse","Kulturbedürfnisse","Luxusbedürfnisse","Individualbedürfnisse"],"c":0,"e":"Existenzbedürfnisse (Grundbedürfnisse) wie Nahrung, Kleidung und Wohnung sind lebensnotwendig. Kulturbedürfnisse wie Bildung oder Reisen und Luxusbedürfnisse wie Schmuck dienen dagegen einem höheren Lebensstandard."},{"q":"Güter werden nach ihrer Verfügbarkeit in freie Güter und Wirtschaftsgüter unterschieden. Welche Aussage kennzeichnet freie Güter?","o":["Güter, die vom Staat kostenlos bereitgestellt werden","Güter, die knapp sind und über den Markt gehandelt werden","Güter, die praktisch unbegrenzt vorhanden sind und keinen Preis haben","Güter, die ohne Zölle zwischen Staaten gehandelt werden"],"c":2,"e":"Freie Güter wie Luft oder Sonnenlicht sind im Verhältnis zum Bedarf unbegrenzt verfügbar und haben deshalb keinen Preis. Vom Staat bereitgestellte Leistungen sind öffentliche Güter, die über Steuern finanziert werden, und knappe Güter sind Wirtschaftsgüter."},{"q":"Die Exclusiva GmbH verfügt über ein festes Werbebudget von 20.000 Euro und möchte damit so viele Neukunden wie möglich gewinnen. Nach welchem Prinzip des ökonomischen Handelns wird hier vorgegangen?","o":["Minimalprinzip","Maximalprinzip","Optimalprinzip","Extremumprinzip"],"c":1,"e":"Beim Maximalprinzip ist der Mitteleinsatz vorgegeben und der Erfolg soll möglichst groß werden. Beim Minimalprinzip ist umgekehrt das Ziel vorgegeben und der Mitteleinsatz soll möglichst gering sein."},{"q":"Die Exclusiva GmbH möchte 500 Neukunden gewinnen und dafür so wenig Werbebudget wie möglich einsetzen. Nach welchem Prinzip des ökonomischen Handelns wird hier vorgegangen?","o":["Maximalprinzip","Optimalprinzip","Rentabilitätsprinzip","Minimalprinzip"],"c":3,"e":"Beim Minimalprinzip ist das Ziel fest vorgegeben und soll mit dem geringstmöglichen Mitteleinsatz erreicht werden. Beim Maximalprinzip wäre dagegen das Budget fest und der Erfolg möglichst groß."},{"q":"Im einfachen Wirtschaftskreislauf werden Güter- und Geldströme zwischen zwei Wirtschaftssubjekten dargestellt. Welche beiden Sektoren sind das?","o":["Unternehmen und Staat","Private Haushalte und Banken","Private Haushalte und Unternehmen","Staat und Ausland"],"c":2,"e":"Im einfachen Wirtschaftskreislauf stellen die privaten Haushalte den Unternehmen Produktionsfaktoren zur Verfügung und erhalten dafür Einkommen, mit dem sie Güter kaufen. Staat, Banken und Ausland kommen erst im erweiterten Wirtschaftskreislauf hinzu."},{"q":"Die Exclusiva GmbH bietet ihre Produkte im Onlineshop an, und Kunden fragen diese dort nach. Was versteht man in der Wirtschaftslehre unter einem Markt?","o":["Das Zusammentreffen von Angebot und Nachfrage","Die Gesamtheit aller Unternehmen einer Branche","Den Ort, an dem Waren gelagert und verteilt werden","Die Gesamtheit aller kaufkräftigen Verbraucher"],"c":0,"e":"Ein Markt ist der wirtschaftliche Ort, an dem Angebot und Nachfrage aufeinandertreffen und sich Preise bilden, unabhängig davon, ob dies physisch oder online geschieht. Die Verbraucher allein bilden nur die Nachfrageseite."},{"q":"Ein Produkt der Exclusiva GmbH wird plötzlich stark nachgefragt, das Angebot bleibt jedoch unverändert. Wie wirkt sich das nach dem Marktmechanismus tendenziell auf den Preis aus?","o":["Der Preis sinkt, weil die Anbieter mehr absetzen können","Der Preis steigt, weil das Gut knapper wird","Der Preis bleibt konstant, weil das Angebot gleich bleibt","Der Preis fällt auf die Höhe der Herstellungskosten"],"c":1,"e":"Steigt die Nachfrage bei gleichbleibendem Angebot, entsteht ein Nachfrageüberhang: Das Gut wird knapper und die Anbieter können höhere Preise durchsetzen. Ein sinkender Preis wäre die Folge eines Angebotsüberhangs."},{"q":"Welche drei Produktionsfaktoren werden in der Volkswirtschaftslehre unterschieden?","o":["Arbeit, Betriebsmittel, Werkstoffe","Arbeit, Kapital, Wissen","Boden, Kapital, Technologie","Arbeit, Boden, Kapital"],"c":3,"e":"Die volkswirtschaftlichen Produktionsfaktoren sind Arbeit, Boden (Natur) und Kapital. Arbeit, Betriebsmittel und Werkstoffe sind dagegen die betriebswirtschaftlichen Produktionsfaktoren nach Gutenberg."}]},{"name":"Quiz 10","topic":"Rechtsformen und Aufbauorganisation","src":"Kapitel 1.19 und 1.20, Buch S. 142 bis 158","mc":[{"q":"Ein Kunde der Exclusiva GmbH betreibt seinen Onlineshop als eingetragener Kaufmann (Einzelunternehmen). Wie haftet er für die Verbindlichkeiten seines Unternehmens?","o":["Nur mit dem im Handelsregister eingetragenen Betriebsvermögen","Nur bis zur Höhe der von ihm geleisteten Kapitaleinlage","Unbeschränkt mit seinem gesamten Geschäfts- und Privatvermögen","Gesamtschuldnerisch gemeinsam mit seinen Mitgesellschaftern"],"c":2,"e":"Beim Einzelunternehmen gibt es keine Trennung zwischen Geschäfts- und Privatvermögen, der Inhaber haftet daher unbeschränkt mit allem, was er besitzt. Eine Haftungsbeschränkung auf eine Einlage gibt es nur bei Kapitalgesellschaften oder beim Kommanditisten."},{"q":"Zwei Gründer wollen mit möglichst geringem Formaufwand gemeinsam einen kleinen Onlinehandel starten. Welche Rechtsform ist die einfachste Form der Personengesellschaft?","o":["Gesellschaft bürgerlichen Rechts (GbR)","Offene Handelsgesellschaft (OHG)","Kommanditgesellschaft (KG)","GmbH & Co. KG"],"c":0,"e":"Die GbR entsteht formlos durch den Zusammenschluss von mindestens zwei Personen zu einem gemeinsamen Zweck und benötigt weder Mindestkapital noch zwingend einen Handelsregistereintrag. OHG und KG setzen dagegen den Betrieb eines Handelsgewerbes und die Eintragung ins Handelsregister voraus."},{"q":"Drei Großhandelskunden der Exclusiva GmbH haben sich zu einer OHG zusammengeschlossen. Wie haften die Gesellschafter für die Schulden der OHG?","o":["Beschränkt auf die im Gesellschaftsvertrag vereinbarte Einlage","Nur mit dem Gesellschaftsvermögen, nicht mit dem Privatvermögen","Anteilig entsprechend der Höhe ihrer jeweiligen Kapitalbeteiligung","Unbeschränkt, persönlich und gesamtschuldnerisch"],"c":3,"e":"Jeder OHG-Gesellschafter haftet mit seinem gesamten Privatvermögen, und ein Gläubiger kann die volle Forderung von jedem einzelnen Gesellschafter verlangen (gesamtschuldnerisch). Eine anteilige oder auf die Einlage beschränkte Haftung gibt es bei der OHG nicht."},{"q":"Welcher Gesellschafter ist in einer Kommanditgesellschaft (KG) der Vollhafter?","o":["Der Kommanditist","Der Komplementär","Der Prokurist","Der Gesellschafter-Geschäftsführer"],"c":1,"e":"Der Komplementär haftet unbeschränkt mit seinem Privatvermögen und führt in der Regel die Geschäfte der KG. Der Kommanditist ist dagegen der Teilhafter, der Prokurist ist nur ein Bevollmächtigter und kein Gesellschafter."},{"q":"Ein Investor beteiligt sich als Kommanditist an einer KG. Womit haftet er gegenüber den Gläubigern der Gesellschaft?","o":["Nur mit seiner im Handelsregister eingetragenen Einlage","Unbeschränkt mit seinem gesamten Privatvermögen","Gesamtschuldnerisch in gleicher Weise wie der Komplementär","Nur mit seinem Anteil am laufenden Jahresgewinn"],"c":0,"e":"Der Kommanditist ist Teilhafter: Seine Haftung ist auf die im Handelsregister eingetragene Einlage begrenzt, sobald diese vollständig geleistet ist. Die unbeschränkte Haftung mit dem Privatvermögen trifft nur den Komplementär."},{"q":"Wie hoch ist das gesetzlich vorgeschriebene Mindeststammkapital einer GmbH wie der Exclusiva GmbH?","o":["1 Euro","12.500 Euro","25.000 Euro","50.000 Euro"],"c":2,"e":"Das GmbH-Gesetz schreibt ein Stammkapital von mindestens 25.000 Euro vor, von dem bei der Anmeldung mindestens die Hälfte (12.500 Euro) eingezahlt sein muss. Die 50.000 Euro sind das Mindestgrundkapital der AG, 1 Euro genügt nur bei der UG (haftungsbeschränkt)."},{"q":"Die Exclusiva GmbH prüft die Umwandlung in eine Aktiengesellschaft. Wie hoch ist das gesetzliche Mindestgrundkapital einer AG?","o":["10.000 Euro","25.000 Euro","100.000 Euro","50.000 Euro"],"c":3,"e":"Nach dem Aktiengesetz beträgt das Mindestgrundkapital einer AG 50.000 Euro, das in Aktien zerlegt ist. 25.000 Euro sind das Mindeststammkapital der GmbH und werden deshalb häufig verwechselt."},{"q":"Was kennzeichnet die Unternehmergesellschaft (haftungsbeschränkt) im Vergleich zur GmbH?","o":["Sie erfordert wie die GmbH ein Stammkapital von mindestens 25.000 Euro","Sie ist ab 1 Euro Stammkapital gründbar, muss aber jährlich Rücklagen bilden","Ihre Gesellschafter haften unbeschränkt mit ihrem gesamten Privatvermögen","Sie darf ihr Stammkapital vollständig als Sacheinlage in Form von Waren leisten"],"c":1,"e":"Die UG ist eine Sonderform der GmbH, die bereits ab 1 Euro Stammkapital gegründet werden kann; dafür muss sie jährlich ein Viertel des Jahresüberschusses in eine Rücklage einstellen, bis 25.000 Euro erreicht sind. Die Haftung ist wie bei der GmbH auf das Gesellschaftsvermögen beschränkt, Sacheinlagen sind bei der Gründung nicht zulässig."},{"q":"Welche drei Organe schreibt das Aktiengesetz für eine Aktiengesellschaft vor?","o":["Vorstand, Aufsichtsrat und Hauptversammlung","Geschäftsführung, Beirat und Gesellschafterversammlung","Vorstand, Betriebsrat und Gesellschafterversammlung","Geschäftsführung, Aufsichtsrat und Generalversammlung"],"c":0,"e":"Der Vorstand leitet die AG, der Aufsichtsrat bestellt und kontrolliert den Vorstand, und die Hauptversammlung ist das Organ der Aktionäre. Geschäftsführung und Gesellschafterversammlung sind dagegen die Organe der GmbH, die Generalversammlung gehört zur Genossenschaft."},{"q":"Wer führt bei einer GmbH wie der Exclusiva GmbH die Geschäfte und vertritt sie nach außen?","o":["Die Gesellschafterversammlung im laufenden Tagesgeschäft","Der Aufsichtsrat als gesetzlich vorgeschriebenes Pflichtorgan","Der Vorstand, der von der Hauptversammlung bestellt wird","Ein oder mehrere von den Gesellschaftern bestellte Geschäftsführer"],"c":3,"e":"Die Geschäftsführer sind das geschäftsführende und vertretungsberechtigte Organ der GmbH; sie werden von der Gesellschafterversammlung bestellt. Die Gesellschafterversammlung trifft nur die Grundsatzentscheidungen, ein Aufsichtsrat ist bei der GmbH erst ab 500 Beschäftigten Pflicht."},{"q":"Ein Gründer vergleicht verschiedene Rechtsformen für seinen geplanten Onlinehandel. Welches Kriterium spielt bei der Wahl der Rechtsform üblicherweise keine Rolle?","o":["Der Umfang der persönlichen Haftung der Gründer","Die Sortimentsbreite des geplanten Onlineshops","Der Kapitalbedarf und die Finanzierungsmöglichkeiten","Der Gründungsaufwand und die Formvorschriften"],"c":1,"e":"Typische Entscheidungskriterien für die Rechtsform sind Haftung, Kapitalbedarf, Gründungsaufwand, Geschäftsführungs- und Vertretungsbefugnis, Steuern sowie Publizitätspflichten. Die Sortimentsbreite ist eine Frage der Sortimentspolitik und hat mit der rechtlichen Organisationsform des Unternehmens nichts zu tun."},{"q":"In welcher Rechtsform werden die Anteilseigner als Aktionäre bezeichnet?","o":["Offene Handelsgesellschaft (OHG)","Kommanditgesellschaft (KG)","Aktiengesellschaft (AG)","Gesellschaft mit beschränkter Haftung (GmbH)"],"c":2,"e":"Bei der AG ist das Grundkapital in Aktien zerlegt, deren Inhaber Aktionäre heißen. Bei der GmbH spricht man dagegen von Gesellschaftern mit Geschäftsanteilen, bei OHG und KG von Gesellschaftern beziehungsweise Komplementären und Kommanditisten."},{"q":"Die Exclusiva GmbH erstellt ein Organigramm. Was ist die kleinste organisatorische Einheit in der Aufbauorganisation?","o":["Die Stelle","Die Abteilung","Die Instanz","Die Sparte"],"c":0,"e":"Die Stelle ist die kleinste organisatorische Einheit und fasst die Aufgaben zusammen, die eine Person bewältigen kann. Mehrere Stellen werden zu Abteilungen zusammengefasst; eine Instanz ist eine besondere Stelle mit Leitungsbefugnis, aber keine kleinere Einheit."},{"q":"Was versteht man in der Aufbauorganisation unter einer Instanz?","o":["Eine Stabsstelle, die die Leitung berät und entlastet","Eine ausführende Stelle ohne eigene Entscheidungskompetenz","Eine Abteilung, die mehrere gleichrangige Stellen zusammenfasst","Eine Stelle mit Leitungs- und Weisungsbefugnis gegenüber anderen Stellen"],"c":3,"e":"Eine Instanz ist eine Leitungsstelle, die anderen Stellen Weisungen erteilen darf und Entscheidungen trifft, zum Beispiel die Leitung des Onlinevertriebs. Eine Stabsstelle hat im Gegensatz dazu keine Weisungsbefugnis."},{"q":"Die Geschäftsführung der Exclusiva GmbH richtet eine Stabsstelle Recht und Datenschutz ein. Was kennzeichnet eine Stabsstelle?","o":["Sie hat Weisungsbefugnis gegenüber allen nachgeordneten Stellen","Sie führt als Instanz eine eigene Abteilung mit mehreren Stellen","Sie berät und entlastet die Leitung, hat aber keine Weisungsbefugnis","Sie übernimmt ausschließlich ausführende Tätigkeiten auf der untersten Ebene"],"c":2,"e":"Stabsstellen sind einer Instanz zugeordnet und unterstützen sie durch Beratung, Informationsbeschaffung und Entscheidungsvorbereitung. Anders als eine Instanz dürfen sie anderen Stellen keine Weisungen erteilen."},{"q":"Im Einliniensystem hat jede Stelle ...","o":["mehrere fachlich zuständige Vorgesetzte.","genau einen direkten Vorgesetzten.","je nach Projekt wechselnde Vorgesetzte.","zwei gleichberechtigte Vorgesetzte."],"c":1,"e":"Im Einliniensystem gilt das Prinzip der Einheit der Auftragserteilung: Jede Stelle erhält Weisungen nur von einer übergeordneten Instanz. Mehrere Vorgesetzte je Stelle sind das Merkmal des Mehrliniensystems."},{"q":"Welcher Nachteil ist typisch für das Einliniensystem?","o":["Lange Dienst- und Kommunikationswege über mehrere Ebenen","Kompetenzkonflikte durch mehrere weisungsbefugte Vorgesetzte","Unklare Zuständigkeiten und Verantwortlichkeiten","Hoher Abstimmungsbedarf zwischen den Weisungslinien"],"c":0,"e":"Weil jede Information und jede Weisung im Einliniensystem den vollständigen Dienstweg über alle Hierarchieebenen nehmen muss, sind die Wege lang und die oberen Instanzen stark belastet. Klare Zuständigkeiten sind dagegen gerade der Vorteil dieses Systems, Kompetenzkonflikte treten im Mehrliniensystem auf."},{"q":"Welcher Nachteil ist typisch für das Mehrliniensystem?","o":["Lange Dienstwege über viele Hierarchieebenen","Überlastung der Instanzen durch zu viele Aufgaben","Fehlende fachliche Spezialisierung der Vorgesetzten","Kompetenzkonflikte durch mehrere weisungsbefugte Vorgesetzte"],"c":3,"e":"Im Mehrliniensystem erhält eine Stelle Weisungen von mehreren spezialisierten Vorgesetzten; widersprechen sich diese Anweisungen, entstehen Kompetenzkonflikte und unklare Verantwortung. Lange Dienstwege und Überlastung der Instanzen sind dagegen die typischen Nachteile des Einliniensystems."},{"q":"Die Exclusiva GmbH gliedert ihre zweite Führungsebene in die Bereiche B2B-Großhandel und B2C-Onlineshop. Nach welchem Kriterium gliedert eine solche Spartenorganisation?","o":["Nach Verrichtungen wie Einkauf, Lager und Verkauf","Nach Objekten wie Produkten, Regionen oder Kundengruppen","Nach Hierarchieebenen von der Leitung bis zur Ausführung","Nach Projekten mit befristeter Laufzeit und eigenem Team"],"c":1,"e":"Die Spartenorganisation (Divisionalorganisation) gliedert nach Objekten, also nach Produktgruppen, Regionen oder Kundengruppen, wobei jede Sparte weitgehend eigenständig arbeitet. Die Gliederung nach Verrichtungen (Funktionen) ist dagegen das Merkmal der funktionalen Organisation."},{"q":"Was kennzeichnet die Matrixorganisation?","o":["Eine einzige durchgehende Weisungslinie von der Leitung bis zur Ausführung","Mehrere Stabsstellen, die die Leitung ohne Weisungsrecht beraten","Zwei sich überlagernde Weisungslinien, zum Beispiel nach Funktion und Produkt","Eigenständige Sparten mit jeweils eigener Ergebnisverantwortung"],"c":2,"e":"In der Matrixorganisation werden zwei Gliederungskriterien kombiniert, etwa Funktionen (Einkauf, Marketing) und Produkte oder Regionen, sodass eine Stelle zwei Vorgesetzten unterstellt ist. Eine einzige Weisungslinie kennzeichnet dagegen das Einliniensystem, eigenständige Sparten die Spartenorganisation."}]}]}];

/* ---------- Speicher ---------- */
const KEY={settings:"lf1.settings",run:"lf1.run",theme:"lf1.theme"};
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function drop(k){try{localStorage.removeItem(k);}catch(e){}}

/* ---------- Zustand ---------- */
const S={
  view:"start",
  picked:new Set(),
  mode:"ueben",
  shuffle:true,
  items:[],
  answers:[],
  idx:0,
  label:"",
  exam:null,      /* {deadline, limitMs, startedAt, endedAt} nur im Prüfungssimulator */
  overview:false
};
const EXAM={count:30,minutes:60,perPart:2,pass:50};
const allKeys=[];
DATA.forEach(d=>d.parts.forEach((p,i)=>allKeys.push(d.day+"-"+i)));
(function initSettings(){
  const st=load(KEY.settings);
  if(st&&Array.isArray(st.picked)){st.picked.forEach(k=>S.picked.add(k));}
  else allKeys.forEach(k=>S.picked.add(k));
  if(st&&st.mode)S.mode=st.mode;
  if(st&&typeof st.shuffle==="boolean")S.shuffle=st.shuffle;
})();
function saveSettings(){save(KEY.settings,{picked:[...S.picked],mode:S.mode,shuffle:S.shuffle});}
function saveRun(){
  if(S.view==="quiz"||S.view==="result")save(KEY.run,{items:S.items,answers:S.answers,idx:S.idx,mode:S.mode,label:S.label,exam:S.exam,finished:S.view==="result"});
}

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET=["A","B","C","D"];
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function mixAnswers(q){const order=shuffled(q.o.map((_,i)=>i));return {o:order.map(i=>q.o[i]),c:order.indexOf(q.c)};}
function remix(it){const m=mixAnswers(it);return {...it,o:m.o,c:m.c};}

/* Fragenliste aus Auswahl bauen */
function collect(keys){
  const list=[];
  DATA.forEach(d=>d.parts.forEach((p,i)=>{
    if(!keys.has(d.day+"-"+i))return;
    p.mc.forEach((q,n)=>{
      const m=mixAnswers(q);
      list.push({day:d.day,part:p.name,topic:p.topic,ref:p.src,no:n+1,q:q.q,o:m.o,c:m.c,e:q.e});
    });
  }));
  return list;
}
function startRun(list,label,exam){
  if(!list.length)return;
  S.items=list;S.answers=list.map(()=>null);S.idx=0;S.label=label;S.exam=exam||null;S.overview=false;
  S.view="quiz";saveRun();render();window.scrollTo(0,0);
}
/* Prüfungssimulator: aus jedem Quizteil mindestens EXAM.perPart Fragen, Rest zufällig */
function examList(){
  const byPart=[];
  DATA.forEach(d=>d.parts.forEach((p,i)=>byPart.push(shuffled(collect(new Set([d.day+"-"+i]))))));
  let list=[],rest=[];
  byPart.forEach(qs=>{list=list.concat(qs.slice(0,EXAM.perPart));rest=rest.concat(qs.slice(EXAM.perPart));});
  list=list.concat(shuffled(rest).slice(0,Math.max(0,EXAM.count-list.length)));
  return shuffled(list).slice(0,EXAM.count);
}
function startExam(){
  const now=Date.now(),limitMs=EXAM.minutes*60000;
  if(!S.exam)S.prevMode=S.mode;
  S.mode="pruefen";
  startRun(examList(),"Prüfungssimulation",{startedAt:now,deadline:now+limitMs,limitMs:limitMs,endedAt:null});
}
function fmtTime(ms){
  const s=Math.max(0,Math.ceil(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

/* Countdown */
let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function tickTimer(){
  if(S.view!=="quiz"||!S.exam){stopTimer();return;}
  const left=S.exam.deadline-Date.now();
  const el=document.getElementById("timer");
  if(el){el.textContent=fmtTime(left);el.classList.toggle("warn",left<=5*60000);}
  if(left<=0){finish();}
}
function startTimer(){stopTimer();tickTimer();timerId=setInterval(tickTimer,1000);}

/* ---------- Theme ---------- */
(function initTheme(){
  const stored=load(KEY.theme);
  const dark=stored?stored==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(dark?"dark":"light");
})();
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  document.getElementById("themeBtn").textContent=t==="dark"?"☀":"☾";
}
document.getElementById("themeBtn").addEventListener("click",()=>{
  const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  applyTheme(t);save(KEY.theme,t);
});

/* ---------- Kopfbuttons ---------- */
document.getElementById("home").addEventListener("click",goStart);
document.getElementById("toSel").addEventListener("click",goStart);
function goStart(){saveRun();S.view="start";render();window.scrollTo(0,0);}

/* ---------- Startseite ---------- */
function viewStart(){
  const run=load(KEY.run);
  const st=load(KEY.settings);S.mode=(st&&st.mode)||S.prevMode||"ueben";
  let resume="";
  if(run&&run.items&&run.items.length&&!run.finished){
    const done=run.answers.filter(x=>x!==null).length;
    const left=run.exam?(run.exam.deadline-Date.now()):null;
    const info=run.exam?(left>0?"noch "+fmtTime(left)+" Minuten":"Zeit abgelaufen"):(run.mode==="ueben"?"Üben":"Prüfen");
    resume='<div class="resume"><div class="t"><b>'+(run.exam?"Prüfung fortsetzen":"Durchlauf fortsetzen")+'</b><span>'+esc(run.label)+' · '+done+' von '+run.items.length+' beantwortet · '+info+'</span></div>'+
      '<div class="row"><button class="btn sm" id="resume">Fortsetzen</button><button class="btn sm ghost" id="discard">Verwerfen</button></div></div>';
  }

  let picks="";
  DATA.forEach(d=>{
    picks+='<h3>'+esc(d.title)+'</h3><div class="pick">';
    d.parts.forEach((p,i)=>{
      const key=d.day+"-"+i;
      picks+='<label class="opt"><input type="checkbox" data-key="'+key+'"'+(S.picked.has(key)?" checked":"")+
      '><span class="t"><b>'+esc(p.name)+'</b><span>'+esc(p.topic)+'</span></span></label>';
    });
    picks+='</div>';
  });

  app.innerHTML='<div class="view">'+resume+
    '<div class="card">'+
      '<h1>Was möchtest du üben?</h1>'+
      '<p class="lead">Schnell starten oder unten die Quizteile selbst zusammenstellen.</p>'+
      '<h3 style="margin-top:0">Schnellstart</h3>'+
      '<div class="quick">'+
        '<button class="tile" data-n="20"><b>20</b><span>zufällige Fragen</span></button>'+
        '<button class="tile" data-n="50"><b>50</b><span>zufällige Fragen</span></button>'+
        '<button class="tile" data-n="200"><b>200</b><span>alle Fragen</span></button>'+
      '</div>'+
      '<h3>Modus</h3>'+
      '<div class="between">'+
        '<div class="seg" id="modes">'+
          '<button data-m="ueben" aria-pressed="'+(S.mode==="ueben")+'">Üben</button>'+
          '<button data-m="pruefen" aria-pressed="'+(S.mode==="pruefen")+'">Prüfen</button>'+
        '</div>'+
        '<button class="switch" id="shf" aria-pressed="'+S.shuffle+'"><i></i>Fragen mischen</button>'+
      '</div>'+
      '<p class="modehint" id="modehint"></p>'+
    '</div>'+
    '<div class="card exam">'+
      '<div class="between"><div><div class="eyebrow">Prüfungssimulation</div><h2>'+EXAM.count+' Fragen in '+EXAM.minutes+' Minuten</h2></div><span class="pill">Bestanden ab '+EXAM.pass+' %</span></div>'+
      '<p class="lead">Zufällige Fragen aus allen Quizteilen, keine Auflösung während der Prüfung. Fragen lassen sich überspringen und später ändern. Nach Ablauf der Zeit wird automatisch ausgewertet.</p>'+
      '<button class="btn wide" id="exam">Prüfung starten</button>'+
    '</div>'+
    '<div class="card">'+
      '<div class="between"><h2>Eigene Auswahl</h2><span class="row"><button class="link" id="all">Alle</button><button class="link" id="none">Keine</button></span></div>'+
      picks+
      '<div class="startrow"><span class="count" id="cnt"></span><button class="btn" id="go">Auswahl starten</button></div>'+
    '</div>'+
  '</div>';

  const r=document.getElementById("resume");
  if(r){
    r.addEventListener("click",()=>{
      S.items=run.items;S.answers=run.answers;S.idx=Math.min(run.idx,run.items.length-1);S.mode=run.mode;S.label=run.label;S.exam=run.exam||null;S.overview=false;
      if(S.exam&&Date.now()>=S.exam.deadline){finish();return;}
      S.view="quiz";render();window.scrollTo(0,0);
    });
    document.getElementById("discard").addEventListener("click",()=>{drop(KEY.run);render();});
  }
  document.getElementById("exam").addEventListener("click",startExam);
  app.querySelectorAll(".tile").forEach(b=>b.addEventListener("click",()=>{
    const n=+b.dataset.n;
    const all=collect(new Set(allKeys));
    const list=n>=all.length?(S.shuffle?shuffled(all):all):shuffled(all).slice(0,n);
    startRun(list,n>=all.length?"Alle 200 Fragen":n+" zufällige Fragen");
  }));
  const boxes=app.querySelectorAll('input[data-key]');
  boxes.forEach(el=>el.addEventListener("change",()=>{
    el.checked?S.picked.add(el.dataset.key):S.picked.delete(el.dataset.key);
    saveSettings();count();
  }));
  document.getElementById("all").addEventListener("click",()=>{boxes.forEach(el=>{el.checked=true;S.picked.add(el.dataset.key);});saveSettings();count();});
  document.getElementById("none").addEventListener("click",()=>{boxes.forEach(el=>{el.checked=false;});S.picked.clear();saveSettings();count();});
  const hint=()=>{document.getElementById("modehint").textContent=S.mode==="ueben"?"Nach jeder Antwort siehst du sofort Lösung und Erklärung.":"Erst am Ende siehst du die Auswertung mit allen Lösungen.";};
  hint();
  app.querySelectorAll('#modes button').forEach(b=>b.addEventListener("click",()=>{
    S.mode=b.dataset.m;saveSettings();hint();
    app.querySelectorAll('#modes button').forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===S.mode));
  }));
  document.getElementById("shf").addEventListener("click",e=>{
    S.shuffle=!S.shuffle;saveSettings();e.currentTarget.setAttribute("aria-pressed",S.shuffle);
  });
  document.getElementById("go").addEventListener("click",()=>{
    let list=collect(S.picked);
    if(S.shuffle)list=shuffled(list);
    const parts=S.picked.size;
    startRun(list,parts===allKeys.length?"Alle Quizteile":parts+" Quizteil"+(parts===1?"":"e"));
  });
  count();
  function count(){
    let n=0;
    DATA.forEach(d=>d.parts.forEach((p,i)=>{if(S.picked.has(d.day+"-"+i))n+=p.mc.length;}));
    document.getElementById("cnt").textContent=n?n+" Fragen ausgewählt":"Kein Quizteil ausgewählt";
    document.getElementById("go").disabled=n===0;
  }
}

/* ---------- Frageansicht ---------- */
function viewQuiz(){
  const it=S.items[S.idx], a=S.answers[S.idx];
  const n=S.items.length;
  const done=S.answers.filter(x=>x!==null).length;
  const show=S.mode==="ueben"&&a!==null;

  let prog='<div class="progress'+(n>60?" bar":"")+'" aria-hidden="true">';
  if(n>60){
    const pct=Math.round(done/n*100);
    prog+='<i class="done" style="flex:'+Math.max(pct,0)+'"></i><i style="flex:'+(100-pct)+'"></i>';
  }else{
    S.items.forEach((_,i)=>{
      const x=S.answers[i];let cls="";
      if(x!==null)cls=S.mode==="ueben"?(x.ok?"ok":"no"):"done";
      if(i===S.idx)cls+=" cur";
      prog+='<i class="'+cls.trim()+'"></i>';
    });
  }
  prog+='</div>';

  /* Im Prüfmodus bleiben Antworten änderbar, im Übungsmodus ist nach der Auflösung Schluss */
  const locked=S.mode==="ueben"&&a!==null;
  let body='<div class="answers">'+it.o.map((o,i)=>{
    let cls="ans";
    if(show){ if(i===it.c)cls+=" right"; else if(a.pick===i)cls+=" wrong"; else cls+=" dim"; }
    else if(a!==null&&a.pick===i)cls+=" picked";
    return '<button class="'+cls+'" data-pick="'+i+'"'+(locked?" disabled":"")+'><span class="k">'+LET[i]+'</span><span>'+esc(o)+'</span></button>';
  }).join("")+'</div>';
  if(show)body+='<div class="note '+(a.ok?"good":"bad")+'"><b>'+(a.ok?"✓ Richtig":"✕ Leider falsch, richtig ist "+LET[it.c])+'</b>'+esc(it.e)+'</div>';

  /* Übersicht aller Fragen im Prüfmodus */
  let overview="";
  if(S.mode==="pruefen"&&S.overview){
    const open=S.answers.filter(x=>x===null).length;
    overview='<div class="card ov"><div class="between"><h2>Übersicht</h2><span class="count">'+(open?open+" offen":"alle beantwortet")+'</span></div>'+
      '<div class="grid">'+S.items.map((_,i)=>'<button class="cell'+(S.answers[i]!==null?" done":"")+(i===S.idx?" cur":"")+'" data-jump="'+i+'">'+(i+1)+'</button>').join("")+'</div>'+
      '<button class="btn wide" id="submit">'+(S.exam?"Prüfung abgeben":"Jetzt auswerten")+(open?" ("+open+" offen)":"")+'</button></div>';
  }
  const timer=S.exam?'<span class="timer" id="timer" aria-label="Restzeit">'+fmtTime(S.exam.deadline-Date.now())+'</span>':'';

  app.innerHTML='<div class="view"><div class="card">'+
    prog+
    '<div class="meta"><span>Frage <b>'+(S.idx+1)+'</b> von '+n+'</span>'+(S.exam?timer:'<span>Tag '+it.day+' · '+esc(it.part)+' · '+esc(it.topic)+'</span>')+'</div>'+
    '<p class="qtext">'+esc(it.q)+'</p>'+
    body+
    (S.exam?'':'<p class="src">Fundstelle: '+esc(it.ref)+'</p>')+
  '</div>'+overview+'</div>'+
  '<div class="dock">'+
    '<button class="btn ghost" id="prev"'+(S.idx===0?" disabled":"")+'>Zurück</button>'+
    '<span class="mid">'+(S.mode==="pruefen"?'<button class="link" id="ov">'+(S.overview?"Schließen":"Übersicht")+'</button>':'<button class="link" id="stop">Auswertung</button>')+'</span>'+
    '<button class="btn" id="next">'+(S.idx===n-1?(S.exam?"Abgeben":"Auswerten"):"Weiter")+'</button>'+
  '</div>';

  app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.pick)));
  document.getElementById("prev").addEventListener("click",()=>go(-1));
  document.getElementById("next").addEventListener("click",()=>go(1));
  const stop=document.getElementById("stop");if(stop)stop.addEventListener("click",finish);
  const ov=document.getElementById("ov");if(ov)ov.addEventListener("click",()=>{S.overview=!S.overview;render();if(S.overview){const c=app.querySelector(".ov");if(c)c.scrollIntoView({behavior:"smooth",block:"start"});}});
  app.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener("click",()=>{S.idx=+b.dataset.jump;S.overview=false;saveRun();render();window.scrollTo(0,0);}));
  const sub=document.getElementById("submit");if(sub)sub.addEventListener("click",finish);
  if(S.exam)startTimer();else stopTimer();
}
function answer(i){
  const it=S.items[S.idx];
  const first=S.answers[S.idx]===null;
  S.answers[S.idx]={pick:i,ok:i===it.c};
  saveRun();
  if(S.mode==="pruefen"){
    if(first&&S.idx<S.items.length-1)go(1);else render();
  }else render();
}
function go(step){
  const n=S.idx+step;
  if(n<0)return;
  if(n>=S.items.length){finish();return;}
  S.idx=n;saveRun();render();window.scrollTo(0,0);
}
function finish(){
  stopTimer();
  if(S.exam&&!S.exam.endedAt)S.exam.endedAt=Math.min(Date.now(),S.exam.deadline);
  S.overview=false;S.view="result";saveRun();render();window.scrollTo(0,0);
}

/* ---------- Auswertung ---------- */
function viewResult(){
  const total=S.items.length;
  let right=0,answered=0;
  const perPart={};
  S.items.forEach((it,i)=>{
    const a=S.answers[i];
    const key=it.day+"|"+it.part;
    perPart[key]=perPart[key]||{day:it.day,part:it.part,topic:it.topic,r:0,n:0};
    perPart[key].n++;
    if(a===null)return;
    answered++;
    if(a.ok){right++;perPart[key].r++;}
  });
  const pct=total?Math.round(right/total*100):0;
  const color=pct>=81?"var(--ok)":pct>=50?"var(--accent)":"var(--no)";
  const R=56,C=2*Math.PI*R;

  let rows="";
  Object.values(perPart).sort((a,b)=>a.day-b.day||a.part.localeCompare(b.part,"de",{numeric:true})).forEach(p=>{
    rows+='<tr><td>Tag '+p.day+' · '+esc(p.part)+'<small>'+esc(p.topic)+'</small></td><td class="num">'+p.r+' / '+p.n+'</td><td class="num">'+Math.round(p.r/p.n*100)+' %</td></tr>';
  });

  const wrong=[];
  S.items.forEach((it,i)=>{const a=S.answers[i];if(a===null||!a.ok)wrong.push(i);});
  let list="";
  wrong.forEach(i=>{
    const it=S.items[i],a=S.answers[i];
    const mine=a===null?"nicht beantwortet":LET[a.pick]+") "+it.o[a.pick];
    list+='<div class="item"><p class="q">'+esc(it.q)+'</p>'+
      '<p class="a x"><span class="dot"></span><span>Deine Antwort: '+esc(mine)+'</span></p>'+
      '<p class="a k"><span class="dot"></span><span>Richtig: '+LET[it.c]+') '+esc(it.o[it.c])+'</span></p>'+
      '<p class="a e">'+esc(it.e)+'</p>'+
      '<p class="a src">Tag '+it.day+' · '+esc(it.part)+' · '+esc(it.ref)+'</p></div>';
  });

  app.innerHTML='<div class="view"><div class="card">'+
    '<div class="hero">'+
      '<div class="ring"><svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="'+R+'"/><circle class="val" cx="66" cy="66" r="'+R+'" style="stroke:'+color+';stroke-dasharray:'+C+';stroke-dashoffset:'+C+'"/></svg><div class="num"><span id="pctNum">0</span><small>%</small></div></div>'+
      '<div class="t"><div class="eyebrow">'+esc(S.label)+'</div>'+
        (S.exam?'<span class="badge '+(pct>=EXAM.pass?"pass":"fail")+'">'+(pct>=EXAM.pass?"Bestanden":"Nicht bestanden")+'</span>':'')+
        '<p class="big">'+right+' von '+total+' richtig</p>'+
        '<p>'+bewertung(pct)+(answered<total?' '+(total-answered)+' Fragen blieben offen.':'')+
        (S.exam?' Benötigte Zeit '+fmtTime(S.exam.endedAt-S.exam.startedAt)+' von '+EXAM.minutes+':00 Minuten'+(S.exam.endedAt>=S.exam.deadline?', die Zeit war abgelaufen':'')+'.':'')+'</p></div>'+
    '</div>'+
    '<div class="actions">'+
      (S.exam?'<button class="btn" id="newexam">Neue Prüfung</button>':'')+
      '<button class="btn'+(S.exam?" soft":"")+'" id="restart">Gleiche Fragen erneut</button>'+
      (wrong.length?'<button class="btn soft" id="repeat">Nur die '+wrong.length+' falschen üben</button>':'')+
      '<button class="btn ghost" id="again">Neue Auswahl</button>'+
    '</div>'+
  '</div>'+
  '<div class="card"><h2>Nach Quizteil</h2><table class="res"><tr><th>Quizteil</th><th class="num">Richtig</th><th class="num">Quote</th></tr>'+rows+'</table></div>'+
  (wrong.length?'<div class="card"><h2>Zum Nacharbeiten</h2><p class="lead">Falsch oder offen, jeweils mit Lösung und Erklärung.</p><div class="review">'+list+'</div></div>':'<div class="card"><h2>Alles richtig</h2><p class="lead">Keine offenen Fragen in diesem Durchlauf.</p></div>')+
  '</div>';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const v=app.querySelector(".ring .val");
    if(v)v.style.strokeDashoffset=C*(1-pct/100);
    const num=document.getElementById("pctNum");
    const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){num.textContent=pct;return;}
    const t0=performance.now();
    (function tick(t){const k=Math.min(1,(t-t0)/900);num.textContent=Math.round(pct*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);})(t0);
  }));

  document.getElementById("again").addEventListener("click",()=>{drop(KEY.run);S.view="start";render();window.scrollTo(0,0);});
  const ne=document.getElementById("newexam");if(ne)ne.addEventListener("click",startExam);
  document.getElementById("restart").addEventListener("click",()=>{S.mode=S.exam?"ueben":S.mode;startRun(S.items.map(remix),S.exam?"Prüfungsfragen üben":S.label);});
  const rep=document.getElementById("repeat");
  if(rep)rep.addEventListener("click",()=>{if(S.exam)S.mode="ueben";startRun(wrong.map(i=>remix(S.items[i])),wrong.length+" falsche Fragen");});
}
function bewertung(p){
  if(p>=92)return "Sehr gut, das Niveau trägt durch die Prüfung.";
  if(p>=81)return "Gut, einzelne Lücken gezielt nacharbeiten.";
  if(p>=67)return "Befriedigend, die markierten Themen noch einmal durchgehen.";
  if(p>=50)return "Ausreichend, die Kapitel zu den falschen Fragen wiederholen.";
  return "Noch zu wenig, arbeite die Kapitel mit dem Handout noch einmal durch.";
}

/* ---------- Steuerung ---------- */
function render(){
  if(S.view!=="quiz")stopTimer();
  document.body.classList.toggle("quiz",S.view==="quiz");
  document.getElementById("toSel").hidden=S.view==="start";
  if(S.view==="start")viewStart();
  else if(S.view==="quiz")viewQuiz();
  else viewResult();
}
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;
  if(e.key==="ArrowRight"){go(1);e.preventDefault();return;}
  if(e.key==="ArrowLeft"){go(-1);e.preventDefault();return;}
  if(S.mode==="ueben"&&S.answers[S.idx]!==null)return;
  if(["1","2","3","4"].includes(e.key))answer(+e.key-1);
});
/* Wischen auf dem Handy */
let tx=0,ty=0,tt=0;
app.addEventListener("touchstart",e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();},{passive:true});
app.addEventListener("touchend",e=>{
  if(S.view!=="quiz")return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Date.now()-tt>600||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6)return;
  if(dx<0)go(1);else go(-1);
},{passive:true});
render();
</script>
</body>
</html>
