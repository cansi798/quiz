<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E8C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lernfeld 1 Trainer · Kaufmann/Kauffrau im E-Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --surface-2:#F5F8FB;
  --ink:#0F1B2D;
  --muted:#5B6B7D;
  --line:#DCE3EB;
  --primary:#0E6E8C;
  --primary-ink:#FFFFFF;
  --primary-soft:#E1F1F6;
  --accent:#F2A93B;
  --ok:#1F9D6B;
  --ok-soft:#E3F6EC;
  --no:#E0475B;
  --no-soft:#FCE8EB;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.08);
  --radius:18px;
  --radius-s:12px;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --dock-h:76px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0E141C;
  --surface:#172130;
  --surface-2:#1E2A3B;
  --ink:#EAF0F6;
  --muted:#93A3B5;
  --line:#2A3748;
  --primary:#3FB1D4;
  --primary-ink:#06202B;
  --primary-soft:#173A47;
  --accent:#F6B860;
  --ok:#3FCB8E;
  --ok-soft:#153A2C;
  --no:#FF6B7D;
  --no-soft:#46212A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  min-height:100dvh;
}
button{font-family:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Kopf */
header.top{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.brand .mark{
  flex:none;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;
}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex:none}
.tbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  height:40px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.tbtn:hover{border-color:var(--primary);color:var(--primary)}
.tbtn.icon{width:40px;padding:0;justify-content:center;font-size:18px}

/* Ansichten */
main{padding:18px 0 40px}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;margin-bottom:16px;
}
h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px;line-height:1.15}
h2{font-size:19px;font-weight:800;letter-spacing:-.2px;margin:0 0 4px}
h3{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}
p.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:var(--primary-ink);border:1px solid var(--primary);
  border-radius:999px;height:50px;padding:0 24px;font-size:16px;font-weight:800;cursor:pointer;
  transition:transform .12s ease,filter .12s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--primary);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn.sm{height:42px;padding:0 18px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;padding:6px 2px;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Fortsetzen */
.resume{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--primary-soft),var(--surface));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
}
.resume .t{flex:1;min-width:180px}
.resume .t b{display:block;font-size:16px;font-weight:800}
.resume .t span{color:var(--muted);font-size:14px}

/* Schnellstart */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{
  border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-s);
  padding:14px 12px;cursor:pointer;text-align:left;min-height:84px;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  transition:transform .12s ease,border-color .12s ease;
}
.tile:hover{border-color:var(--primary)}
.tile:active{transform:scale(.97)}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1;color:var(--primary)}
.tile span{font-size:13px;color:var(--muted);font-weight:600}

/* Auswahl */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.opt{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-radius:var(--radius-s);
  padding:12px 14px;cursor:pointer;background:var(--surface);min-height:56px;
  transition:border-color .12s ease,background .12s ease;
}
label.opt:hover{border-color:var(--primary)}
label.opt input{margin-top:2px;accent-color:var(--primary);flex:none;width:20px;height:20px}
label.opt .t{font-size:14px;line-height:1.35;min-width:0}
label.opt .t b{display:block;font-weight:800}
label.opt .t span{color:var(--muted);font-size:13px}
label.opt:has(input:checked){background:var(--primary-soft);border-color:var(--primary)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;max-width:100%}
.seg button{
  border:0;background:transparent;border-radius:999px;height:40px;padding:0 16px;
  font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:700;background:none;border:0;padding:6px 0}
.switch i{
  width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s ease;flex:none;
}
.switch i::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s ease;
}
.switch[aria-pressed="true"] i{background:var(--primary)}
.switch[aria-pressed="true"] i::after{transform:translateX(18px)}
.modehint{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.startrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted);font-weight:700}

/* Fortschritt */
.progress{display:flex;gap:3px;height:8px;margin-bottom:10px}
.progress i{flex:1;border-radius:3px;background:var(--line);transition:background .25s ease}
.progress i.ok{background:var(--ok)}
.progress i.no{background:var(--no)}
.progress i.cur{background:var(--accent)}
.progress i.done{background:var(--primary)}
.progress.bar{gap:0}
.progress.bar i{border-radius:0}
.progress.bar i:first-child{border-radius:3px 0 0 3px}
.progress.bar i:last-child{border-radius:0 3px 3px 0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:800;font-size:15px}

/* Frage */
.qtext{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.2px;margin:0 0 18px}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{
  display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-s);
  padding:13px 14px;font-size:16px;font-weight:600;line-height:1.4;cursor:pointer;
  min-height:56px;transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.ans:hover:not(:disabled){border-color:var(--primary)}
.ans:active:not(:disabled){transform:scale(.985)}
.ans .k{
  flex:none;width:32px;height:32px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--muted);
}
.ans.right{background:var(--ok-soft);border-color:var(--ok);animation:pulse .45s ease}
.ans.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.wrong{background:var(--no-soft);border-color:var(--no);animation:shake .4s ease}
.ans.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.ans.picked{background:var(--primary-soft);border-color:var(--primary)}
.ans.picked .k{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.ans:disabled{cursor:default}
.ans.dim{opacity:.5}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.note{
  margin-top:16px;border-radius:var(--radius-s);padding:14px 16px;font-size:15px;line-height:1.5;
  background:var(--surface-2);border:1px solid var(--line);
  animation:rise .3s ease both;
}
.note b{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-weight:800}
.note.good{background:var(--ok-soft);border-color:var(--ok)}
.note.bad{background:var(--no-soft);border-color:var(--no)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.src{font-size:13px;color:var(--muted);margin-top:14px}

/* Prüfung */
.card.exam{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface))}
.card.exam h2{margin-top:2px}
.card.exam .btn{margin-top:4px}
.pill{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.timer.warn{color:var(--no);border-color:var(--no);background:var(--no-soft);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{opacity:.55}}
.ov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:12px 0 16px}
.cell{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;cursor:pointer;color:var(--muted)}
.cell.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;margin:6px 0 4px;letter-spacing:.3px}
.badge.pass{background:var(--ok-soft);color:var(--ok)}
.badge.fail{background:var(--no-soft);color:var(--no)}

/* Aktionsleiste */
.dock{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.dock .mid{flex:1;text-align:center}
.dock .btn{min-width:120px}

/* Ergebnis */
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .val{stroke:var(--primary);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:44px;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring .num small{font-size:14px;color:var(--muted);font-weight:700;margin-left:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero .t{flex:1;min-width:200px}
.hero .t .big{font-size:24px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px}
.hero .t p{margin:0;color:var(--muted);font-size:15px}
table.res{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
table.res th,table.res td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.res th{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
table.res td.num,table.res th.num{text-align:right;white-space:nowrap;font-weight:700}
table.res td small{display:block;color:var(--muted);font-weight:500}
.review{margin-top:6px}
.review .item{padding:16px 0;border-bottom:1px solid var(--line)}
.review .item:last-child{border-bottom:0}
.review .q{font-size:16px;font-weight:700;margin:0 0 8px;line-height:1.4}
.review .a{font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:flex-start}
.review .a .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.review .a.x .dot{background:var(--no)}
.review .a.k .dot{background:var(--ok)}
.review .a.e{color:var(--muted);margin-top:6px;display:block}
.review .a.src{color:var(--muted);font-size:12.5px;display:block}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 20px 30px}

/* Mobil */
@media(max-width:720px){
  .wrap{padding:0 14px}
  .bar{height:56px}
  main{padding:14px 0 calc(var(--dock-h) + env(safe-area-inset-bottom) + 12px)}
  .card{padding:18px 16px;border-radius:16px}
  h1{font-size:23px}
  .quick{grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{padding:12px 10px;min-height:76px}
  .tile b{font-size:21px}
  .pick{grid-template-columns:1fr}
  .qtext{font-size:19px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:0 8px;font-size:14px}
  .between{flex-direction:column;align-items:stretch}
  .switch{justify-content:flex-start}
  .startrow{flex-direction:column;align-items:stretch}
  .startrow .btn{width:100%}
  .count{text-align:center}
  .hero{justify-content:center;text-align:center}
  .hero .t{min-width:0;width:100%}
  .actions .btn{width:100%}
  body.quiz .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  body.quiz .dock .btn{min-width:0;flex:1;height:50px}
  body.quiz .dock .mid{flex:none}
  body:not(.quiz) main{padding-bottom:40px}
  .resume{padding:16px}
  .resume .row{width:100%}
  .resume .row .btn{flex:1}
  .review .q{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{header.top,.dock,.btn,.tbtn{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <button class="brand" id="home" aria-label="Zur Startseite">
      <span class="mark">LF1</span>
      <span><b>Lernfeld 1 Trainer</b><span>Kaufmann/Kauffrau im E-Commerce</span></span>
    </button>
    <div class="tools">
      <button class="tbtn" id="toSel" hidden>Auswahl</button>
      <button class="tbtn icon" id="themeBtn" aria-label="Hell oder dunkel umschalten" title="Hell oder dunkel">☾</button>
    </div>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>
<footer class="wrap">200 Multiple-Choice-Fragen aus den Tagesquiz der Seminartage 1 bis 5. Antworten werden bei jedem Durchlauf neu gemischt.</footer>

<script>
const DATA=[{"day":1,"title":"Seminartag 1","parts":[{"name":"Quiz 1","topic":"Modellunternehmen und Orientierung im Unternehmen","src":"Kapitel 1.1 und 1.2, Buch S. 9 bis 25","mc":[{"q":"Welche Rechtsform hat das Modellunternehmen Exclusiva?","o":["Offene Handelsgesellschaft (OHG)","Gesellschaft mit beschränkter Haftung (GmbH)","Aktiengesellschaft (AG)","Kommanditgesellschaft (KG)"],"c":1,"e":"Das Modellunternehmen firmiert als Exclusiva GmbH und ist damit eine Kapitalgesellschaft. OHG und KG sind Personengesellschaften, bei denen mindestens ein Gesellschafter unbeschränkt haftet."},{"q":"Womit haftet eine GmbH gegenüber ihren Gläubigern?","o":["Mit dem Privatvermögen aller Gesellschafter","Mit dem Privatvermögen der Geschäftsführung","Ausschließlich mit dem Gesellschaftsvermögen","Mit dem Privatvermögen des Mehrheitsgesellschafters"],"c":2,"e":"Bei der GmbH ist die Haftung auf das Gesellschaftsvermögen beschränkt; das Privatvermögen der Gesellschafter bleibt geschützt. Die Geschäftsführung haftet nur in Ausnahmefällen, etwa bei Pflichtverletzungen."},{"q":"In welcher Abteilung des Handelsregisters wird eine GmbH eingetragen?","o":["In Abteilung A, wie Einzelkaufleute","In Abteilung B, wie Aktiengesellschaften","In Abteilung A, wie Personengesellschaften","In Abteilung B, wie Kommanditgesellschaften"],"c":1,"e":"Kapitalgesellschaften wie GmbH und AG stehen in Abteilung B des Handelsregisters. Abteilung A ist für Einzelkaufleute und Personengesellschaften wie OHG und KG vorgesehen."},{"q":"Was beschreibt die Betriebsform eines Handelsunternehmens?","o":["Die rechtliche Organisation, zum Beispiel als GmbH oder AG","Die Gliederung des Unternehmens in Abteilungen und Stellen","Die Einordnung des Unternehmens nach Umsatz und Beschäftigtenzahl","Die Erscheinungsform nach Merkmalen wie Sortiment, Verkaufsform und Standort"],"c":3,"e":"Die Betriebsform kennzeichnet, wie ein Handelsunternehmen am Markt auftritt, etwa als Fachgeschäft, Discounter oder Onlineshop. Die rechtliche Organisation ist dagegen die Rechtsform, die Gliederung in Abteilungen die Aufbauorganisation."},{"q":"Wovon hängt das Warensortiment eines Handelsunternehmens vor allem ab?","o":["Von der Branche und der Betriebsgröße","Von der Rechtsform und dem Stammkapital","Von der Handelsregisterabteilung und dem Firmensitz","Von der Anzahl der Gesellschafter und der Haftung"],"c":0,"e":"Die Branche bestimmt, welche Warenarten überhaupt angeboten werden, und die Betriebsgröße, wie breit und tief das Sortiment sein kann. Rechtsform, Stammkapital oder Haftung sagen nichts über das Warenangebot aus."},{"q":"Was ist die Grundidee eines Assessmentcenters bei der Personalauswahl?","o":["Bewerber lösen einen schriftlichen Wissens- und Intelligenztest","Bewerber führen ein strukturiertes Einzelgespräch mit der Personalabteilung","Bewerber werden in berufsnahen Übungen von mehreren Beobachtern beurteilt","Bewerber arbeiten mehrere Wochen zur Probe in der Fachabteilung mit"],"c":2,"e":"Im Assessmentcenter bearbeiten mehrere Bewerber praxisnahe Aufgaben wie Gruppendiskussionen, Rollenspiele oder Postkorbübungen, während geschulte Beobachter ihr Verhalten bewerten. Ein reiner Wissenstest oder ein Einzelgespräch sind eigenständige Auswahlverfahren."},{"q":"Was regelt die Aufbauorganisation eines Unternehmens?","o":["Die Gliederung des Unternehmens in Abteilungen und Stellen","Den zeitlichen und räumlichen Ablauf der Arbeitsprozesse","Die Reihenfolge der Arbeitsschritte innerhalb eines Auftrags","Die Zuordnung der Arbeitsgänge zu den einzelnen Arbeitsplätzen"],"c":0,"e":"Die Aufbauorganisation legt die statische Struktur fest: Welche Stellen und Abteilungen gibt es und wer ist wem unterstellt. Der zeitliche und räumliche Ablauf der Arbeitsprozesse gehört zur Ablauforganisation."},{"q":"Was versteht man im Handel unter der Verkaufsform?","o":["Die Art, wie das Sortiment nach Breite und Tiefe gegliedert ist","Die Art, wie die Ware beim Lieferanten beschafft wird","Die Art, wie das Unternehmen rechtlich organisiert ist","Die Art, wie der Kunde die Ware auswählen und erwerben kann"],"c":3,"e":"Die Verkaufsform beschreibt, wie der Kunde an die Ware gelangt, zum Beispiel Bedienung, Selbstbedienung oder Distanzhandel über einen Onlineshop. Breite und Tiefe betreffen die Sortimentsgestaltung, nicht die Verkaufsform."},{"q":"Welche Aussage zu einem Filialunternehmen mit Zentrale trifft zu?","o":["Jede Filiale legt Sortiment und Preise eigenständig fest","Wesentliche Entscheidungen werden in der Zentrale getroffen","Die Filialen sind rechtlich selbstständige Unternehmen","Die Zentrale ist nur für die Buchführung der Filialen zuständig"],"c":1,"e":"In einem Filialsystem steuert die Zentrale die wichtigen Bereiche wie Einkauf, Sortiment, Preise und Marketing einheitlich für alle Filialen. Die Filialen sind unselbstständige Betriebsstätten desselben Unternehmens."},{"q":"Warum übernimmt die Zentrale eines Filialunternehmens häufig den Einkauf für alle Filialen gemeinsam?","o":["Weil das Handelsgesetzbuch dies für Filialbetriebe vorschreibt","Weil sich dadurch die Lieferzeiten für jede Filiale verkürzen","Weil größere Bestellmengen günstigere Einkaufskonditionen ermöglichen","Weil jede Filiale so ein individuelles Sortiment erhalten kann"],"c":2,"e":"Durch die gebündelte Beschaffung steigen die Bestellmengen, wodurch Mengenrabatte und bessere Konditionen bei den Lieferanten erreicht werden. Eine gesetzliche Pflicht zum zentralen Einkauf gibt es nicht."},{"q":"Was kennzeichnet eine Stabsstelle in der Aufbauorganisation?","o":["Eine Leitungsstelle mit Weisungsbefugnis gegenüber mehreren Abteilungen","Die oberste Leitungsebene, die alle Abteilungen koordiniert","Eine ausführende Stelle ohne eigene Entscheidungsbefugnis","Eine beratende Stelle ohne Weisungsbefugnis gegenüber anderen Stellen"],"c":3,"e":"Stabsstellen wie Recht oder Controlling unterstützen und beraten eine Leitungsstelle, dürfen aber selbst keine Weisungen an andere Stellen erteilen. Weisungsbefugnis haben nur die Linienstellen."},{"q":"Wer vertritt eine GmbH nach außen und führt ihre Geschäfte?","o":["Die Geschäftsführerin bzw. der Geschäftsführer","Die Gesellschafterversammlung","Der Aufsichtsrat","Der Vorstand"],"c":0,"e":"Die Geschäftsführung ist das gesetzliche Vertretungsorgan der GmbH. Die Gesellschafterversammlung fasst Grundsatzbeschlüsse, der Vorstand ist das Leitungsorgan der AG."},{"q":"Welches der folgenden Merkmale wird NICHT zur Beschreibung eines Handelsunternehmens herangezogen?","o":["Die Rechtsform des Unternehmens","Die Betriebsform des Unternehmens","Die Steuerklasse der Beschäftigten","Das Warensortiment des Unternehmens"],"c":2,"e":"Ein Unternehmen wird über Merkmale wie Rechtsform, Betriebsform, Sortiment, Standort und Betriebsgröße beschrieben. Die Steuerklasse ist ein persönliches Merkmal einzelner Beschäftigter und sagt nichts über das Unternehmen aus."},{"q":"Wie sollte sich ein Auszubildender am ersten Arbeitstag verhalten?","o":["Zurückhaltend bleiben und Fragen erst nach der Probezeit stellen","Sofort eigene Verbesserungsvorschläge für die Abläufe einbringen","Sich nur an die Kolleginnen und Kollegen der eigenen Abteilung wenden","Pünktlich erscheinen, höflich auftreten und aufmerksam zuhören"],"c":3,"e":"Pünktlichkeit, Höflichkeit und Aufmerksamkeit schaffen einen guten ersten Eindruck und erleichtern die Einarbeitung. Verbesserungsvorschläge sind erst sinnvoll, wenn man die Abläufe kennt."},{"q":"Welche Informationsquelle hilft einem neuen Mitarbeiter am besten, sich im Unternehmen zu orientieren?","o":["Das Organigramm des Unternehmens","Der Jahresabschluss des Unternehmens","Der Gesellschaftsvertrag der GmbH","Die Personalakten der Abteilung"],"c":0,"e":"Das Organigramm zeigt die Abteilungen, Stellen und Zuständigkeiten auf einen Blick und macht so Ansprechpartner und Wege im Unternehmen sichtbar. Jahresabschluss und Gesellschaftsvertrag enthalten dazu keine Angaben."},{"q":"Was enthält der betriebliche Ausbildungsplan?","o":["Die Regelungen zu Urlaub und Arbeitszeit im Betrieb","Die sachliche und zeitliche Gliederung der Ausbildung","Die Aufteilung der Ausbildungsvergütung nach Ausbildungsjahren","Den Stundenplan der Berufsschule für das Ausbildungsjahr"],"c":1,"e":"Der Ausbildungsplan legt fest, welche Inhalte in welchem Zeitraum und in welcher Abteilung vermittelt werden. Urlaub, Arbeitszeit und Vergütung stehen im Ausbildungsvertrag, der Stundenplan kommt von der Berufsschule."},{"q":"Wofür steht die Abkürzung JAV?","o":["Jugend- und Arbeitnehmervereinigung","Junge Auszubildende im Verband","Jahresausbildungsvertrag","Jugend- und Auszubildendenvertretung"],"c":3,"e":"Die Jugend- und Auszubildendenvertretung vertritt die Interessen der Auszubildenden und der Beschäftigten unter 18 Jahren gegenüber dem Betriebsrat und dem Arbeitgeber. Die anderen Begriffe sind Wortneuschöpfungen ohne rechtliche Grundlage."},{"q":"Wie geht man in der Einarbeitung am besten mit offenen Fragen um?","o":["Fragen notieren und beim zuständigen Ansprechpartner klären","Fragen durch eigenes Ausprobieren selbst beantworten","Fragen bis zum nächsten Beurteilungsgespräch zurückstellen","Fragen direkt an die Geschäftsführung richten"],"c":0,"e":"Notierte Fragen gehen nicht verloren und können gebündelt mit dem Ausbilder oder der Kollegin geklärt werden. Eigenes Ausprobieren ohne Rücksprache kann zu Fehlern führen, die Geschäftsführung ist dafür nicht die richtige Ebene."},{"q":"Wer ist im Betrieb die erste Anlaufstelle für Auszubildende bei Fragen zur Ausbildung?","o":["Die Ausbildungsberatung der IHK","Die Klassenleitung der Berufsschule","Die Ausbilderin bzw. der Ausbilder","Die Geschäftsführung des Unternehmens"],"c":2,"e":"Die Ausbilderin bzw. der Ausbilder ist im Betrieb für die Durchführung der Ausbildung verantwortlich und daher erster Ansprechpartner. Die IHK-Ausbildungsberatung wird erst eingeschaltet, wenn Probleme betrieblich nicht gelöst werden können."},{"q":"Welches Verhalten eines Auszubildenden signalisiert Lernbereitschaft?","o":["Aufgaben nur nach ausdrücklicher Anweisung erledigen","Notizen machen und bei Unklarheiten aktiv nachfragen","Bekannte Aufgaben möglichst schnell abschließen","Vorschläge der Kollegen grundsätzlich kritisch hinterfragen"],"c":1,"e":"Wer mitschreibt und nachfragt, zeigt Interesse und sorgt dafür, dass Erklärungen nicht mehrfach nötig sind. Schnelles Abarbeiten bekannter Aufgaben allein zeigt Routine, aber keine Bereitschaft, Neues zu lernen."}]},{"name":"Quiz 2","topic":"Handlungskompetenz und soziale Kompetenz","src":"Kapitel 1.3 und 1.4, Buch S. 26 bis 47","mc":[{"q":"Was versteht man im Sinne der Ausbildungsordnung unter beruflicher Handlungskompetenz?","o":["Das in der Berufsschule vermittelte Fachwissen, das in der Abschlussprüfung abgefragt wird","Die Summe aller Arbeitstechniken, die ein Auszubildender im Betrieb kennengelernt hat","Die Fähigkeit, in beruflichen Situationen sachgerecht, durchdacht und verantwortungsvoll zu handeln","Die Bereitschaft, betriebliche Anweisungen zuverlässig und ohne Rückfragen umzusetzen"],"c":2,"e":"Berufliche Handlungskompetenz verbindet Wissen, Können und Wollen: Man handelt in beruflichen Situationen fachlich richtig, überlegt und verantwortungsbewusst. Reines Fachwissen oder das bloße Befolgen von Anweisungen reicht dafür nicht aus."},{"q":"Aus welchen drei Dimensionen setzt sich die berufliche Handlungskompetenz zusammen?","o":["Fachkompetenz, Selbstkompetenz und Sozialkompetenz","Fachkompetenz, Methodenkompetenz und Lernkompetenz","Sachkompetenz, Führungskompetenz und Teamkompetenz","Planungskompetenz, Handlungskompetenz und Kontrollkompetenz"],"c":0,"e":"Die Handlungskompetenz besteht aus Fachkompetenz, Selbstkompetenz (auch Personalkompetenz oder Humankompetenz genannt) und Sozialkompetenz. Methoden- und Lernkompetenz sind keine eigenständigen Dimensionen, sondern Bestandteile dieser drei."},{"q":"Was sind Schlüsselqualifikationen?","o":["Fachliche Spezialkenntnisse, die nur in einem bestimmten Beruf benötigt werden","Formale Nachweise wie Zeugnisse und Zertifikate, die den Berufszugang eröffnen","Die Grundfertigkeiten Lesen, Schreiben und Rechnen als Voraussetzung jeder Ausbildung","Überfachliche Fähigkeiten, die in vielen beruflichen Situationen einsetzbar sind"],"c":3,"e":"Schlüsselqualifikationen sind überfachliche Fähigkeiten wie Teamfähigkeit, Kommunikationsfähigkeit oder Selbstorganisation, die berufsübergreifend genutzt werden können. Berufsspezifisches Spezialwissen gehört dagegen zur Fachkompetenz."},{"q":"Zu welcher Kompetenzdimension gehört die Fähigkeit, im Team zusammenzuarbeiten?","o":["Fachkompetenz","Sozialkompetenz","Selbstkompetenz","Methodenkompetenz"],"c":1,"e":"Teamfähigkeit betrifft den Umgang mit anderen Menschen und gehört daher zur Sozialkompetenz. Selbstkompetenz bezieht sich dagegen auf den Umgang mit der eigenen Person, etwa Eigenverantwortung und Selbstorganisation."},{"q":"Welche Arbeitsweise kennzeichnet das aktive Lesen eines Fachtextes?","o":["Wichtige Stellen markieren, Randnotizen anfertigen und den Inhalt zusammenfassen","Den Text in einem Durchgang vollständig und ohne Unterbrechung durchlesen","Den Text mehrfach hintereinander lesen, bis der Inhalt auswendig sitzt","Zunächst nur die Überschriften überfliegen, um einen groben Überblick zu erhalten"],"c":0,"e":"Aktives Lesen bedeutet, sich mit dem Text auseinanderzusetzen: markieren, Randnotizen machen, Fragen stellen und zusammenfassen. Bloßes Überfliegen oder mehrfaches Durchlesen ohne Verarbeitung bleibt passives Lesen."},{"q":"Warum ist passives Lesen für das Lernen wenig wirksam?","o":["Weil es deutlich mehr Zeit beansprucht als andere Lesetechniken","Weil dabei die Konzentration schneller nachlässt als beim Zuhören","Weil das Gedächtnis kaum gefordert wird und deshalb weniger behalten wird","Weil der Textinhalt nicht mit den Lernzielen des Lehrplans abgeglichen wird"],"c":2,"e":"Beim passiven Lesen wird der Inhalt nicht verarbeitet, das Gedächtnis wird kaum angesprochen und der Stoff wird schnell vergessen. Der Zeitaufwand ist nicht das Problem, sondern die fehlende Verarbeitung."},{"q":"Welche Technik eignet sich besonders, um Ideen zu sammeln und übersichtlich zu strukturieren?","o":["Karteikarten","Zeitplanung","Protokollieren","Mindmapping"],"c":3,"e":"Beim Mindmapping werden Ideen von einem zentralen Begriff aus in Ästen und Unterästen angeordnet, was Zusammenhänge sichtbar macht. Karteikarten dienen dagegen vor allem dem Wiederholen und Einprägen."},{"q":"Was gehört zur Methodenkompetenz?","o":["Das Wissen über Produkte, Preise und Abläufe im eigenen Unternehmen","Die Beherrschung von Lern- und Arbeitstechniken wie Mindmapping oder Zeitplanung","Die Fähigkeit, Konflikte im Team sachlich anzusprechen und zu lösen","Die Bereitschaft, Verantwortung für das eigene Handeln zu übernehmen"],"c":1,"e":"Methodenkompetenz umfasst Lern- und Arbeitstechniken, mit denen Aufgaben planvoll und selbstständig bearbeitet werden. Produktwissen zählt zur Fachkompetenz, Konfliktlösung zur Sozialkompetenz."},{"q":"Nach dem Kommunikationsmodell von Schulz von Thun hat jede Nachricht ...","o":["eine Seite","zwei Seiten","drei Seiten","vier Seiten"],"c":3,"e":"Nach Schulz von Thun enthält jede Nachricht vier Seiten: Sachinhalt, Selbstoffenbarung, Beziehung und Appell. Das Modell wird deshalb auch Vier-Ohren-Modell oder Nachrichtenquadrat genannt."},{"q":"Welche Seite einer Nachricht drückt nach Schulz von Thun aus, was der Sender beim Empfänger erreichen möchte?","o":["Sachinhalt","Beziehung","Appell","Selbstoffenbarung"],"c":2,"e":"Die Appellseite enthält, wozu der Sender den Empfänger bewegen möchte. Die Beziehungsseite zeigt dagegen, wie der Sender zum Empfänger steht, und die Selbstoffenbarung, was der Sender über sich selbst preisgibt."},{"q":"Was kennzeichnet eine Ich-Botschaft?","o":["Eine Aussage über eigene Wahrnehmungen, Gefühle und Bedürfnisse","Eine höflich formulierte Bitte an den Gesprächspartner","Eine sachliche Bewertung des Verhaltens des Gesprächspartners","Eine neutrale Beschreibung der Situation ohne persönliche Wertung"],"c":0,"e":"Eine Ich-Botschaft beschreibt, was man selbst wahrnimmt und wie man sich dabei fühlt, ohne den anderen anzugreifen. Eine Bewertung des Gegenübers ist dagegen eine Du-Botschaft, auch wenn sie sachlich formuliert ist."},{"q":"Welches Verhalten gehört zum aktiven Zuhören?","o":["Dem Gesprächspartner sofort eigene Lösungsvorschläge anbieten","Nachfragen und das Gehörte in eigenen Worten wiedergeben","Den Gesprächspartner ausreden lassen und dann das Thema wechseln","Gegenargumente vorbereiten, während der andere noch spricht"],"c":1,"e":"Aktives Zuhören bedeutet, dem Gesprächspartner Aufmerksamkeit zu zeigen, nachzufragen und das Gehörte zu paraphrasieren. Sofortige Lösungsvorschläge oder das Vorbereiten von Gegenargumenten lenken vom Zuhören ab."},{"q":"Wodurch werden Konflikte im Arbeitsalltag in der Regel verschärft?","o":["Durch frühes und offenes Ansprechen des Problems","Durch das Einbeziehen einer neutralen dritten Person","Durch Kompromissvorschläge beider Seiten","Durch Du-Vorwürfe und persönliche Angriffe"],"c":3,"e":"Du-Vorwürfe und persönliche Angriffe führen dazu, dass sich der andere verteidigt und die Sachebene verlassen wird. Frühes Ansprechen, neutrale Vermittlung und Kompromissbereitschaft wirken dagegen deeskalierend."},{"q":"Was versteht man unter nonverbaler Kommunikation?","o":["Mimik, Gestik und Körperhaltung","Tonfall, Lautstärke und Sprechtempo","Schriftliche Kommunikation per E-Mail oder Chat","Die Wortwahl in einem persönlichen Gespräch"],"c":0,"e":"Nonverbale Kommunikation ist die Verständigung ohne Worte, also über Mimik, Gestik, Blickkontakt und Körperhaltung. Tonfall und Lautstärke gehören zur paraverbalen Kommunikation, die das gesprochene Wort begleitet."},{"q":"Welche Regel gehört zu einem guten Feedback?","o":["Feedback möglichst allgemein halten, damit sich niemand angegriffen fühlt","Feedback erst nach längerer Zeit geben, wenn der Ärger verflogen ist","Beobachtungen konkret und beschreibend statt bewertend formulieren","Feedback in der Gruppe geben, damit alle daraus lernen können"],"c":2,"e":"Gutes Feedback ist konkret, beschreibend und bezieht sich auf beobachtbares Verhalten statt auf Bewertungen der Person. Es sollte außerdem zeitnah und unter vier Augen gegeben werden, nicht allgemein oder vor der Gruppe."},{"q":"Was zeichnet erfolgreiche Teamarbeit aus?","o":["Alle Mitglieder erledigen dieselben Aufgaben, damit niemand bevorzugt wird","Gemeinsame Ziele, klare Rollen und offene Kommunikation","Eine Teamleitung, die alle Entscheidungen trifft und Aufgaben zuweist","Jedes Mitglied arbeitet eigenständig und stimmt sich nur bei Bedarf ab"],"c":1,"e":"Ein Team arbeitet erfolgreich, wenn alle ein gemeinsames Ziel verfolgen, die Rollen klar verteilt sind und offen kommuniziert wird. Entscheidet eine Person allein oder arbeitet jeder für sich, fehlt das Zusammenwirken."},{"q":"Zu welcher Kompetenzdimension zählen Eigenverantwortung und Selbstorganisation?","o":["Sozialkompetenz","Fachkompetenz","Methodenkompetenz","Selbstkompetenz"],"c":3,"e":"Eigenverantwortung, Selbstorganisation und Zuverlässigkeit betreffen den Umgang mit der eigenen Person und gehören zur Selbstkompetenz. Sozialkompetenz beschreibt dagegen den Umgang mit anderen Menschen."},{"q":"Warum gewinnen Schlüsselqualifikationen in der Arbeitswelt zunehmend an Bedeutung?","o":["Fachwissen veraltet schnell, überfachliche Fähigkeiten bleiben dauerhaft einsetzbar","Sie werden in der IHK-Abschlussprüfung stärker gewichtet als das Fachwissen","Sie sind in der Ausbildungsordnung als eigenständiges Prüfungsfach vorgeschrieben","Sie ersetzen mit der Digitalisierung zunehmend die klassische Fachkompetenz"],"c":0,"e":"Fachwissen veraltet durch technischen Wandel immer schneller, während überfachliche Fähigkeiten wie Lernbereitschaft und Teamfähigkeit dauerhaft nutzbar sind. Schlüsselqualifikationen ergänzen die Fachkompetenz, ersetzen sie aber nicht."},{"q":"Ein Kollege bei der Exclusiva GmbH sagt: „Immer lässt du die Ablage liegen.“ Welche Formulierung wäre stattdessen eine Ich-Botschaft?","o":["„Könntest du bitte in Zukunft die Ablage erledigen, bevor du gehst?“","„Ich finde, du solltest die Ablage nicht immer liegen lassen.“","„Mir ist aufgefallen, dass die Ablage liegen geblieben ist. Das belastet mich, weil ich sie dann übernehmen muss.“","„Ich habe den Eindruck, dass dir die Ablage nicht wichtig ist.“"],"c":2,"e":"Eine Ich-Botschaft beschreibt die eigene Wahrnehmung, das eigene Gefühl und den Grund dafür, ohne den anderen zu bewerten. Sätze wie „Ich finde, du solltest ...“ sind verdeckte Du-Botschaften, obwohl sie mit „Ich“ beginnen."},{"q":"Was sollte man bei einem aufkommenden Konflikt im Team zuerst tun?","o":["Abwarten, ob sich der Konflikt von selbst löst","Das Gespräch suchen und den Konflikt früh sachlich ansprechen","Die Ausbildungsleitung oder Vorgesetzte um Vermittlung bitten","Den Konflikt in der nächsten Teambesprechung offen zur Sprache bringen"],"c":1,"e":"Konflikte sollten früh, direkt und sachlich mit dem Betroffenen angesprochen werden, bevor sie sich verfestigen. Vorgesetzte oder das ganze Team einzubeziehen ist erst sinnvoll, wenn ein direktes Gespräch nicht zum Ziel führt."}]}]},{"day":2,"title":"Seminartag 2","parts":[{"name":"Quiz 3","topic":"E-Commerce-Arten und Vertriebskanäle","src":"Kapitel 1.5 und 1.6, Buch S. 48 bis 67","mc":[{"q":"Die Exclusiva GmbH wickelt Beschaffung, Verkauf, Zahlung und Kundenservice zunehmend über digitale Systeme ab. Welche Definition beschreibt den Begriff E-Business zutreffend?","o":["Die elektronische Unterstützung ausschließlich des Verkaufsprozesses im Webshop","Die Nutzung elektronischer Medien allein für Werbung und Kundenkommunikation","Die elektronische Abwicklung sämtlicher Geschäftsprozesse eines Unternehmens","Die elektronische Verwaltung der Buchführung und des internen Rechnungswesens"],"c":2,"e":"E-Business umfasst die Digitalisierung aller Geschäftsprozesse, also neben Verkauf auch Beschaffung, Logistik, Zahlung und Service. Die Beschränkung auf den Verkauf beschreibt lediglich den Teilbereich E-Commerce."},{"q":"Wie ist das Verhältnis zwischen E-Business und E-Commerce fachlich korrekt beschrieben?","o":["E-Commerce ist der wichtigste Teilbereich des umfassenderen E-Business","E-Business ist ein Teilbereich des umfassenderen E-Commerce","E-Business und E-Commerce bezeichnen denselben Sachverhalt","E-Business betrifft nur B2B, E-Commerce betrifft nur B2C"],"c":0,"e":"E-Business ist der Oberbegriff für alle elektronisch abgewickelten Geschäftsprozesse, E-Commerce bezeichnet darin den Teilbereich des elektronischen Handels. Die umgekehrte Zuordnung ist ein häufiger Fehler."},{"q":"Immer mehr Kunden der Exclusiva GmbH bestellen per Smartphone-App. Was kennzeichnet Mobile Commerce (M-Commerce)?","o":["Den Handel über einen Onlineshop, der ausschließlich am Desktop-PC genutzt wird","Den Vertrieb über mobile Verkaufsstellen wie Verkaufswagen und Messestände","Den Handel über Telefon und Katalog ohne Nutzung des Internets","Geschäftsbeziehungen und Käufe über mobile Endgeräte wie Smartphones und Tablets"],"c":3,"e":"M-Commerce ist der Teil des E-Commerce, der über mobile internetfähige Endgeräte abgewickelt wird. Der Desktop-Onlineshop ist klassischer E-Commerce, mobile Verkaufsstellen gehören zum stationären Vertrieb."},{"q":"Wofür steht die Abkürzung B2C im E-Commerce?","o":["Business-to-Company","Business-to-Consumer","Business-to-Customer-Service","Business-to-Commerce"],"c":1,"e":"B2C steht für Business-to-Consumer und bezeichnet Geschäftsbeziehungen zwischen Unternehmen und privaten Endverbrauchern. Geschäfte zwischen Unternehmen (Company) wären dagegen B2B."},{"q":"Die Exclusiva GmbH verkauft als Großhändler über ihr Bestellportal Waren an Einzelhändler. Welche E-Commerce-Art liegt vor?","o":["B2C (Business-to-Consumer)","C2C (Consumer-to-Consumer)","B2B (Business-to-Business)","B2A (Business-to-Administration)"],"c":2,"e":"Beide Geschäftspartner sind Unternehmen, daher handelt es sich um Business-to-Business. B2C läge nur vor, wenn an private Endverbraucher verkauft würde."},{"q":"Eine Privatperson verkauft ihr gebrauchtes Fahrrad über eine Auktionsplattform an eine andere Privatperson. Welche E-Commerce-Art liegt vor?","o":["B2C (Business-to-Consumer)","C2C (Consumer-to-Consumer)","C2B (Consumer-to-Business)","B2B (Business-to-Business)"],"c":1,"e":"Verkäufer und Käufer sind private Endverbraucher, daher liegt Consumer-to-Consumer vor. Die Plattform ist nur Vermittler und macht das Geschäft nicht zu B2C."},{"q":"Welche Bedeutung hat die Ziffer 2 in Abkürzungen wie B2C oder B2B?","o":["Sie steht für „second“ und kennzeichnet die zweite Handelsstufe","Sie steht für „two-way“ und kennzeichnet den beidseitigen Austausch","Sie steht für „two“ und kennzeichnet zwei beteiligte Unternehmen","Sie steht für „to“ und kennzeichnet die Richtung der Geschäftsbeziehung"],"c":3,"e":"Die Ziffer 2 wird im Englischen wie „to“ ausgesprochen und beschreibt die Richtung vom Anbieter zum Abnehmer, etwa Business to Consumer. Mit der Zahl zwei oder einer zweiten Handelsstufe hat sie nichts zu tun."},{"q":"Die Exclusiva GmbH überlegt, ob sie ihre Waren künftig auch über Marktplätze und Einzelhändler anbieten soll. Welchem Instrument des Marketing-Mix ist diese Entscheidung zuzuordnen?","o":["Der Distributionspolitik, die den Weg der Ware zum Kunden steuert","Der Preispolitik, die Konditionen und Rabatte für die Kunden festlegt","Der Kommunikationspolitik, die Werbung und Kundenansprache gestaltet","Der Produktpolitik, die Sortiment und Produktqualität bestimmt"],"c":0,"e":"Die Distributionspolitik legt fest, über welche Absatzwege und Vertriebskanäle die Ware zum Kunden gelangt. Preise, Werbung und Sortiment sind die übrigen Instrumente des Marketing-Mix."},{"q":"Was kennzeichnet den direkten Absatz?","o":["Der Hersteller verkauft über den Großhandel an den Einzelhandel","Der Hersteller lässt seine Waren durch Handelsvertreter vermitteln","Der Hersteller beauftragt Kommissionäre mit dem Verkauf im eigenen Namen","Der Hersteller verkauft ohne zwischengeschaltete Handelsstufe an den Kunden"],"c":3,"e":"Beim direkten Absatz gelangt die Ware ohne selbstständige Handelsbetriebe vom Hersteller zum Kunden, zum Beispiel über den eigenen Webshop oder Werksverkauf. Sobald Groß- oder Einzelhandel dazwischenstehen, liegt indirekter Absatz vor."},{"q":"Welcher der folgenden Vertriebswege gehört zum indirekten Absatz?","o":["Verkauf über den eigenen Webshop des Herstellers","Verkauf über den Werksverkauf am Produktionsstandort","Verkauf über selbstständige Einzelhändler","Verkauf über das eigene Ladengeschäft des Herstellers"],"c":2,"e":"Beim indirekten Absatz ist mindestens eine selbstständige Handelsstufe wie der Einzelhandel zwischengeschaltet. Eigener Webshop, Werksverkauf und eigenes Ladengeschäft sind Formen des direkten Absatzes."},{"q":"Wofür steht die Abkürzung SEO im Online-Marketing?","o":["Search Engine Optimization","Search Engine Operation","Sales Engine Optimization","Social Engagement Optimization"],"c":0,"e":"SEO steht für Search Engine Optimization, also Suchmaschinenoptimierung, mit dem Ziel, in den organischen Suchergebnissen besser gefunden zu werden. Die anderen Auflösungen sind keine gebräuchlichen Fachbegriffe."},{"q":"Worin besteht der wesentliche Unterschied zwischen SEO und SEA?","o":["SEO wirkt nur bei Onlineshops, SEA wirkt nur bei Unternehmenswebsites","SEO verbessert die organischen Treffer, SEA sind bezahlte Suchanzeigen","SEO sind bezahlte Suchanzeigen, SEA verbessert die organischen Treffer","SEO betrifft die Suchmaschine Google, SEA betrifft alle übrigen Suchmaschinen"],"c":1,"e":"SEO (Search Engine Optimization) verbessert die unbezahlte, organische Platzierung, SEA (Search Engine Advertising) bezeichnet bezahlte Anzeigen in den Suchergebnissen. Die Vertauschung beider Begriffe ist die typische Verwechslung."},{"q":"Die Exclusiva GmbH möchte Blogbetreiber dafür bezahlen, dass sie über Links Käufer in den Webshop vermitteln. Welches Instrument des Online-Marketings ist das?","o":["Influencer-Marketing, bei dem Produkte gegen Honorar präsentiert werden","Content-Marketing, bei dem nützliche Inhalte Kunden anziehen sollen","Display-Advertising, bei dem Bannerwerbung auf fremden Seiten geschaltet wird","Affiliate-Marketing, bei dem Partner gegen Provision Käufer vermitteln"],"c":3,"e":"Beim Affiliate-Marketing erhalten Partner (Affiliates) eine erfolgsabhängige Provision für vermittelte Käufe oder Kontakte. Beim Influencer-Marketing wird dagegen meist ein festes Honorar für die Präsentation gezahlt."},{"q":"Welcher Vorteil spricht für den Verkauf über große Verkaufsplattformen wie Amazon oder eBay?","o":["Der Händler behält die volle Hoheit über die Kundendaten","Der Händler ist vollständig unabhängig vom Plattformbetreiber","Der Händler profitiert von hoher Reichweite und vorhandenem Kundenvertrauen","Der Händler zahlt keinerlei Gebühren für die Nutzung der Plattform"],"c":2,"e":"Große Plattformen bringen viele Besucher und genießen bereits das Vertrauen der Kunden, was den Einstieg erleichtert. Datenhoheit und Unabhängigkeit gehören dagegen zu den Vorteilen des eigenen Webshops."},{"q":"Welcher Nachteil ergibt sich beim Plattformverkauf im Vergleich zum eigenen Webshop?","o":["Gebühren und Abhängigkeit vom Plattformbetreiber","Geringere Reichweite bei potenziellen Neukunden","Höherer Aufwand für den Aufbau des Kundenvertrauens","Fehlende Möglichkeit, gängige Zahlungsarten anzubieten"],"c":0,"e":"Plattformen verlangen Verkaufsgebühren und geben Regeln vor, von denen der Händler abhängig ist. Reichweite und Kundenvertrauen sind gerade die Stärken der Plattformen, nicht ihre Schwächen."},{"q":"Die Exclusiva GmbH verkauft über Webshop, Ladengeschäft und Katalog, ohne dass die Kanäle miteinander verbunden sind. Welcher Begriff beschreibt diese Vertriebsform?","o":["Single-Channel-Vertrieb über einen ausgewählten Kanal","Multichannel-Vertrieb über mehrere Kanäle nebeneinander","Omnichannel-Vertrieb über vollständig verzahnte Kanäle","Cross-Channel-Vertrieb über ausschließlich digitale Kanäle"],"c":1,"e":"Beim Multichannel-Vertrieb werden mehrere Vertriebskanäle parallel genutzt, ohne dass sie zwingend miteinander verknüpft sind. Erst die vollständige Vernetzung aller Kanäle macht daraus Omnichannel."},{"q":"Was unterscheidet den Omnichannel-Vertrieb vom Multichannel-Vertrieb?","o":["Beim Omnichannel werden ausschließlich digitale Kanäle eingesetzt","Beim Omnichannel werden weniger Kanäle als beim Multichannel genutzt","Beim Omnichannel arbeiten die Kanäle getrennt voneinander","Beim Omnichannel sind alle Kanäle miteinander verzahnt"],"c":3,"e":"Omnichannel bedeutet, dass Online- und Offline-Kanäle nahtlos verknüpft sind und der Kunde jederzeit zwischen ihnen wechseln kann. Beim Multichannel bestehen die Kanäle zwar parallel, arbeiten aber weitgehend getrennt."},{"q":"Welcher Kanal zählt zu den unternehmenseigenen Online-Vertriebswegen?","o":["Der eigene Webshop der Exclusiva GmbH","Das Verkäuferkonto auf einer fremden Auktionsplattform","Der Eintrag auf dem Preisvergleichsportal eines Dritten","Der Shop auf dem Marktplatz eines Handelspartners"],"c":0,"e":"Nur der eigene Webshop wird vollständig vom Unternehmen betrieben und kontrolliert. Auktionsplattformen, Preisvergleichsportale und fremde Marktplätze sind unternehmensfremde Kanäle Dritter."},{"q":"Ein Kunde bestellt online im Webshop der Exclusiva GmbH und holt die Ware in der Filiale ab. Wie heißt dieses Konzept?","o":["Cash and Carry","Pay per Click","Click and Collect","Ship from Store"],"c":2,"e":"Click and Collect verbindet Online-Bestellung mit Abholung im stationären Geschäft und ist ein typisches Omnichannel-Element. Cash and Carry bezeichnet dagegen den Selbstabholer-Großhandel mit Barzahlung vor Ort."},{"q":"Was versteht man unter E-Mail-Marketing als Instrument der Kundenansprache im Vertrieb?","o":["Den Versand von Rechnungen und Lieferscheinen per E-Mail","Newsletter und Angebots-Mails an bestehende und potenzielle Kunden","Die interne Abstimmung zwischen Vertrieb und Marketing per E-Mail","Die Beantwortung von Kundenanfragen über ein Ticketsystem"],"c":1,"e":"E-Mail-Marketing nutzt Newsletter und personalisierte Angebots-Mails, um Kunden zu informieren und zum Kauf zu bewegen. Rechnungsversand und Anfragenbearbeitung sind Serviceprozesse, aber keine Marketingmaßnahmen."}]},{"name":"Quiz 4","topic":"Webshop einrichten, Name und Adresse","src":"Kapitel 1.7 und 1.8, Buch S. 68 bis 91","mc":[{"q":"Die Exclusiva GmbH plant ihren neuen Webshop. Welche Funktion gehört zwingend zum Kernbereich jedes Webshops, ohne die ein Online-Verkauf nicht möglich ist?","o":["Newsletter-Versand mit Kundensegmentierung","Live-Chat mit dem Kundenservice","Warenkorb mit Bestellabschluss (Checkout)","Bewertungsfunktion für Produkte"],"c":2,"e":"Ohne Warenkorb und Checkout kann der Kunde keine Bestellung aufgeben, daher ist diese Funktion unverzichtbar. Newsletter, Live-Chat und Bewertungen sind sinnvolle Zusatzfunktionen, aber kein zwingender Kernbestandteil."},{"q":"Die Exclusiva GmbH prüft einen Mietshop (Software as a Service). Welche Aussage kennzeichnet dieses Modell zutreffend?","o":["Geringe Startkosten, laufende monatliche Gebühren und schnelle Einrichtung","Hohe Anfangsinvestition, dafür keine laufenden Kosten mehr","Einmalige Lizenzgebühr und Betrieb auf einem eigenen Server","Kostenloser Quellcode, der selbst gehostet und gepflegt wird"],"c":0,"e":"Beim Mietshop stellt der Anbieter die fertige Shopsoftware gegen eine laufende Gebühr bereit, sodass der Einstieg schnell und mit geringen Startkosten möglich ist. Kostenloser Quellcode mit eigenem Hosting beschreibt dagegen eine Open-Source-Lösung."},{"q":"Welcher Vorteil ist typisch für eine Open-Source-Shoplösung wie zum Beispiel Magento oder Shopware Community Edition?","o":["Der Anbieter übernimmt Updates und Sicherheitspflege","Rechtssichere Texte sind bereits automatisch enthalten","Hosting ist im Lieferumfang der Software inbegriffen","Für die Nutzung der Software fallen keine Lizenzkosten an"],"c":3,"e":"Open-Source-Software wird ohne Lizenzgebühren bereitgestellt und kann frei angepasst werden. Updates, Sicherheit und Hosting muss der Betreiber jedoch selbst organisieren, das übernimmt kein Anbieter."},{"q":"Welcher Nachteil ist typisch für den Betrieb eines Open-Source-Shops?","o":["Die Anpassungsmöglichkeiten des Systems sind stark eingeschränkt","Hosting, Updates und Sicherheit muss der Betreiber selbst verantworten","Für jede Installation fallen hohe Lizenzgebühren an","Eine kommerzielle Nutzung ist lizenzrechtlich ausgeschlossen"],"c":1,"e":"Bei Open Source liegt die gesamte technische Verantwortung für Hosting, Updates und Sicherheit beim Betreiber, was Know-how und Aufwand erfordert. Die Anpassungsmöglichkeiten sind dagegen gerade besonders groß, und Lizenzgebühren fallen nicht an."},{"q":"Die Exclusiva GmbH vergleicht mehrere Shopsysteme. Welches Kriterium gehört fachlich zur Auswahl eines Shopsystems?","o":["Anzahl der Mitarbeiter in der Personalabteilung","Standort der Filialen im stationären Handel","Skalierbarkeit und vorhandene Schnittstellen","Höhe der Umsatzsteuer auf die Produkte"],"c":2,"e":"Ein Shopsystem muss mit dem Unternehmen wachsen können (Skalierbarkeit) und sich über Schnittstellen an Warenwirtschaft, Zahlungsanbieter und Versand anbinden lassen. Filialstandorte oder Personalstärke haben keinen Einfluss auf die Eignung der Software."},{"q":"Warum ist für die Exclusiva GmbH die Anbindung des Webshops an das Warenwirtschaftssystem wichtig?","o":["Bestände und Bestellungen werden automatisch zwischen Shop und Lager abgeglichen","Die Buchführung wird dadurch vollständig an den Steuerberater ausgelagert","Die Suchmaschinenplatzierung des Shops verbessert sich automatisch","Kunden können ihre Bestellungen direkt im Lagerbestand einsehen"],"c":0,"e":"Durch die Schnittstelle zur Warenwirtschaft werden Lagerbestände, Preise und Bestellungen automatisch synchronisiert, sodass Überverkäufe und doppelte Datenpflege vermieden werden. Mit Buchführung oder Suchmaschinenplatzierung hat die Anbindung nichts zu tun."},{"q":"Für welche Zielgruppe eignet sich ein Mietshop (SaaS) besonders gut?","o":["Großunternehmen mit eigener IT-Abteilung und speziellen Prozessen","Händler, die ausschließlich im B2B-Bereich tätig sind","Unternehmen, die den Quellcode vollständig selbst kontrollieren wollen","Einsteiger mit begrenztem Budget und wenig technischem Know-how"],"c":3,"e":"Ein Mietshop ist schnell startklar, benötigt kaum technisches Wissen und verursacht geringe Anfangskosten, was ihn für Einsteiger ideal macht. Unternehmen mit sehr speziellen Prozessen oder dem Wunsch nach voller Kontrolle wählen eher eine Eigenentwicklung oder Open Source."},{"q":"Welches Argument spricht für eine Eigenentwicklung des Webshops?","o":["Die geringsten Kosten aller Betriebsmodelle","Maximale Anpassbarkeit und volle Kontrolle über das System","Sofortige Verfügbarkeit ohne Entwicklungsaufwand","Der Wegfall von Wartung und Weiterentwicklung"],"c":1,"e":"Eine Eigenentwicklung wird exakt auf die Prozesse des Unternehmens zugeschnitten und bleibt vollständig in eigener Hand. Sie ist jedoch teuer, zeitaufwendig und muss dauerhaft selbst gewartet werden, sofortige Verfügbarkeit bietet dagegen der Mietshop."},{"q":"Was versteht man unter der Domain eines Webshops?","o":["Die numerische IP-Adresse des Servers, auf dem der Shop liegt","Das Übertragungsprotokoll, mit dem der Browser den Shop aufruft","Der weltweit eindeutige Name, unter dem der Shop im Internet erreichbar ist","Der Speicherplatz, den der Provider für die Shopdaten bereitstellt"],"c":2,"e":"Die Domain ist der eindeutige, für Menschen lesbare Name im Internet, der auf die IP-Adresse des Servers verweist. Die IP-Adresse selbst, das Protokoll und der Speicherplatz (Hosting) sind eigene Begriffe."},{"q":"Wie wird die Endung einer Domain wie zum Beispiel .de oder .com fachlich bezeichnet?","o":["Second-Level-Domain","Top-Level-Domain","Subdomain","Root-Domain"],"c":1,"e":"Die Endung ganz rechts ist die Top-Level-Domain, entweder länderspezifisch (.de) oder generisch (.com). Die Second-Level-Domain ist der frei wählbare Name links davon, eine Subdomain steht noch weiter links."},{"q":"Die Exclusiva GmbH nutzt die Adresse www.shop.exclusiva.de. Welcher Bestandteil ist bei dieser Adresse das Element „exclusiva“?","o":["Top-Level-Domain","Subdomain","Protokoll","Second-Level-Domain"],"c":3,"e":"Die Second-Level-Domain ist der frei gewählte Name direkt links von der Top-Level-Domain .de, hier also „exclusiva“. „shop“ und „www“ sind Subdomains (Third-Level-Domains), das Protokoll wäre zum Beispiel https."},{"q":"Welche Organisation ist für die Vergabe und Verwaltung von Domains mit der Endung .de zuständig?","o":["DENIC eG","ICANN","Bundesnetzagentur","Deutsches Patent- und Markenamt"],"c":0,"e":"Die DENIC eG ist die zentrale Registrierungsstelle für alle .de-Domains. Die ICANN koordiniert weltweit das Domain-Namen-System und die Top-Level-Domains, vergibt aber keine einzelnen .de-Domains."},{"q":"Welche Eigenschaften sollte ein guter Domainname für einen Webshop besitzen?","o":["Möglichst viele Schlüsselwörter, auch wenn er dadurch lang wird","Ein eigener Name für jede Produktkategorie","Kurz, einprägsam und leicht zu schreiben","Bindestriche und Ziffern zur besseren Unterscheidbarkeit"],"c":2,"e":"Ein Domainname soll sich Kunden leicht merken und fehlerfrei eintippen können, daher sollte er kurz, einprägsam und einfach zu schreiben sein. Lange Keyword-Ketten, Ziffern oder Bindestriche erschweren die Merkbarkeit und führen zu Tippfehlern."},{"q":"Was muss vor der Registrierung einer Wunschdomain zwingend geprüft werden, um rechtliche Konflikte zu vermeiden?","o":["Die Eintragung des Unternehmens im Handelsregister","Bestehende Marken- und Namensrechte Dritter","Die Gewerbeanmeldung beim zuständigen Ordnungsamt","Die Anmeldung der Domain beim Finanzamt"],"c":1,"e":"Verletzt eine Domain fremde Marken- oder Namensrechte, drohen Abmahnungen, Schadensersatz und der Verlust der Domain. Handelsregister, Gewerbeanmeldung und Finanzamt betreffen die Unternehmensgründung, nicht die Zulässigkeit eines Domainnamens."},{"q":"Was versteht man unter Domain-Grabbing?","o":["Das vorsorgliche Sichern des eigenen Markennamens unter mehreren Endungen","Die Übernahme abgelaufener Domains zur Verbesserung des Suchmaschinenrankings","Die Weiterleitung mehrerer Domains auf eine Hauptdomain","Die missbräuchliche Registrierung fremder Namen, um die Domains teuer zu verkaufen"],"c":3,"e":"Beim Domain-Grabbing registriert jemand gezielt Domains mit fremden Marken- oder Firmennamen, um sie dem eigentlichen Rechteinhaber teuer anzubieten. Das Sichern des eigenen Markennamens unter mehreren Endungen ist dagegen eine legitime Schutzmaßnahme."},{"q":"Wozu dient ein SSL-/TLS-Zertifikat im Webshop der Exclusiva GmbH?","o":["Zur verschlüsselten Datenübertragung zwischen Browser und Server über https","Zur Bestätigung der Gewerbeanmeldung gegenüber dem Kunden","Zur Absicherung der Ware gegen Transportschäden beim Versand","Zur automatischen Archivierung der Rechnungen für die Buchhaltung"],"c":0,"e":"Das SSL-/TLS-Zertifikat verschlüsselt die Verbindung (erkennbar an https und dem Schlosssymbol) und bestätigt die Identität des Shops, was besonders bei Kundendaten und Zahlungen wichtig ist. Mit Versand, Gewerbeanmeldung oder Buchhaltung hat es nichts zu tun."},{"q":"Aus welchen Bestandteilen setzt sich eine vollständige URL wie https://www.exclusiva.de/damenmode zusammen?","o":["Firmenname, Rechtsform und Sitz des Unternehmens","IP-Adresse des Kunden und Servername des Shops","Protokoll, Domain und gegebenenfalls Pfad","Domainname, E-Mail-Adresse und Impressum"],"c":2,"e":"Eine URL besteht aus dem Protokoll (https://), der Domain (www.exclusiva.de) und optional einem Pfad zu einer bestimmten Seite (/damenmode). Die IP-Adresse des Kunden oder Angaben zur Rechtsform gehören nicht zur URL."},{"q":"Was versteht man im Zusammenhang mit einem Webshop unter Hosting?","o":["Die Vermittlung von Zahlungen zwischen Kunde und Händler","Die Bereitstellung von Speicherplatz und Servern für die Website durch einen Provider","Die Registrierung und Verwaltung des Domainnamens","Die Einbindung von Werbeanzeigen auf fremden Websites"],"c":1,"e":"Hosting bedeutet, dass ein Provider Serverkapazität und Speicherplatz bereitstellt, damit der Shop rund um die Uhr im Internet erreichbar ist. Die Domainregistrierung ist ein eigener Schritt, auch wenn viele Provider beides anbieten."},{"q":"Die Wunschdomain der Exclusiva GmbH ist bereits an ein anderes Unternehmen vergeben. Was ist ein sinnvoller erster Schritt?","o":["Alternative Namen oder eine andere Top-Level-Domain prüfen","Die Domain bei einem anderen Registrar erneut beantragen","Die gleiche Domain mit einer Subdomain davor registrieren","Beim Inhaber die Löschung der Domain wegen Namensgleichheit fordern"],"c":0,"e":"Eine vergebene Domain kann nicht doppelt registriert werden, daher prüft man zunächst Alternativen wie eine andere Schreibweise oder eine andere Endung (.com, .shop). Ein Anspruch auf Löschung besteht nur bei nachweisbarer Verletzung eigener Marken- oder Namensrechte."},{"q":"Warum sollte die Verwendung von Umlauten im Domainnamen (zum Beispiel „möbel-exclusiva.de“) kritisch geprüft werden?","o":["Umlaut-Domains werden von der DENIC grundsätzlich nicht registriert","Umlaut-Domains verursachen deutlich höhere Registrierungsgebühren","Umlaut-Domains werden von Suchmaschinen nicht indexiert","Umlaute können zu Tippfehlern und Kompatibilitätsproblemen führen"],"c":3,"e":"Umlaut-Domains (IDN) sind zwar registrierbar, aber auf ausländischen Tastaturen schwer einzugeben und werden in E-Mail-Adressen oder älteren Systemen nicht überall korrekt unterstützt. Deshalb sollte zusätzlich die Schreibweise mit „ae“, „oe“, „ue“ gesichert werden."}]}]},{"day":3,"title":"Seminartag 3","parts":[{"name":"Quiz 5","topic":"Usability und duale Berufsausbildung","src":"Kapitel 1.9 und 1.10, Buch S. 92 bis 104","mc":[{"q":"Die Exclusiva GmbH möchte die Usability ihres Onlineshops verbessern. Was ist unter dem Begriff Usability zu verstehen?","o":["Die Erreichbarkeit des Shops über Suchmaschinen","Die technische Verfügbarkeit des Shops rund um die Uhr","Die Benutzerfreundlichkeit des Shops für die Nutzer","Die Barrierefreiheit des Shops für Menschen mit Einschränkungen"],"c":2,"e":"Usability bezeichnet die Gebrauchstauglichkeit bzw. Benutzerfreundlichkeit eines Systems: Nutzer sollen ihre Ziele einfach und angenehm erreichen. Barrierefreiheit ist nur ein Teilaspekt davon, Verfügbarkeit und Auffindbarkeit sind eigene Kriterien."},{"q":"Nach der Norm DIN EN ISO 9241 wird die Usability eines Systems anhand von drei Kriterien beurteilt. Welche sind das?","o":["Effektivität, Effizienz und Zufriedenheit","Erreichbarkeit, Sicherheit und Aktualität","Ladezeit, Reichweite und Verfügbarkeit","Übersichtlichkeit, Farbgestaltung und Textmenge"],"c":0,"e":"Gute Usability liegt vor, wenn Nutzer ihr Ziel erreichen (Effektivität), dies mit angemessenem Aufwand tun (Effizienz) und dabei zufrieden sind. Ladezeit oder Übersichtlichkeit sind Einflussfaktoren, aber nicht die drei genormten Kriterien."},{"q":"Die Produktseiten der Exclusiva GmbH laden mehrere Sekunden lang. Welche Auswirkung haben lange Ladezeiten typischerweise?","o":["Eine höhere Verweildauer, weil Nutzer länger auf der Seite bleiben","Eine bessere Platzierung in den Suchergebnissen","Eine höhere Conversion-Rate durch gründlichere Produktprüfung","Eine höhere Absprungrate, weil Nutzer die Seite vorzeitig verlassen"],"c":3,"e":"Lange Ladezeiten führen dazu, dass viele Nutzer die Seite verlassen, bevor sie geladen ist; die Absprungrate steigt. Die längere Verweildauer ist ein typischer Trugschluss, da die Zeit nicht aktiv genutzt wird, und Suchmaschinen werten langsame Seiten eher ab."},{"q":"Was versteht man unter responsivem Webdesign?","o":["Eine Gestaltung, bei der der Shop automatisch auf Kundenanfragen im Chat antwortet","Eine Darstellung, die sich automatisch an die Bildschirmgröße des Endgeräts anpasst","Eine separate mobile Version des Shops unter einer eigenen Subdomain","Eine Gestaltung, bei der Inhalte erst beim Scrollen nachgeladen werden"],"c":1,"e":"Responsives Design bedeutet, dass sich Layout und Inhalte flexibel an Smartphone, Tablet oder Desktop anpassen. Eine eigene mobile Subdomain ist gerade keine responsive Lösung, sondern eine getrennte Seitenversion."},{"q":"Im Web-Controlling der Exclusiva GmbH wird die Conversion-Rate ausgewertet. Was gibt diese Kennzahl an?","o":["Den Anteil der Besucher, die eine gewünschte Handlung wie einen Kauf ausführen","Den Anteil der Besucher, die den Shop nach nur einer Seite wieder verlassen","Den Anteil der Bestellungen, die vom Kunden zurückgeschickt werden","Das Verhältnis von Seitenaufrufen zur Anzahl der Besucher"],"c":0,"e":"Die Conversion-Rate misst, wie viele Besucher zu Käufern bzw. zu einer gewünschten Aktion umgewandelt werden. Der Anteil der Besucher, die sofort wieder gehen, ist dagegen die Absprungrate, und der Anteil zurückgeschickter Bestellungen die Retourenquote."},{"q":"Auf einer Produktseite befindet sich der auffällig gestaltete Button „In den Warenkorb“. Um welches Gestaltungselement handelt es sich?","o":["Um ein Vertrauenselement","Um ein Navigationselement","Um einen Breadcrumb","Um einen Call-to-Action"],"c":3,"e":"Ein Call-to-Action ist eine klare Handlungsaufforderung, die den Nutzer zum nächsten Schritt wie dem Kauf führt. Navigationselemente und Breadcrumbs dienen der Orientierung im Shop, Vertrauenselemente wie Gütesiegel dem Vertrauensaufbau."},{"q":"Die Exclusiva GmbH stellt viele Kaufabbrüche im Checkout fest. Welche Maßnahme senkt die Abbruchquote am ehesten?","o":["Eine verpflichtende Kundenregistrierung, damit Daten für Folgekäufe gespeichert sind","Zusätzliche Abfragen im Formular, um Kundendaten für das Marketing zu gewinnen","Wenige Schritte, nur notwendige Pflichtfelder und eine Bestellung als Gast","Die Beschränkung auf eine einzige Zahlungsart, um den Ablauf zu vereinfachen"],"c":2,"e":"Ein schlanker Checkout mit wenigen Schritten, minimalen Pflichtfeldern und Gastbestellung reduziert Hürden und damit Abbrüche. Eine Registrierungspflicht oder nur eine Zahlungsart wirken zwar auf den ersten Blick vereinfachend, sind aber häufige Abbruchgründe."},{"q":"Die Exclusiva GmbH bindet Gütesiegel und Kundenbewertungen in ihren Shop ein. Welche Funktion haben diese Elemente?","o":["Sie dienen als Navigationselemente, die den Nutzer durch das Sortiment führen","Sie dienen als Vertrauenselemente, die Unsicherheit abbauen und die Conversion stärken","Sie dienen als Suchmaschinenelemente, die das Ranking direkt verbessern","Sie dienen als rechtliche Pflichtangaben nach dem Telemediengesetz"],"c":1,"e":"Gütesiegel und Bewertungen schaffen Vertrauen bei Neukunden, die den Shop noch nicht kennen, und erhöhen so die Kaufwahrscheinlichkeit. Rechtlich vorgeschrieben sind sie nicht, anders als etwa Impressum und Datenschutzerklärung."},{"q":"Vor dem Relaunch lässt die Exclusiva GmbH Testpersonen typische Aufgaben im neuen Shop lösen. Was deckt ein solcher Usability-Test auf?","o":["Sicherheitslücken in der Shopsoftware","Fehler bei der Berechnung von Preisen und Steuern","Abweichungen zwischen Lagerbestand und Shopanzeige","Schwachstellen in Bedienung und Nutzerführung"],"c":3,"e":"Beim Usability-Test beobachtet man, wo Nutzer stocken, Fehler machen oder abbrechen, und erkennt so Probleme in Bedienung und Nutzerführung. Sicherheitslücken oder Rechenfehler werden dagegen durch technische Tests bzw. Penetrationstests gefunden."},{"q":"Warum gilt die mobile Optimierung eines Onlineshops heute als unverzichtbar?","o":["Weil ein Großteil der Zugriffe inzwischen über Smartphones erfolgt","Weil Shops ohne mobile Version gesetzlich nicht mehr betrieben werden dürfen","Weil Desktop-Nutzer in der Regel keine Bestellungen mehr aufgeben","Weil Zahlungsdienstleister nur noch mobile Endgeräte unterstützen"],"c":0,"e":"Der mobile Anteil am Traffic liegt in vielen Shops bei über der Hälfte, und Suchmaschinen bewerten Seiten nach ihrer mobilen Darstellung. Eine gesetzliche Pflicht besteht nicht, und auch Desktop-Bestellungen bleiben relevant."},{"q":"Die Ausbildung zum Kaufmann bzw. zur Kauffrau im E-Commerce ist eine duale Berufsausbildung. Was bedeutet in diesem Zusammenhang „dual“?","o":["Die Ausbildung endet mit zwei getrennten Abschlussprüfungen","Die Ausbildung wird von zwei Ausbildungsbetrieben gemeinsam getragen","Die Ausbildung findet an zwei Lernorten statt, im Betrieb und in der Berufsschule","Die Ausbildung wird durch zwei Verträge mit Betrieb und Kammer geregelt"],"c":2,"e":"Dual bedeutet, dass die Ausbildung an zwei Lernorten stattfindet: Der Betrieb vermittelt die Praxis, die Berufsschule die Theorie. Die gestreckte Abschlussprüfung in zwei Teilen hat nichts mit dem Begriff dual zu tun."},{"q":"Welches Gesetz regelt in Deutschland die betriebliche Berufsausbildung?","o":["Das Handelsgesetzbuch (HGB)","Das Berufsbildungsgesetz (BBiG)","Das Jugendarbeitsschutzgesetz (JArbSchG)","Das Bürgerliche Gesetzbuch (BGB)"],"c":1,"e":"Das Berufsbildungsgesetz ist die zentrale Rechtsgrundlage der betrieblichen Ausbildung, etwa für Vertrag, Probezeit, Vergütung und Prüfungen. Das Jugendarbeitsschutzgesetz schützt nur minderjährige Auszubildende, das HGB regelt das Handelsrecht."},{"q":"Für jeden anerkannten Ausbildungsberuf gibt es eine Ausbildungsordnung. Was legt diese fest?","o":["Die Lernfelder und Unterrichtsinhalte der Berufsschule","Die Höhe der Ausbildungsvergütung und den Urlaubsanspruch","Die Pflichten der Auszubildenden gegenüber dem Betrieb","Ausbildungsberufsbild, Ausbildungsrahmenplan und Prüfungsanforderungen für den Betrieb"],"c":3,"e":"Die Ausbildungsordnung regelt die betriebliche Seite: Bezeichnung und Dauer des Berufs, das Berufsbild, den Rahmenplan und die Prüfungsanforderungen. Die schulischen Inhalte stehen dagegen im Rahmenlehrplan, Vergütung und Urlaub im Ausbildungsvertrag bzw. Tarifvertrag."},{"q":"Worauf basiert der Unterricht in der Berufsschule inhaltlich?","o":["Auf der Ausbildungsordnung des Bundes","Auf dem betrieblichen Ausbildungsplan","Auf dem Rahmenlehrplan der Kultusministerkonferenz","Auf der Prüfungsordnung der zuständigen IHK"],"c":2,"e":"Der Rahmenlehrplan der Kultusministerkonferenz legt die Lernfelder und Inhalte des Berufsschulunterrichts fest und ist mit der Ausbildungsordnung abgestimmt. Die Ausbildungsordnung selbst gilt für die betriebliche Ausbildung."},{"q":"Wie lang darf die Probezeit in einem Berufsausbildungsverhältnis nach dem BBiG sein?","o":["Mindestens einen und höchstens vier Monate","Mindestens zwei und höchstens sechs Monate","Höchstens sechs Monate, wie bei einem Arbeitsvertrag","Mindestens drei und höchstens zwölf Monate"],"c":0,"e":"Nach § 20 BBiG beträgt die Probezeit mindestens einen und höchstens vier Monate. Die sechs Monate sind die typische Probezeit in normalen Arbeitsverhältnissen und werden daher oft verwechselt."},{"q":"Wie lang ist die reguläre Ausbildungsdauer zum Kaufmann bzw. zur Kauffrau im E-Commerce?","o":["Zwei Jahre","Drei Jahre","Zweieinhalb Jahre","Dreieinhalb Jahre"],"c":1,"e":"Die Ausbildung dauert regulär drei Jahre und kann bei guten Leistungen oder entsprechender Vorbildung verkürzt werden. Zweijährige Ausbildungen sind eher Verkäuferberufe, dreieinhalb Jahre gelten für viele gewerblich-technische Berufe."},{"q":"Welche Aufgaben übernimmt die IHK als zuständige Stelle in der dualen Berufsausbildung?","o":["Sie zahlt die Ausbildungsvergütung und stellt die Arbeitsmittel","Sie erstellt die Stundenpläne und Lehrpläne der Berufsschule","Sie schließt den Ausbildungsvertrag mit den Auszubildenden ab","Sie trägt die Verträge ein, überwacht die Ausbildung und nimmt die Prüfungen ab"],"c":3,"e":"Die IHK führt das Verzeichnis der Ausbildungsverhältnisse, berät und überwacht die Betriebe und organisiert die Zwischen- und Abschlussprüfungen. Vertragspartner und Zahler der Vergütung ist dagegen der Ausbildungsbetrieb."},{"q":"Wann und in welcher Form muss der Berufsausbildungsvertrag nach dem BBiG geschlossen werden?","o":["Spätestens am Ende der Probezeit, formlos","Spätestens vor der Zwischenprüfung, in Textform","Vor Beginn der Ausbildung, mit schriftlicher Niederlegung des wesentlichen Inhalts","Innerhalb des ersten Monats der Ausbildung, mündlich ausreichend"],"c":2,"e":"Nach § 10 und § 11 BBiG ist der Vertrag vor Beginn der Ausbildung zu schließen und sein wesentlicher Inhalt schriftlich niederzulegen. Eine mündliche Vereinbarung wäre zwar wirksam, die schriftliche Niederlegung ist aber gesetzliche Pflicht des Ausbildenden."},{"q":"Auszubildende der Exclusiva GmbH müssen einen Ausbildungsnachweis führen. Worum handelt es sich dabei?","o":["Um das regelmäßig geführte Berichtsheft über Ausbildungsinhalte und Tätigkeiten","Um das Zeugnis der Berufsschule am Ende jedes Schuljahres","Um die Bescheinigung der IHK über die Eintragung des Vertrags","Um das betriebliche Zeugnis nach Abschluss der Ausbildung"],"c":0,"e":"Der Ausbildungsnachweis ist das schriftlich oder elektronisch geführte Berichtsheft, in dem Tätigkeiten und Lerninhalte dokumentiert werden; er ist Zulassungsvoraussetzung zur Abschlussprüfung. Zeugnisse und die Eintragungsbescheinigung sind davon getrennte Dokumente."},{"q":"Welche Angaben gehören nach § 11 BBiG zwingend in den Berufsausbildungsvertrag?","o":["Schulabschluss, Notenspiegel und bisherige Praktika der Auszubildenden","Beginn und Dauer der Ausbildung, Vergütung, Probezeit und Urlaub","Name der Berufsschule, Klassenlehrkraft und Stundenplan","Zuständige IHK, Prüfungstermine und Prüfungsausschuss"],"c":1,"e":"Der Vertrag muss unter anderem Ziel, Beginn und Dauer der Ausbildung, Ausbildungszeit, Probezeit, Vergütung, Urlaub und Kündigungsvoraussetzungen enthalten. Angaben zur Berufsschule oder zu Prüfungsterminen sind keine Pflichtinhalte des Vertrags."}]},{"name":"Quiz 6","topic":"Rechte, Pflichten und Jugendarbeitsschutz","src":"Kapitel 1.11 und 1.12, Buch S. 105 bis 110","mc":[{"q":"Welche Pflicht nach § 13 BBiG gilt als Kernpflicht der Auszubildenden der Exclusiva GmbH?","o":["Die Pflicht, die Berufsschule regelmäßig zu besuchen","Die Pflicht, den Ausbildungsnachweis ordentlich zu führen","Die Pflicht, sich zu bemühen, das Ausbildungsziel zu erreichen","Die Pflicht, Betriebs- und Geschäftsgeheimnisse zu wahren"],"c":2,"e":"Die Kernpflicht der Auszubildenden ist die Lernpflicht: Sie müssen sich bemühen, die für das Ausbildungsziel nötigen Fertigkeiten und Kenntnisse zu erwerben. Berufsschulbesuch, Ausbildungsnachweis und Schweigepflicht sind daraus abgeleitete Nebenpflichten."},{"q":"Welche Pflicht nach § 14 BBiG gilt als Kernpflicht der Ausbildenden, also der Exclusiva GmbH als Ausbildungsbetrieb?","o":["Die Pflicht, die Ausbildungsinhalte planmäßig zu vermitteln","Die Pflicht, den Ausbildungsnachweis regelmäßig zu prüfen","Die Pflicht, ein Zeugnis über die Ausbildung zu erteilen","Die Pflicht, für den Berufsschulunterricht freizustellen"],"c":0,"e":"Die Kernpflicht der Ausbildenden ist die Ausbildungspflicht: Sie müssen die Fertigkeiten und Kenntnisse vermitteln, die zum Erreichen des Ausbildungsziels nötig sind. Freistellung, Zeugnis und Prüfung des Ausbildungsnachweises sind Nebenpflichten."},{"q":"Wer trägt nach § 14 BBiG die Kosten für die Ausbildungsmittel, die zur Berufsausbildung und zur Prüfung erforderlich sind?","o":["Die Auszubildenden aus ihrer Ausbildungsvergütung","Die zuständige Industrie- und Handelskammer","Die Berufsschule aus ihrem Lehrmittelbudget","Der Ausbildungsbetrieb kostenlos für die Auszubildenden"],"c":3,"e":"Ausbildende müssen den Auszubildenden die erforderlichen Ausbildungsmittel wie Werkzeuge und Werkstoffe kostenlos zur Verfügung stellen. Die IHK ist nur für die Überwachung und die Prüfungen zuständig, nicht für die Ausstattung."},{"q":"Welche Aussage zur Ausbildungsvergütung nach § 17 BBiG ist richtig?","o":["Sie ist frei verhandelbar und bleibt über die gesamte Ausbildung gleich","Sie muss angemessen sein und mit fortschreitender Ausbildung ansteigen","Sie richtet sich nach dem Mindestlohngesetz und steigt halbjährlich","Sie wird erst nach bestandener Zwischenprüfung in voller Höhe gezahlt"],"c":1,"e":"Die Ausbildungsvergütung muss angemessen sein und mindestens jährlich ansteigen; zusätzlich gilt die Mindestausbildungsvergütung des BBiG. Das Mindestlohngesetz gilt für Auszubildende ausdrücklich nicht."},{"q":"Wie kann die Exclusiva GmbH ein Ausbildungsverhältnis nach Ablauf der Probezeit gemäß § 22 BBiG kündigen?","o":["Nur fristlos aus einem wichtigen Grund","Ordentlich mit einer Frist von vier Wochen","Ordentlich mit einer Frist von drei Monaten","Nur mit Zustimmung der zuständigen IHK"],"c":0,"e":"Nach der Probezeit darf der Ausbildungsbetrieb nur noch aus einem wichtigen Grund ohne Einhaltung einer Kündigungsfrist kündigen. Eine ordentliche Kündigung mit Frist steht nach der Probezeit allein den Auszubildenden zu."},{"q":"Mit welcher Frist können Auszubildende nach der Probezeit kündigen, wenn sie die Berufsausbildung aufgeben oder einen anderen Beruf erlernen wollen?","o":["Fristlos ohne Angabe von Gründen","Mit einer Frist von zwei Wochen","Mit einer Frist von vier Wochen","Mit einer Frist von drei Monaten"],"c":2,"e":"Auszubildende können nach der Probezeit mit einer Kündigungsfrist von vier Wochen kündigen, wenn sie die Ausbildung aufgeben oder eine andere Berufstätigkeit anstreben. Eine fristlose Kündigung ist nur aus wichtigem Grund möglich."},{"q":"Wann endet das Ausbildungsverhältnis nach § 21 BBiG, wenn die Abschlussprüfung vor Ablauf der vereinbarten Ausbildungszeit bestanden wird?","o":["Mit Ablauf der im Ausbildungsvertrag vereinbarten Ausbildungszeit","Mit dem Ende des Monats, in dem die Prüfung abgelegt wurde","Mit dem Zugang des schriftlichen Prüfungszeugnisses der IHK","Mit der Bekanntgabe des Ergebnisses durch den Prüfungsausschuss"],"c":3,"e":"Wird die Abschlussprüfung vor Ablauf der Ausbildungszeit bestanden, endet das Ausbildungsverhältnis bereits mit der Bekanntgabe des Ergebnisses durch den Prüfungsausschuss. Auf die vereinbarte Vertragsdauer oder das spätere Zeugnis kommt es dann nicht mehr an."},{"q":"Wofür muss die Exclusiva GmbH ihre Auszubildenden nach § 15 BBiG freistellen?","o":["Für die Teilnahme an Weiterbildungen privater Bildungsanbieter","Für den Berufsschulunterricht und die Teilnahme an Prüfungen","Für die Prüfungsvorbereitung in den letzten zwei Wochen vor der Prüfung","Für die Mitarbeit in der Jugendvertretung eines anderen Betriebs"],"c":1,"e":"Auszubildende müssen für den Berufsschulunterricht, für Prüfungen und für außerbetriebliche Ausbildungsmaßnahmen freigestellt werden. Eine allgemeine Freistellung zur Prüfungsvorbereitung sieht das BBiG nicht vor, wohl aber den Arbeitstag unmittelbar vor der schriftlichen Abschlussprüfung."},{"q":"Worauf bezieht sich die Schweigepflicht der Auszubildenden nach § 13 BBiG?","o":["Auf Betriebs- und Geschäftsgeheimnisse des Ausbildungsbetriebs","Auf sämtliche Gespräche mit Kolleginnen und Kollegen im Betrieb","Auf die eigene Ausbildungsvergütung und die persönlichen Daten","Auf alle Inhalte des Ausbildungsnachweises und der Berufsschule"],"c":0,"e":"Auszubildende müssen über Betriebs- und Geschäftsgeheimnisse Stillschweigen bewahren, etwa über Kalkulationen, Lieferantenkonditionen oder Kundendaten der Exclusiva GmbH. Alltägliche betriebliche Gespräche oder Ausbildungsinhalte fallen nicht darunter."},{"q":"Worauf haben Auszubildende nach § 16 BBiG bei Beendigung des Ausbildungsverhältnisses Anspruch?","o":["Auf eine Abfindung in Höhe einer Monatsvergütung","Auf eine Übernahme in ein befristetes Arbeitsver
